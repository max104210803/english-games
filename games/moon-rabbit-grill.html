<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月兔烤台 Moon Rabbit Grill</title>
<style>
  :root {
    --bg-top: #1a2744;
    --bg-bot: #070b14;
    --panel: rgba(22,32,51,.85);
    --ink: #f7f1e5;
    --muted: #a8b4c8;
    --amber: #ffb703;
    --ember: #ff6b2c;
    --gold: #ffd27a;
    --moon: #7ec8ff;
    --ok: #7dffa1;
    --bad: #ff7b7b;
    --brown: #4a3428;
    --apron: #e86a33;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
    color: var(--ink);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    overflow-x: hidden;
  }
  body { padding: 6px 0 16px; }
  .hidden { display: none !important; }

  .stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .stars circle { fill: #fff; opacity: .7; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:.3} 50%{opacity:.9} }

  #app { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 14px; }

  header { text-align: center; margin-bottom: 2px; }
  h1 {
    margin: 0;
    font-size: clamp(26px, 4.2vw, 42px);
    font-weight: 900;
    color: var(--amber);
    text-shadow: 0 0 12px rgba(255,183,3,.4), 0 2px 0 rgba(0,0,0,.3);
  }
  .subtitle { color: var(--muted); font-size: 15px; margin-top: 2px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 8px; flex-wrap: wrap;
  }
  .badge {
    background: var(--panel); border: 1px solid rgba(255,183,3,.25);
    color: var(--amber); padding: 5px 14px; border-radius: 999px; font-weight: 700; font-size: 14px;
  }
  .stars-row { display: flex; gap: 5px; }
  .star { font-size: 20px; filter: grayscale(1); opacity: .35; transition: .3s; }
  .star.on { filter: grayscale(0); opacity: 1; }

  .lanterns {
    display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; flex: 1; padding-top: 6px;
  }
  .lantern {
    width: 46px; height: 48px; position: relative;
    background: radial-gradient(circle at 40% 30%, #ff7b7b, #c92a2a 60%, #5a1212 100%);
    border-radius: 12px; border: 2px solid #5a1212; box-shadow: inset 0 -4px 8px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 900; color: #fff; text-align: center; line-height: 1.1;
    opacity: .35; transition: .4s;
  }
  .lantern:not(.on) { font-size: 18px; color: rgba(255,255,255,.8); }
  .lantern.on { opacity: 1; box-shadow: 0 0 16px rgba(255,123,123,.55), inset 0 -4px 8px rgba(0,0,0,.25); }
  .lantern::before { content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 14px; height: 6px; background: #ffd27a; border-radius: 2px; }

  .card {
    background: var(--panel); border: 1px solid rgba(126,200,255,.15);
    border-radius: 18px; padding: 10px 16px; margin-bottom: 6px;
    box-shadow: 0 12px 36px rgba(0,0,0,.35); backdrop-filter: blur(6px);
  }

  .scene-row {
    display: flex; align-items: flex-end; justify-content: center; gap: 14px;
    margin: 8px 0 10px; min-height: 210px;
  }
  @media (max-width: 768px) {
    .scene-row { flex-direction: column; align-items: center; min-height: auto; }
  }

  .rabbit-wrap { position: relative; width: 184px; height: 220px; flex-shrink: 0; }
  @media (max-width: 768px) { .rabbit-wrap { width: 160px; height: 200px; } }

  .bubble {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    background: #fff7e6; color: var(--brown); border-radius: 14px;
    padding: 8px 14px; font-size: 14px; font-weight: 700; white-space: nowrap;
    box-shadow: 0 4px 12px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .25s;
    z-index: 10;
  }
  .bubble.show { opacity: 1; }
  .bubble::after {
    content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    border-width: 8px 8px 0; border-style: solid; border-color: #fff7e6 transparent transparent;
  }

  #rb-root { width: 100%; height: 100%; overflow: visible; }
  #rb-root * { transform-box: fill-box; }
  .rb-part { transition: transform .2s ease; }
  #rb-head { transform-origin: 100px 110px; }
  #rb-ear-l { transform-origin: 82px 78px; }
  #rb-ear-r { transform-origin: 118px 78px; }
  #rb-arm-l { transform-origin: 76px 148px; }
  #rb-arm-r { transform-origin: 124px 148px; }
  #rb-body { transform-origin: 100px 180px; }

  /* idle */
  .pose-idle #rb-body { animation: rbBreathe 2.4s ease-in-out infinite; }
  .pose-idle #rb-head { animation: rbHead 3s ease-in-out infinite; }
  .pose-idle #rb-ear-l { animation: rbEarL 2.8s ease-in-out infinite; }
  .pose-idle #rb-ear-r { animation: rbEarR 2.8s ease-in-out infinite; }
  @keyframes rbBreathe { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.03)} }
  @keyframes rbHead { 0%,100%{transform:rotate(0)} 50%{transform:rotate(2deg)} }
  @keyframes rbEarL { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-6deg)} }
  @keyframes rbEarR { 0%,100%{transform:rotate(0)} 50%{transform:rotate(6deg)} }

  /* poses */
  .pose-dash #rb-root { animation: rbDash .6s ease-in-out 2; }
  .pose-dash #rb-ear-l, .pose-dash #rb-ear-r { transform: rotate(-25deg); }
  @keyframes rbDash { 0%,100%{transform:translateX(0)} 50%{transform:translateX(30px)} }

  .pose-holler #rb-arm-l { transform: rotate(140deg) translateY(-18px); }
  .pose-holler #rb-arm-r { transform: rotate(-140deg) translateY(-18px); }
  .pose-holler #rb-head { animation: rbHoller .35s ease-in-out 4; }
  @keyframes rbHoller { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

  .pose-boast #rb-arm-l { transform: rotate(160deg) translateY(-24px); }
  .pose-boast #rb-arm-r { transform: rotate(-160deg) translateY(-24px); }
  .pose-boast #rb-head { transform: rotate(-5deg); }

  .pose-ashamed #rb-ear-l, .pose-ashamed #rb-ear-r { transform: rotate(0deg) translateY(12px); }
  .pose-ashamed #rb-head { transform: translateY(6px); }
  .pose-ashamed #rb-arm-l { transform: rotate(70deg) translateY(-16px); }
  .pose-ashamed #rb-arm-r { transform: rotate(-70deg) translateY(-16px); }

  .pose-plenty #rb-arm-l { transform: rotate(110deg) translateY(-28px); }
  .pose-plenty #rb-arm-r { transform: rotate(-110deg) translateY(-28px); }
  .pose-plenty #rb-body { animation: rbPlenty .45s ease-in-out infinite; }
  @keyframes rbPlenty { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-2deg)} 75%{transform:rotate(2deg)} }

  .pose-victory #rb-arm-r { transform: rotate(-170deg) translateY(-40px); }
  .pose-victory #rb-root { animation: rbJump .55s ease-in-out 2; }
  @keyframes rbJump { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-18px)} }

  .pose-similarities #rb-arm-l { transform: rotate(90deg) translateY(-22px); }
  .pose-similarities #rb-arm-r { transform: rotate(-90deg) translateY(-22px); }
  .pose-similarities #rb-head { animation: rbCompare .8s ease-in-out infinite; }
  @keyframes rbCompare { 0%,100%{transform:rotate(0)} 50%{transform:rotate(5deg)} }

  .pose-wisdom #rb-arm-r { transform: rotate(-130deg) translateY(-18px); }
  .pose-wisdom #rb-head { animation: rbThink 2s ease-in-out infinite; }
  @keyframes rbThink { 0%,100%{transform:rotate(0)} 50%{transform:rotate(3deg)} }

  .pose-happy #rb-root { animation: rbHappy .55s ease-in-out 2; }
  @keyframes rbHappy { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }

  .pose-burn #rb-ear-l, .pose-burn #rb-ear-r { transform: rotate(0deg) translateY(8px); }
  .pose-burn #rb-root { animation: rbBurn .2s ease-in-out 4; }
  @keyframes rbBurn { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-3px)} }

  .pose-sad #rb-ear-l, .pose-sad #rb-ear-r { transform: rotate(0deg) translateY(10px); }
  .pose-sad #rb-head { transform: translateY(5px); }

  .grill-zone { position: relative; width: 320px; height: 220px; flex-shrink: 0; }
  @media (max-width: 768px) { .grill-zone { width: 280px; height: 200px; } }

  .gauge {
    position: absolute; left: 10px; right: 10px; bottom: -10px; height: 14px;
    background: rgba(0,0,0,.5); border-radius: 999px; overflow: hidden; border: 1px solid rgba(255,255,255,.1);
  }
  .gauge-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--ok), var(--gold), var(--ember), #3d2b24); transition: width .05s linear; }
  .gauge-zone {
    position: absolute; left: 35%; width: 33%; top: 0; bottom: 0;
    background: rgba(255,210,122,.25); border-left: 2px dashed var(--gold); border-right: 2px dashed var(--gold);
  }

  .scenario {
    display: flex; align-items: flex-start; gap: 12px;
  }
  .npc { flex-shrink: 0; width: 64px; height: 64px; clip-path: circle(50%); }
  .speech-box {
    flex: 1; background: rgba(11,16,32,.7); border-left: 4px solid var(--amber); border-radius: 12px;
    padding: 12px 14px; line-height: 1.7; font-size: 16px;
  }
  .speech-box .en { color: var(--ink); }
  .speech-box .zh { color: var(--muted); font-size: 14px; margin-top: 5px; }
  .blank { display: inline-block; min-width: 74px; border-bottom: 2px dashed var(--amber); color: var(--amber); font-weight: 900; padding: 0 6px; text-align: center; }

  .coals { display: flex; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .coal {
    appearance: none; border: none; min-width: 86px; min-height: 52px; padding: 10px 14px;
    background: radial-gradient(circle at 35% 30%, #ff8a50, #a83210 55%, #3d1206 100%);
    color: #fff; font-size: 17px; font-weight: 900; border-radius: 14px;
    box-shadow: 0 4px 0 #2a0b05, 0 8px 18px rgba(255,107,44,.35);
    cursor: pointer; transition: transform .12s, filter .12s; position: relative;
  }
  .coal:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.12); }
  .coal:active:not(:disabled) { transform: translateY(2px); }
  .coal:disabled { opacity: .45; filter: grayscale(.7); cursor: not-allowed; }
  .coal.hint { box-shadow: 0 0 0 3px var(--gold), 0 4px 0 #2a0b05, 0 8px 22px rgba(255,210,122,.5); animation: hintPulse 1s ease-in-out infinite; }
  @keyframes hintPulse { 0%,100%{box-shadow:0 0 0 3px rgba(255,210,122,.6),0 4px 0 #2a0b05} 50%{box-shadow:0 0 0 6px rgba(255,210,122,.3),0 4px 0 #2a0b05} }

  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 4px; }
  @media (max-width: 768px) { .choices { grid-template-columns: 1fr; } }
  .choice {
    text-align: left; background: rgba(255,255,255,.07); color: var(--ink); border: 2px solid rgba(255,255,255,.12);
    border-radius: 14px; padding: 13px 16px; font-size: 16px; cursor: pointer; transition: .2s;
  }
  .choice:hover:not(:disabled) { background: rgba(255,255,255,.12); border-color: var(--amber); }
  .choice:disabled { cursor: default; }
  .choice.correct { border-color: var(--ok); background: rgba(125,255,161,.12); }
  .choice.wrong { border-color: var(--bad); background: rgba(255,123,123,.12); }

  .feedback {
    min-height: 32px; margin-top: 6px; text-align: center;
    font-size: 16px; font-weight: 700; color: var(--gold);
  }

  .controls { margin-top: 14px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .controls:empty { display: none; }
  .btn {
    appearance: none; border: none; background: linear-gradient(135deg, var(--amber), #fb8500);
    color: #1a0f00; font-size: 17px; font-weight: 900; padding: 13px 26px; border-radius: 999px;
    cursor: pointer; box-shadow: 0 5px 0 #9c5400, 0 10px 22px rgba(255,183,3,.25);
    transition: transform .12s;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .btn:active { transform: translateY(3px); }

  .end-story {
    background: rgba(11,16,32,.72); border-radius: 14px; padding: 16px; line-height: 1.8;
    border: 1px solid rgba(126,200,255,.18); margin-top: 10px;
  }

  .mute-btn {
    position: fixed; top: 10px; right: 10px; z-index: 50;
    background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.2);
    color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }


  /* 食物三種狀態：由 #grill[data-cook] 切換 */
  #grill { --sausage:#f3a39d; --sausage-mark:#d9837c; --kernel:#f7e27c; --cob:#efd35a; --meat:#e89a8b; --husk:#8bc34a; --pepper:#7cb342; }
  #grill[data-cook="perfect"] { --sausage:#c9652f; --sausage-mark:#6e2d12; --kernel:#f2b736; --cob:#d99a2b; --meat:#a5532c; --husk:#a3a63c; --pepper:#5f8a2c; }
  #grill[data-cook="burnt"] { --sausage:#3a2520; --sausage-mark:#1a0f0b; --kernel:#4a3b22; --cob:#3a2e1c; --meat:#2c1b14; --husk:#3f3f25; --pepper:#2f3a1d; }
  #grill .sausage-body { fill: var(--sausage); }
  #grill .corn-cob { fill: var(--cob); }
  #grill .corn-kernel { fill: var(--kernel); }
  #grill .corn-husk { fill: var(--husk); }
  #grill .skewer-meat { fill: var(--meat); }
  #grill .skewer-pepper { fill: var(--pepper); }
  #grill .sausage-body, #grill .corn-cob, #grill .corn-kernel, #grill .corn-husk, #grill .skewer-meat, #grill .skewer-pepper { transition: fill .5s; }
  #grill .grill-marks { opacity: 0; transition: opacity .5s; }
  #grill[data-cook="perfect"] .grill-marks { opacity: 1; }
  #grill[data-cook="burnt"] .grill-marks { opacity: .5; }
  #sparkles, #burn-smoke { opacity: 0; transition: opacity .4s; }
  #grill[data-cook="perfect"] #sparkles { opacity: 1; animation: sparkle 0.9s ease-in-out infinite; }
  #grill[data-cook="burnt"] #burn-smoke { opacity: 1; }
  #grill[data-cook="perfect"] #grill-top { filter: drop-shadow(0 0 8px rgba(255,210,122,.9)); }
  @keyframes sparkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  /* 月亮放在烤肉架右側，不蓋到上方情境句 */
  #change-moon { position: absolute; top: -6px; right: -128px; width: 110px; height: 110px; overflow: visible; }
  @media (max-width: 768px) { #change-moon { top: -60px; right: -40px; } }

  /* 嫦娥揮手 */
  #change-arm { transform-box: fill-box; transform-origin: 0% 100%; animation: changeWave 1.4s ease-in-out infinite; }
  @keyframes changeWave { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(14deg); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

  @media (max-width: 768px) {
    .topbar .lanterns { order: 3; flex-basis: 100%; }
    h1 { font-size: 24px; }
    .lantern { width: 38px; height: 48px; font-size: 9px; }
    .rabbit-wrap { width: 150px; height: 190px; }
    .grill-zone { width: 260px; height: 180px; }
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<button class="mute-btn" id="mute-btn" aria-label="靜音">🔊</button>

<div id="app">
  <header>
    <h1>月兔烤台 Moon Rabbit Grill</h1>
    <div class="subtitle" id="subtitle">幫月兔圓圓把英文單字烤熟，讓嫦娥也聞到團圓的香味</div>
  </header>

  <div class="topbar">
    <div class="badge" id="night-badge">第 1 夜</div>
    <div class="lanterns" id="lanterns"></div>
    <div class="stars-row" id="stars-row"><span class="star">⭐</span><span class="star">⭐</span><span class="star">⭐</span></div>
  </div>

  <section class="card">
    <div class="scenario" id="scenario">
      <svg class="npc" id="npc-grandma" viewBox="0 0 64 64"><circle cx="32" cy="32" r="31" fill="#3d3160"/><path d="M9 62Q11 44 32 44Q53 44 55 62Q32 67 9 62Z" fill="#8e6bbf" stroke="var(--brown)" stroke-width="1.5"/><path d="M26 45L32 54L38 45" fill="#f3e5f5" stroke="var(--brown)" stroke-width="1.2"/><circle cx="32" cy="11" r="6.5" fill="#eceff1" stroke="var(--brown)" stroke-width="1.3"/><circle cx="32" cy="29" r="14" fill="#f6dcc4" stroke="var(--brown)" stroke-width="1.5"/><path d="M18 28Q18 15 32 15Q46 15 46 28Q42 21 32 22Q22 21 18 28Z" fill="#eceff1" stroke="var(--brown)" stroke-width="1.3"/><path d="M24.5 30.5q2-1.8 4 0M35.5 30.5q2-1.8 4 0" stroke="var(--brown)" stroke-width="1.4" fill="none" stroke-linecap="round"/><ellipse cx="23" cy="36" rx="2.6" ry="1.5" fill="#ff8a80" opacity=".55"/><ellipse cx="41" cy="36" rx="2.6" ry="1.5" fill="#ff8a80" opacity=".55"/><circle cx="26.5" cy="30" r="4.3" fill="#fff" fill-opacity=".2" stroke="#6d4c41" stroke-width="1.4"/><circle cx="37.5" cy="30" r="4.3" fill="#fff" fill-opacity=".2" stroke="#6d4c41" stroke-width="1.4"/><path d="M30.8 30h2.4" stroke="#6d4c41" stroke-width="1.4"/><path d="M29 37.5q3 2.5 6 0" stroke="var(--brown)" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>

<script id="game-core">
/* 月兔烤台：遊戲核心（純邏輯，不碰 DOM、不讀時鐘、不用 Math.random）
 * 由 Claude 撰寫並以 check_game.mjs 驗證通過。
 * 用法：整段貼進 HTML 的 <script id="game-core">，UI 只負責：
 *   1. 每個 requestAnimationFrame 呼叫 game.tick(dt)（dt＝與上一幀的毫秒差）
 *   2. 依 game.getState() 重畫畫面
 *   3. 把玩家操作轉成 game.start() / next() / pick(word) / choose(index) / restart()
 */
var MoonGrillCore = (function () {
  'use strict';

  var BLANK = '______';

  function shuffle(arr, rng) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function createGame(content, opts) {
    var T = content.timing;
    var W = content.words;
    var rng = opts && opts.rng;
    if (typeof rng !== 'function') throw new Error('createGame 需要 opts.rng');

    var s;

    function fresh() {
      return {
        phase: 'title', night: 0, scene: 0, slot: 0, word: null,
        poseLeft: 0, cookMs: 0, cookState: 'raw', lockMs: 0,
        waitMs: 0, pending: null, lastResult: null,
        options: [], disabled: [], burns: 0, hintWord: null,
        bubble: '', sentenceEn: '', sentenceZh: '',
        choices: [], answerIndex: -1, picked: -1,
        score: 0, collected: [], storyLines: []
      };
    }
    s = fresh();

    function sceneData() { return content.nights[s.night].scenes[s.scene]; }

    function wait(ms, fn) { s.waitMs = ms; s.pending = fn; }

    function enterIntro(n) {
      s.phase = 'intro'; s.night = n; s.word = null;
      s.bubble = '今晚我來烤！';
      s.sentenceEn = ''; s.sentenceZh = content.nights[n].intro;
      s.choices = []; s.answerIndex = -1; s.picked = -1; s.options = [];
    }

    function enterPose(i) {
      s.phase = 'pose'; s.scene = i;
      var sc = sceneData();
      s.word = sc.word;
      s.poseLeft = T.poseMs;
      s.cookMs = 0; s.cookState = 'raw'; s.lockMs = 0;
      s.burns = 0; s.hintWord = null; s.disabled = []; s.options = [];
      s.bubble = W[s.word].bubble;
      s.sentenceEn = sc.en; s.sentenceZh = sc.zh;
      s.choices = []; s.answerIndex = -1; s.picked = -1; s.lastResult = null;
    }

    function enterCooking() {
      var sc = sceneData();
      s.phase = 'cooking';
      s.cookMs = 0; s.cookState = 'raw'; s.lockMs = 0; s.disabled = [];
      var opts = [s.word].concat(sc.distractors);
      var last = s.collected[s.collected.length - 1];
      if (last && opts.indexOf(last) < 0) opts.push(last);
      s.options = shuffle(opts, rng);
      s.bubble = '';
    }

    function updateCookState() {
      if (s.cookMs < T.perfectStartMs) s.cookState = 'raw';
      else if (s.cookMs <= T.perfectEndMs) s.cookState = 'perfect';
      else s.cookState = 'burnt';
    }

    function burn() {
      s.burns += 1;
      s.cookState = 'burnt';
      if (s.burns >= T.hintAfterBurns) s.hintWord = s.word;
      if (s.burns >= T.maxBurns) wait(T.burnPauseMs, enterMeaning);
      else wait(T.burnPauseMs, enterCooking);
    }

    function enterMeaning() {
      var sc = sceneData();
      var correct = W[s.word].zh;
      var others = Object.keys(W).map(function (k) { return W[k].zh; })
        .filter(function (z) { return z !== correct; });
      s.phase = 'meaning';
      s.sentenceEn = sc.en.replace(BLANK, W[s.word].en);
      s.sentenceZh = sc.zh;
      s.choices = shuffle([correct].concat(shuffle(others, rng).slice(0, 2)), rng);
      s.answerIndex = s.choices.indexOf(correct);
      s.picked = -1; s.options = []; s.bubble = '';
    }

    function enterReflect() {
      var r = content.nights[s.night].reflect;
      var order = shuffle(r.choices, rng);
      s.phase = 'reflect'; s.word = null;
      s.sentenceEn = r.en; s.sentenceZh = r.zh;
      s.choices = order.map(function (c) { return c.text; });
      s.answerIndex = order.findIndex(function (c) { return c.type === 'wisdom'; });
      s.picked = -1; s.options = []; s.bubble = '';
    }

    function enterStory() {
      s.phase = 'story';
      s.storyLines = [content.story.opening.en];
      enterSlot(0);
    }

    function enterSlot(k) {
      var sl = content.story.slots[k];
      s.slot = k; s.word = null;
      s.sentenceEn = sl.en; s.sentenceZh = sl.label;
      s.choices = shuffle(sl.options, rng).map(function (w) { return W[w].en; });
      s.answerIndex = s.choices.indexOf(W[sl.answer].en);
      s.picked = -1;
    }

    function nextScene() {
      if (s.scene + 1 < content.nights[s.night].scenes.length) enterPose(s.scene + 1);
      else enterReflect();
    }

    function afterReflect() {
      if (s.night + 1 < content.nights.length) enterIntro(s.night + 1);
      else enterStory();
    }

    function afterSlot() {
      if (s.slot + 1 < content.story.slots.length) enterSlot(s.slot + 1);
      else {
        s.storyLines.push(content.story.ending.en);
        s.phase = 'end'; s.choices = []; s.answerIndex = -1;
        s.bubble = '謝謝你！';
      }
    }

    function canPick() { return s.phase === 'cooking' && s.lockMs === 0 && s.waitMs === 0; }

    var api = {
      start: function () { if (s.phase === 'title') enterIntro(0); },
      next: function () { if (s.phase === 'intro' && s.waitMs === 0) enterPose(0); },
      restart: function () { s = fresh(); enterIntro(0); },

      tick: function (dt) {
        dt = Math.max(0, Math.min(Number(dt) || 0, T.maxTickMs));
        if (s.waitMs > 0) {
          s.waitMs -= dt;
          if (s.waitMs <= 0) { s.waitMs = 0; var fn = s.pending; s.pending = null; fn(); }
          return;
        }
        if (s.phase === 'pose') {
          s.poseLeft -= dt;
          if (s.poseLeft <= 0) enterCooking();
        } else if (s.phase === 'cooking') {
          if (s.lockMs > 0) {
            s.lockMs -= dt;
            if (s.lockMs <= 0) {
              s.lockMs = 0;
              s.cookMs = Math.min(s.cookMs, T.perfectStartMs - T.wrongRewindMs);
              s.bubble = '';
              updateCookState();
            }
            return;
          }
          s.cookMs += dt;
          updateCookState();
          if (s.cookMs >= T.cookEndMs) burn();
        }
      },

      pick: function (w) {
        if (!canPick() || s.options.indexOf(w) < 0 || s.disabled.indexOf(w) >= 0) return 'ignored';
        var r;
        if (w !== s.word) {
          s.disabled.push(w);
          s.lockMs = T.wrongLockMs;
          s.bubble = W[w].bubble;
          r = 'wrong';
        } else if (s.cookMs < T.perfectStartMs) {
          r = 'early';
        } else if (s.cookMs <= T.perfectEndMs) {
          s.cookState = 'perfect';
          s.score += 2;
          if (s.collected.indexOf(w) < 0) s.collected.push(w);
          wait(T.afterPerfectMs, enterMeaning);
          r = 'perfect';
        } else {
          burn();
          r = 'burnt';
        }
        s.lastResult = r;
        return r;
      },

      choose: function (i) {
        var ok = s.phase === 'meaning' || s.phase === 'reflect' || s.phase === 'story';
        if (!ok || s.waitMs > 0 || s.picked >= 0 || i < 0 || i >= s.choices.length) return 'ignored';
        s.picked = i;
        var correct = i === s.answerIndex;
        if (s.phase === 'meaning') {
          if (correct) s.score += 2;
          wait(T.afterChoiceMs, nextScene);
        } else if (s.phase === 'reflect') {
          if (correct) s.score += 1;
          wait(T.afterReflectMs, afterReflect);
        } else {
          if (correct) s.score += 1;
          var sl = content.story.slots[s.slot];
          s.storyLines.push(sl.en.replace(BLANK, W[sl.answer].en));
          wait(T.afterChoiceMs, afterSlot);
        }
        s.lastResult = correct ? 'correct' : 'wrong';
        return s.lastResult;
      },

      getState: function () {
        return {
          phase: s.phase, night: s.night, scene: s.scene, slot: s.slot, word: s.word,
          cookMs: s.cookMs, cookState: s.cookState, canPick: canPick(),
          waiting: s.waitMs > 0, lastResult: s.lastResult,
          options: s.options.slice(), disabled: s.disabled.slice(),
          burns: s.burns, hintWord: s.hintWord,
          bubble: s.bubble, sentenceEn: s.sentenceEn, sentenceZh: s.sentenceZh,
          choices: s.choices.slice(), answerIndex: s.answerIndex, picked: s.picked,
          score: s.score, collected: s.collected.slice(), storyLines: s.storyLines.slice()
        };
      }
    };
    return api;
  }

  return { createGame: createGame };
})();

</script>

<script>
(function() {
  'use strict';
  const CONTENT = JSON.parse(document.getElementById('game-content').textContent);
  const game = MoonGrillCore.createGame(CONTENT, { rng: Math.random });

  const $ = id => document.getElementById(id);
  const elNight = $('night-badge');
  const elSubtitle = $('subtitle');
  const elScenarioEn = $('scenario-en');
  const elScenarioZh = $('scenario-zh');
  const elSpeechBox = $('speech-box');
  const elRabbit = $('rb-root');
  const elRabbitBubble = $('rabbit-bubble');
  const elGauge = $('gauge-bar');
  const elCoals = $('coals');
  const elChoices = $('choices');
  const elFeedback = $('feedback');
  const elControls = $('controls');
  const elEndStory = $('end-story');
  const elLanterns = $('lanterns');
  const elMute = $('mute-btn');
  const changeMoon = $('change-moon');
  const elGrill = $('grill');

  let lastTime = 0;
  let muted = false;
  let audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, type, dur, vol) {
    if (muted || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  }
  function sfxPerfect() { ensureAudio(); beep(660,'sine',.1,.08); setTimeout(()=>beep(880,'sine',.15,.06),100); }
  function sfxWrong() { ensureAudio(); beep(180,'sawtooth',.25,.1); }
  function sfxEarly() { ensureAudio(); beep(320,'square',.08,.06); }
  function sfxBurnt() { ensureAudio(); beep(130,'sawtooth',.3,.12); }

  // 背景音樂：五聲音階（宮商角徵羽＝C D E G A）原創旋律＋分解和弦。
  // 第一次按「開始玩」時用 OfflineAudioContext 合成一段 24 秒的音樂，之後循環播放；不需要外部音檔
  const BGM_BPM = 80;
  const BGM_MELODY = [ // [音名, 拍數]，null＝休止；8 小節 × 4 拍
    ['G4', 1], ['A4', .5], ['C5', .5], ['D5', 1], ['C5', 1],
    ['E5', 1.5], ['D5', .5], ['C5', 1], ['A4', 1],
    ['G4', 1], ['A4', .5], ['C5', .5], ['D5', .5], ['E5', .5], ['D5', 1],
    ['C5', 3], [null, 1],
    ['E5', 1], ['G5', 1], ['A5', 1], ['G5', 1],
    ['E5', 1], ['D5', .5], ['E5', .5], ['G5', 2],
    ['A4', 1], ['C5', .5], ['D5', .5], ['E5', 1], ['D5', .5], ['C5', .5],
    ['A4', 1], ['G4', 1], ['C5', 2]
  ];
  const BGM_BASS = ['C3', 'A2', 'D3', 'C3', 'C3', 'A2', 'D3', 'C3']; // 每小節的根音
  const BGM_VOLUME = 0.07; // 比答對答錯音效小
  let bgmGain = null;
  let bgmSource = null;
  let bgmStarting = false;

  function noteFreq(name) {
    const m = /^([A-G])(\d)$/.exec(name);
    const semis = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]];
    return 440 * Math.pow(2, (12 * (Number(m[2]) + 1) + semis - 69) / 12);
  }

  function pluck(ctx, out, freq, t, dur, vol, type) {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(out);
    osc.start(t); osc.stop(t + dur);
  }

  function renderBgm() {
    const beat = 60 / BGM_BPM;
    const length = 32 * beat;
    const rate = 22050;
    const Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const ctx = new Offline(1, Math.ceil(length * rate), rate);
    const out = ctx.destination;
    let t = 0;
    BGM_MELODY.forEach(([n, beats]) => {
      if (n) {
        const d = Math.min(beats * beat * 1.6, length - t); // 撥弦餘音，不超出循環終點
        pluck(ctx, out, noteFreq(n), t, d, 0.5, 'triangle');
        pluck(ctx, out, noteFreq(n) * 2, t, d * 0.5, 0.08, 'sine'); // 高八度泛音，聲音較亮
      }
      t += beats * beat;
    });
    BGM_BASS.forEach((n, bar) => {
      [1, 1.5, 2, 1.5].forEach((ratio, i) => { // 每拍一個分解和弦音：根、五度、八度、五度
        const t0 = (bar * 4 + i) * beat;
        pluck(ctx, out, noteFreq(n) * ratio, t0, Math.min(beat * 1.4, length - t0), i === 0 ? 0.32 : 0.16, 'sine');
      });
    });
    return new Promise((resolve, reject) => {
      ctx.oncomplete = e => resolve(e.renderedBuffer);
      const p = ctx.startRendering();
      if (p && p.then) p.then(resolve, reject);
    });
  }

  function startBgm() {
    if (!audioCtx || bgmSource || bgmStarting) return;
    bgmStarting = true;
    renderBgm().then(buf => {
      if (bgmSource) return;
      const data = buf.getChannelData(0);
      let peak = 0;
      for (let i = 0; i < data.length; i++) peak = Math.max(peak, Math.abs(data[i]));
      if (peak > 0) for (let i = 0; i < data.length; i++) data[i] /= peak;
      bgmGain = audioCtx.createGain();
      bgmGain.gain.value = muted ? 0 : BGM_VOLUME;
      bgmGain.connect(audioCtx.destination);
      bgmSource = audioCtx.createBufferSource();
      bgmSource.buffer = buf;
      bgmSource.loop = true;
      bgmSource.connect(bgmGain);
      bgmSource.start();
    }).catch(() => {}).then(() => { bgmStarting = false; });
  }

  elMute.addEventListener('click', () => {
    muted = !muted; elMute.textContent = muted ? '🔇' : '🔊';
    elMute.setAttribute('aria-label', muted ? '開啟聲音' : '靜音');
    if (bgmGain) bgmGain.gain.setTargetAtTime(muted ? 0 : BGM_VOLUME, audioCtx.currentTime, 0.05);
  });

  function buildLanterns() {
    elLanterns.innerHTML = '';
    Object.keys(CONTENT.words).forEach(w => {
      const d = document.createElement('div');
      d.className = 'lantern'; d.textContent = '？';
      d.dataset.word = w; elLanterns.appendChild(d);
    });
  }
  // 燈籠先只顯示「？」，烤熟那個字才點亮並寫出英文，避免還沒作答就看到答案
  function updateLanterns(collected) {
    elLanterns.querySelectorAll('.lantern').forEach(l => {
      const got = collected.includes(l.dataset.word);
      l.classList.toggle('on', got);
      const text = got ? CONTENT.words[l.dataset.word].en : '？';
      if (l.textContent !== text) l.textContent = text;
    });
  }

  function setFoodState(state) {
    if (elGrill.dataset.cook !== state) elGrill.dataset.cook = state;
  }

  // 畫面分兩層：viewKey 改變時才重建按鈕（避免每幀重建，真人點擊才不會落空）；其餘每幀只更新狀態
  let viewKey = '';
  let curPose = '';

  function setRabbitPose(pose) {
    if (pose === curPose) return;
    curPose = pose;
    const wrap = elRabbit.parentElement;
    Array.from(wrap.classList).filter(c => c.startsWith('pose-')).forEach(c => wrap.classList.remove(c));
    void wrap.offsetWidth;
    wrap.classList.add('pose-' + pose);
  }

  function showBubble(text) {
    if (!text) { elRabbitBubble.classList.remove('show'); return; }
    if (elRabbitBubble.textContent !== text) elRabbitBubble.textContent = text;
    elRabbitBubble.classList.add('show');
  }

  function setFeedback(html) {
    if (elFeedback.innerHTML !== html) elFeedback.innerHTML = html;
  }

  function renderBlank(text) {
    return text.replace(/______/g, '<span class="blank">______</span>');
  }

  function setHTML(el, html) {
    if (el.innerHTML !== html) el.innerHTML = html;
  }

  function resetView() {
    elCoals.innerHTML = '';
    elChoices.innerHTML = '';
    elChoices.classList.add('hidden');
    elControls.innerHTML = '';
    elEndStory.innerHTML = '';
    elEndStory.classList.add('hidden');
  }

  function addButton(text, onClick) {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = text; b.onclick = onClick;
    elControls.appendChild(b);
  }

  function buildChoices(state, asWord) {
    state.choices.forEach((txt, i) => {
      const b = document.createElement('button');
      b.className = 'choice';
      if (asWord) b.innerHTML = '<b>' + txt + '</b>'; else b.textContent = txt;
      b.onclick = () => { const r = game.choose(i); if (r === 'correct') sfxPerfect(); else if (r === 'wrong') sfxWrong(); };
      elChoices.appendChild(b);
    });
    elChoices.classList.remove('hidden');
  }

  function markChoices(state) {
    if (state.picked < 0) return;
    Array.from(elChoices.children).forEach((b, i) => {
      b.disabled = true;
      b.classList.toggle('correct', i === state.answerIndex);
      b.classList.toggle('wrong', i === state.picked && i !== state.answerIndex);
    });
  }

  function showSpeaker(state) {
    const sc = CONTENT.nights[state.night] && CONTENT.nights[state.night].scenes[state.scene];
    const id = (state.phase === 'pose' || state.phase === 'cooking' || state.phase === 'meaning') && sc ? 'npc-' + sc.speaker : '';
    document.querySelectorAll('.npc').forEach(n => { n.style.display = n.id === id ? 'block' : 'none'; });
  }

  function render(state) {
    const T = CONTENT.timing;
    const key = [state.phase, state.night, state.scene, state.slot, state.phase === 'cooking' ? state.options.join(',') : ''].join('|');
    const fresh = key !== viewKey;
    if (fresh) { viewKey = key; resetView(); }

    setHTML(elNight, state.phase === 'title' ? '月兔烤台' : state.phase === 'story' || state.phase === 'end' ? '團圓夜' : CONTENT.nights[state.night].title);
    setHTML(elSubtitle, state.phase === 'end' ? '謝謝你幫圓圓烤完所有單字！' : CONTENT.subtitle);

    const lit = state.score >= 36 ? 3 : state.score >= 24 ? 2 : state.score >= 12 ? 1 : 0;
    document.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('on', i < lit));
    updateLanterns(state.collected);
    showSpeaker(state);

    if (state.phase === 'title') {
      elSpeechBox.style.display = 'none';
      setRabbitPose('idle'); showBubble('');
      setFeedback('準備好開始了嗎？');
      if (fresh) addButton('開始玩', () => { ensureAudio(); startBgm(); game.start(); });
      return;
    }

    elSpeechBox.style.display = 'flex';
    setHTML(elScenarioEn, renderBlank(state.sentenceEn || ''));
    setHTML(elScenarioZh, state.sentenceZh || '');

    if (state.phase !== 'cooking') { elGauge.style.width = '0%'; setFoodState('raw'); }

    if (state.phase === 'intro') {
      setRabbitPose('idle'); showBubble(state.bubble);
      setFeedback('點「開始烤肉」進入這一夜。');
      if (fresh) addButton('開始烤肉', () => game.next());

    } else if (state.phase === 'pose') {
      setRabbitPose(state.word); showBubble(state.bubble);
      setFeedback('看圓圓的表演，猜猜是哪個單字。');

    } else if (state.phase === 'cooking') {
      const wrongWord = state.lastResult === 'wrong' && !state.canPick && !state.waiting ? state.disabled[state.disabled.length - 1] : '';
      const burning = state.waiting && state.cookState === 'burnt';
      const cheering = state.waiting && state.lastResult === 'perfect';
      setRabbitPose(burning ? 'burn' : cheering ? 'happy' : wrongWord || 'idle');
      showBubble(burning ? '哎呀，焦掉了！' : state.bubble);
      elGauge.style.width = Math.min(100, (state.cookMs / T.cookEndMs) * 100) + '%';
      setFoodState(state.cookState);
      if (fresh) {
        state.options.forEach(w => {
          const b = document.createElement('button');
          b.className = 'coal'; b.dataset.word = w;
          b.textContent = CONTENT.words[w].en;
          b.onclick = () => {
            const r = game.pick(w);
            if (r === 'perfect') sfxPerfect();
            else if (r === 'wrong') sfxWrong();
            else if (r === 'early') sfxEarly();
            else if (r === 'burnt') sfxBurnt();
          };
          elCoals.appendChild(b);
        });
      }
      Array.from(elCoals.children).forEach(b => {
        const w = b.dataset.word;
        b.disabled = !state.canPick || state.disabled.includes(w);
        b.classList.toggle('hint', state.hintWord === w);
      });
      let msg = '肉變成金色時，快把正確單字丟上去！';
      if (burning && state.burns >= T.maxBurns) msg = '肉又焦掉了。答案是 <b>' + CONTENT.words[state.word].en + '</b>，我們先看它的意思。';
      else if (burning) msg = '肉焦掉了！再烤一次。';
      else if (state.waiting && state.lastResult === 'perfect') msg = '<span style="color:var(--ok)">完美！火候剛好，單字也對了。</span>';
      else if (wrongWord) msg = '<span style="color:var(--bad)">這不是這題的動作，再試一次！</span>';
      else if (state.hintWord) msg = '提示：發金光的那一個就是答案。';
      else if (state.lastResult === 'early') msg = '還沒熟！等肉變金色再丟。';
      setFeedback(msg);

    } else if (state.phase === 'meaning') {
      if (fresh) buildChoices(state, false);
      markChoices(state);
      if (state.picked < 0) {
        setRabbitPose('wisdom'); showBubble('');
        setFeedback('圓圓想確認：這個單字在句中代表什麼意思？');
      } else if (state.picked === state.answerIndex) {
        setRabbitPose('happy'); setFeedback('<span style="color:var(--ok)">沒錯！圓圓記住了。</span>');
      } else {
        setRabbitPose('sad'); setFeedback('再想想，答案是「' + state.choices[state.answerIndex] + '」。');
      }

    } else if (state.phase === 'reflect') {
      if (fresh) buildChoices(state, false);
      markChoices(state);
      if (state.picked < 0) {
        setRabbitPose('wisdom'); showBubble('');
        setFeedback('圓圓想知道你會怎麼做。');
      } else if (state.picked === state.answerIndex) {
        setRabbitPose('happy'); setFeedback('<span style="color:var(--ok)">圓圓點頭：這就是奶奶說的智慧。</span>');
      } else {
        setRabbitPose('sad'); setFeedback('圓圓歪歪頭：分享才會讓月亮更圓。');
      }

    } else if (state.phase === 'story') {
      if (fresh) buildChoices(state, true);
      markChoices(state);
      setRabbitPose(state.picked >= 0 && state.picked !== state.answerIndex ? 'sad' : 'happy'); showBubble('');
      setFeedback(state.picked < 0 ? '把學到的單字，拼成要對嫦娥說的故事。'
        : state.picked === state.answerIndex ? '<span style="color:var(--ok)">對！故事又多了一句。</span>'
        : '答案是 <b>' + state.choices[state.answerIndex] + '</b>。');

    } else if (state.phase === 'end') {
      setRabbitPose('happy'); showBubble(state.bubble);
      setFeedback('你幫圓圓烤完了 ' + state.collected.length + ' 個單字，得到 ' + state.score + ' 分與 ' + lit + ' 顆星。');
      if (fresh) {
        const zhLines = [CONTENT.story.opening.zh];
        CONTENT.story.slots.forEach(slot => {
          zhLines.push(slot.zh.replace('______', '<b>' + CONTENT.words[slot.answer].en + '</b>'));
        });
        zhLines.push(CONTENT.story.ending.zh);
        const enLines = state.storyLines.map((l, i) => {
          if (i === 0 || i === state.storyLines.length - 1) return l;
          const w = CONTENT.words[CONTENT.story.slots[i - 1].answer].en;
          return l.replace(w, '<b>' + w + '</b>');
        });
        elEndStory.innerHTML = enLines.join('<br>') + '<br><br><span style="color:var(--gold)">中文：</span><br>' + zhLines.join('<br>');
        elEndStory.classList.remove('hidden');
        addButton('再玩一次', () => game.restart());
      }
    }

    changeMoon.style.opacity = 0.55 + (state.collected.length / 8) * 0.45;
  }

  function loop(now) {
    if (!lastTime) lastTime = now;
    const dt = now - lastTime;
    lastTime = now;
    game.tick(dt);
    render(game.getState());
    requestAnimationFrame(loop);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (audioCtx && audioCtx.state === 'running') audioCtx.suspend(); // 切走時音樂暫停
    } else {
      lastTime = performance.now();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
  });

  buildLanterns();
  render(game.getState());
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
