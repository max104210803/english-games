var ROUND = 12, NEWMAX = 8, MAX_OPTS = 4;
var GAP = [0, 1, 3, 7, 14, 30, 60]; // 等級 → 幾天後再出
var KEY = "ch-zixing-daily-v2"; // v2：五站版，組的編號和 v1 不同
var app = document.getElementById("app");

function today(){var d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
var st = load();

function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clear(){app.textContent="";window.scrollTo(0,0)}
function id(d,g){return d+"-"+g}
function known(s){return s&&s.lv>=2}

function plan(only){
  var t=today(), due=[], fresh=[];
  DATA.forEach(function(dk,d){ if(only!==undefined&&only!==d)return;
    dk.groups.forEach(function(_,g){var s=st[id(d,g)]; if(!s)fresh.push([d,g]); else if(s.due<=t)due.push([d,g])});
  });
  due.sort(function(a,b){var x=st[id(a[0],a[1])],y=st[id(b[0],b[1])];return x.lv-y.lv||x.due-y.due});
  // 新題按書的順序，兩類輪流
  if(only===undefined){var by=DATA.map(function(){return []});fresh.forEach(function(p){by[p[0]].push(p)});fresh=[];
    for(var i=0;fresh.length<ROUND&&by.some(function(a){return a.length>i});i++)by.forEach(function(a){if(a[i])fresh.push(a[i])});}
  var take=due.slice(0,ROUND), nNew=Math.min(ROUND-take.length,NEWMAX,fresh.length);
  if(take.length<ROUND-nNew)nNew=Math.min(ROUND-take.length,fresh.length);
  return {due:take.length,fresh:nNew,list:shuffle(take.concat(fresh.slice(0,nNew)))};
}

function home(){
  clear();
  app.appendChild(el("h1","","字形每日一小局"));
  app.appendChild(el("p","sub","每次 12 題，大約 5 分鐘。答錯的組明天會再出現，隔天再答對才算熟。"));
  var p=plan();
  var b=el("button","go");
  if(p.list.length){b.appendChild(document.createTextNode("開始今天的 "+p.list.length+" 題"));b.appendChild(el("small","","複習 "+p.due+" 組・新學 "+p.fresh+" 組"));b.onclick=function(){start(p.list,"今天的小局",false)}}
  else{b.appendChild(document.createTextNode("今天的都完成了！再多練 12 題"));b.appendChild(el("small","","從學過的組裡隨機出題"));b.onclick=function(){start(extra(),"加練",false)}}
  app.appendChild(b);
  DATA.forEach(function(dk,d){
    var n=dk.groups.length, k=0, seen=0;
    dk.groups.forEach(function(_,g){var s=st[id(d,g)];if(s)seen++;if(known(s))k++});
    var box=el("div","deck");box.appendChild(el("b","",dk.name));box.appendChild(el("div","d",dk.desc));
    var bar=el("div","bar"),f=el("i");f.style.width=(k/n*100)+"%";bar.appendChild(f);box.appendChild(bar);
    var row=el("div","row");row.appendChild(el("span","","已熟 "+k+"／"+n+" 組・學過 "+seen+" 組"));
    var only=el("button","","只練這類");only.onclick=function(){var q=plan(d);start(q.list.length?q.list:extra(d),"只練這類",false)};row.appendChild(only);
    box.appendChild(row);app.appendChild(box);
  });
  var ft=el("footer","");ft.appendChild(document.createTextNode("詞語為國中常見的易錯字詞，錯字選項與說明為自編。進度只存在這台裝置的瀏覽器裡。 "));
  var r=el("button","","重設進度");r.onclick=function(){if(confirm("確定要清除所有進度嗎？")){st={};save();home()}};ft.appendChild(r);
  app.appendChild(ft);
}

function extra(only){
  var all=[];DATA.forEach(function(dk,d){if(only!==undefined&&only!==d)return;dk.groups.forEach(function(_,g){if(st[id(d,g)]||only!==undefined)all.push([d,g])})});
  return shuffle(all).slice(0,ROUND);
}

function syl(q){var m=q.replace(/（[^（）]*）/g,"").match(/[ㄅ-ㄩˊˇˋ˙]+/);if(!m)return "";var s=m[0];var h=s.length/2;return (s.length%2===0&&s.slice(0,h)===s.slice(h))?s.slice(0,h):s}
var HOMO={};
DATA.forEach(function(dk){dk.groups.forEach(function(g){g.qs.forEach(function(q){if(q.x)return;var k=syl(q.q);if(!k)return;(HOMO[k]=HOMO[k]||[]).indexOf(q.a)<0&&HOMO[k].push(q.a)})})});

// 選項：有自編錯字（x）就用 x；否則用同組其他答案，不足再補同音同調字。兩種寫法都對的字（alt）不當錯誤選項。
function makeQ(p){
  var gr=DATA[p[0]].groups[p[1]], q=pick(gr.qs), alt=q.alt||"", others;
  if(q.x)others=q.x.slice();
  else{
    var mine=gr.r.map(function(r){return r.c}); // 整組的字（含因兩種都對而不出題的那一列）
    others=shuffle(mine.filter(function(c){return c!==q.a&&alt.indexOf(c)<0})).slice(0,MAX_OPTS-1);
    if(others.length<MAX_OPTS-1){
      var homo=shuffle((HOMO[syl(q.q)]||[]).filter(function(c){return mine.indexOf(c)<0&&alt.indexOf(c)<0}));
      others=others.concat(homo.slice(0,MAX_OPTS-1-others.length));
    }
  }
  return {p:p,gr:gr,q:q,row:gr.r[q.ri],opts:shuffle(others.concat([q.a]))};
}

function start(list,label,isRetry){run(list.map(makeQ),0,[],label,isRetry,0)}

function grade(p,ok){
  var k=id(p[0],p[1]), s=st[k]||{lv:0,due:0}, t=today(), was=known(s);
  if(ok){ if(s.due<=t||!st[k]){s.lv=Math.min(s.lv+1,GAP.length-1);s.due=t+GAP[s.lv]} }
  else {s.lv=0;s.due=t+1}
  st[k]=s;save();
  return !was&&known(s);
}

function run(qs,pos,missed,label,isRetry,newKnown){
  var q=qs[pos];
  clear();var a=el("a","back","← 回首頁");a.href="#";a.onclick=function(e){e.preventDefault();home()};app.appendChild(a);
  var m=el("div","meta");m.appendChild(el("span","",(isRetry?"再練一次・":"")+label+"・"+DATA[q.p[0]].name));m.appendChild(el("span","",(pos+1)+" / "+qs.length));app.appendChild(m);
  var bar=el("div","bar"),f=el("i");f.style.width=(pos/qs.length*100)+"%";bar.appendChild(f);app.appendChild(bar);
  if(q.gr.h)app.appendChild(el("span","tag","易錯"));
  app.appendChild(el("p","ask",DATA[q.p[0]].ask));
  var wd=el("p","word");
  q.q.q.split(/([ㄅ-ㄩˊˇˋ˙]+|□+)/).forEach(function(s){if(!s)return;wd.appendChild(/^([ㄅ-ㄩˊˇˋ˙]+|□+)$/.test(s)?el("span","zy",s):document.createTextNode(s))});
  app.appendChild(wd);
  var box=el("div","opts"+(q.opts.some(function(c){return c.length>2})?" long":"")),btns=[];app.appendChild(box);
  var right=q.q.a;
  q.opts.forEach(function(c){
    var b=el("button","opt",c);btns.push(b);box.appendChild(b);
    b.onclick=function(){
      var ok=c===right;
      btns.forEach(function(x){x.disabled=true;if(x.textContent===right)x.classList.add("ok")});
      if(!ok){b.classList.add("no");missed.push(q)}
      if(!isRetry&&grade(q.p,ok))newKnown++;
      var ex=el("div","ex"+(ok?"":" wrong"));ex.appendChild(el("b","",(ok?"答對了！":"再想想：")+"正確是「"+q.q.w+"」"));
      q.gr.r.forEach(function(r){var ln=el("div","ln"+(r===q.row?" on":""));ln.appendChild(el("span","c",r.c));
        ln.appendChild(el("span","",r.t));ex.appendChild(ln)});
      if(q.q.alt)ex.appendChild(el("div","gl","✅ 「"+q.q.alt+"」也是正確寫法，所以不列為錯誤選項。"));
      if(q.q.n)ex.appendChild(el("div","gl","💡 "+q.q.n));
      if(q.q.g)ex.appendChild(el("div","gl","📖 "+q.q.g));
      app.appendChild(ex);
      var go=el("button","go",pos+1<qs.length?"下一題":"看結果");
      go.onclick=function(){pos+1<qs.length?run(qs,pos+1,missed,label,isRetry,newKnown):result(qs,missed,label,isRetry,newKnown)};
      app.appendChild(go);go.focus({preventScroll:true});
    };
  });
}

function result(qs,missed,label,isRetry,newKnown){
  clear();
  app.appendChild(el("h1","",(isRetry?"再練一次：":"")+label));
  app.appendChild(el("p","big",(qs.length-missed.length)+" / "+qs.length));
  var msg=missed.length?"答錯的組明天會再出現。先把下面的字再看一次。":"全部答對！";
  if(!isRetry&&newKnown)msg+=" 這一局新熟了 "+newKnown+" 組。";
  app.appendChild(el("p","sub",msg));
  missed.forEach(function(q){var d=el("div","miss");d.appendChild(el("b","",q.q.w));
    d.appendChild(el("small","",q.gr.r.map(function(r){return r.c+"："+r.t}).join("｜")));app.appendChild(d)});
  if(missed.length){var r=el("button","go","答錯的再練一次");r.onclick=function(){run(shuffle(missed).map(function(q){return makeQ(q.p)}),0,[],label,true,0)};app.appendChild(r)}
  var h=el("button","go ghost","回首頁");h.onclick=home;app.appendChild(h);
}
home();
</script>
