<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字詞語句闖關</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#23201b;--muted:#6d665a;--line:#e2d9c8;--accent:#2f6f5e;--accent-soft:#dcefe7;--bad:#b23a2e;--bad-soft:#f9e1dd;--gold:#a56a12}
@media (prefers-color-scheme:dark){:root{--bg:#171a1d;--card:#22272b;--ink:#ece8df;--muted:#a8a294;--line:#3a4046;--accent:#6fc5ab;--accent-soft:#1f3a33;--bad:#ef9488;--bad-soft:#442825;--gold:#e0b060}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:680px;margin:0 auto;padding:18px 16px 48px}
a.back{color:var(--muted);text-decoration:none;font-size:15px}
h1{font-size:30px;line-height:1.3;margin:12px 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.stage{display:flex;width:100%;gap:14px;align-items:center;text-align:left;background:var(--card);color:inherit;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;font:inherit;cursor:pointer}
.stage:hover{border-color:var(--accent)}
.num{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800}
.stage b{display:block}.stage small{color:var(--muted);font-size:14px;line-height:1.5;display:block}
.score{margin-left:auto;flex:none;color:var(--gold);font-weight:800;font-size:15px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0 18px}.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:15px}
.passage{background:var(--card);border-left:4px solid var(--gold);border-radius:6px;padding:10px 14px;margin:0 0 14px}
.q{font-size:20px;font-weight:700;line-height:1.6;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:inherit;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:9px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt:disabled{cursor:default}
.opt.ok{background:var(--accent-soft);border-color:var(--accent);font-weight:700}.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:6px}.ex b{color:var(--accent)}.ex.wrong b{color:var(--bad)}
.go{display:block;width:100%;border:0;border-radius:12px;background:var(--accent);color:var(--card);font:inherit;font-weight:800;padding:12px;margin-top:14px;cursor:pointer}
.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.big{font-size:52px;font-weight:800;color:var(--accent);margin:8px 0 0}
.miss{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:9px}.miss small{color:var(--muted);display:block;line-height:1.6}
figure.art{margin:0 0 16px}figure.art img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:var(--card)}figure.art figcaption{color:var(--muted);font-size:15px;line-height:1.6;margin-top:7px}
.claim{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:20px;font-weight:700;line-height:1.6}.claim small{display:block;color:var(--accent);font-size:14px;font-weight:800}
.step{color:var(--gold);font-weight:800;font-size:15px;margin:0 0 8px}
.hint{color:var(--muted);margin:0 0 10px}
.sent{display:flex;gap:10px;align-items:flex-start}.sent .sn{flex:none;width:26px;height:26px;margin-top:2px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:14px;font-weight:800;line-height:1}
footer{color:var(--muted);font-size:14px;margin-top:26px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<script>
// 選擇題：o 陣列第一個是正解，作答時才隨機排列。
// 找證據句（ev:true）：c 結論、x 短文逐句、a 證據句位置（從 0 起算），句子不打亂。
// 文言短篇（有 texts）：每篇三題，t 是篇號；選擇題的短文和找證據句的句子都在載入時由 texts 補上。
var STAGES = [
{t:"一字多義",d:"同一個字，放進不同的詞，意思不一樣。",q:[
 {s:"下列哪個「絕」是「極、非常」的意思？",o:["他想出一個絕妙的點子","兩國斷絕外交關係","本店謝絕外帶","大雪使山村與外界隔絕"],e:"絕妙＝極妙。把「絕」換成「極」帶回去念，念得通就對了。其他三個都是斷開、拒絕或隔開。"},
 {s:"下列哪一組「過」的意思相同？",o:["過河拆橋／路過","過猶不及／功過相抵","改過自新／過人之處","過獎／罪過"],e:"過河、路過都是「通過」。其他各組都混了「超過」和「過失」兩種意思。"},
 {s:"下列哪個「鼎」是「大」的意思？",o:["鼎力支持","問鼎中原","三足鼎立","鐘鳴鼎食"],e:"鼎力＝大力。其他三個的「鼎」都和古代的鼎這種器物有關。"},
 {s:"下列哪個「退」是「離開職位」的意思？",o:["退休","退貨","退燒","退票"],e:"退休是離開工作崗位。退貨、退票是把東西退回，退燒是體溫下降。"},
 {s:"下列哪個「凡」是「平凡」的意思？",o:["超凡入聖","凡事小心","舉凡文具都打折","大凡成功的人都很努力"],e:"超凡＝超越平凡。其他三個的「凡」都是「所有、大概」的總括用法。"},
 {s:"下列哪個「省」讀作ㄒㄧㄥˇ？",o:["反省","節省","省略","臺灣省"],e:"有檢查、明白的意思時讀ㄒㄧㄥˇ，例如反省。減少、行政區讀ㄕㄥˇ。"},
 {s:"下列哪個「道」是「說」的意思？",o:["一語道破", "志同道合", "道路泥濘", "頭頭是道"],e:"一語道破＝一句話就說破。志同道合的「道」是志向，頭頭是道的「道」是道理。"},
 {s:"下列哪個「負」是「違背、辜負」的意思？",o:["忘恩負義", "負荊請罪", "身負重任", "不分勝負"],e:"忘恩負義＝忘記恩情、違背道義。負荊是背著荊條，身負是擔負，勝負的「負」是輸。"},
 {s:"下列哪個「素」是「向來、平常」的意思？",o:["素不相識", "素食餐廳", "營養素", "樸素大方"],e:"素不相識＝向來不認識。把「素」換成「向來」念念看，念得通就對了。"},
 {s:"下列哪個「顧」是「拜訪」的意思？",o:["三顧茅廬", "奮不顧身", "環顧四周", "顧此失彼"],e:"三顧茅廬＝三次到草屋拜訪。環顧是看，奮不顧身是顧惜，顧此失彼是照顧。"},
 {s:"下列哪個「舉」是「全、整個」的意思？",o:["舉世聞名", "舉手發言", "選賢舉能", "一舉兩得"],e:"舉世＝全世界。舉手是抬起，舉能是推舉，一舉是一個行動。"},
 {s:"下列哪個「息」是「停止」的意思？",o:["川流不息", "一息尚存", "銀行利息", "休養生息"],e:"川流不息＝像河水一樣流個不停。一息尚存的「息」是呼吸，休養生息的「息」是繁殖、生長。"},
 {s:"下列哪個「故」是「舊的、原來的」意思？",o:["重回故鄉", "無緣無故", "明知故犯", "交通事故"],e:"故鄉＝原來住的家鄉。無故的「故」是原因，故犯的「故」是故意。"},
 {s:"下列哪個「行」讀作ㄏㄤˊ？",o:["各行各業", "行走江湖", "言行一致", "發行新書"],e:"指行業、行列時讀ㄏㄤˊ。走路、做事、行為都讀ㄒㄧㄥˊ。"},
 {s:"下列哪個「易」是「交換」的意思？",o:["以物易物", "輕而易舉", "平易近人", "來之不易"],e:"以物易物＝拿東西換東西。輕而易舉、來之不易的「易」是容易，平易是平和。"},
 {s:"下列哪個「名」是「說出」的意思？",o:["莫名其妙", "名列前茅", "名勝古蹟", "報名參加"],e:"莫名其妙原本是「沒有人說得出它的奧妙」。名列的「名」是名次，名勝的「名」是著名。"}
]},
{t:"易混字詞",d:"長得像、聽起來像，用起來不一樣。",q:[
 {s:"形容建築色彩華麗，哪個寫法正確？",o:["金碧輝煌","金璧輝煌","金壁輝煌","今碧輝煌"],e:"碧是青綠色，金和碧都是顏色。璧是圓形的玉器。"},
 {s:"「大樓終於ㄐㄩㄣˋ工」，應該用哪個字？",o:["竣","峻","俊","浚"],e:"竣＝完畢。山字旁的峻是高而險，也用於嚴峻。"},
 {s:"新人第一次展現才華，「ㄓㄢˇ露頭角」應該用哪個字？",o:["嶄","斬","展","湛"],e:"嶄＝突出，像山峰冒出來。"},
 {s:"「讓家人衣食無ㄩˊ」，應該用哪個字？",o:["虞","餘","魚","娛"],e:"虞＝憂慮，無虞就是不必擔心。"},
 {s:"下列哪一句的詞語用得正確？",o:["消費者決定杯葛這家黑心廠商","兩家人為了土地杯葛多年","議員在會中糾葛這項提案","她一直榮膺老師的教誨"],e:"杯葛＝集體抵制；糾葛＝糾纏不清；教誨要用服膺，表示牢記在心。"},
 {s:"下列哪一句的詞語用得正確？",o:["他榮膺本屆最佳新人","我一直榮膺父親的叮嚀","他服膺本屆冠軍","大家推舉他服膺會長一職"],e:"榮膺是光榮地接受職位或獎項；服膺是把道理或教導記在心裡。"},
 {s:"「再接再ㄌㄧˋ」，應該用哪個字？",o:["厲", "勵", "力", "利"],e:"這裡的「厲」同「礪」，是磨的意思，原本指公雞相鬥前再磨一次嘴。勵是鼓勵。"},
 {s:"「按ㄅㄨˋ就班」，應該用哪個字？",o:["部", "步", "布", "佈"],e:"部是門類、次序，照著次序一項一項來。容易寫成腳步的步。"},
 {s:"「迫不ㄐㄧˊ待」，應該用哪個字？",o:["及", "急", "即", "極"],e:"及＝等到。急得來不及等待，所以是「不及待」。"},
 {s:"「談笑風ㄕㄥ」，應該用哪個字？",o:["生", "聲", "升", "笙"],e:"風生＝像起風一樣生動有趣，不是笑聲的聲。"},
 {s:"「破ㄈㄨˇ沉舟」，應該用哪個字？",o:["釜", "斧", "府", "腐"],e:"釜是煮飯的鍋。把鍋打破、把船弄沉，表示不留退路。"},
 {s:"「明ㄅㄧㄢˋ是非」，應該用哪個字？",o:["辨", "辯", "辮", "瓣"],e:"看中間：辨是一點一撇，用來分別；辯是言，用嘴爭論；辮是糸，綁頭髮；瓣是瓜，花瓣。"},
 {s:"下列哪個寫法正確？",o:["一鼓作氣", "一股作氣", "一古作氣", "一鼓做氣"],e:"鼓是戰鼓。打第一通鼓時士氣最旺，所以是「鼓」和「作」。"},
 {s:"下列哪個寫法正確？",o:["走投無路", "走頭無路", "走投無露", "走偷無路"],e:"投＝投靠。沒有地方可以投靠，所以是走「投」無路。"},
 {s:"下列哪一句的詞語用得正確？",o:["水是生活的必需品。", "出門必需帶鑰匙。", "這件事必需由你決定。", "空氣是生存的必須品。"],e:"必須後面接動作（必須帶、必須決定）；必需是「一定要有」，常說必需品。"},
 {s:"下列哪一句的詞語用得正確？",o:["我已經向老師反映這個問題。", "他的反映很快，一下就接住球。", "吃藥後的過敏反映讓他起疹子。", "大家對新菜單的反映很熱烈。"],e:"反映＝把情況告訴上面的人，或照出某種現象。反應＝受到刺激後的動作、變化或回應。"}
]},
{t:"成語情境",d:"不只要懂字面，還要用對場合。",q:[
 {s:"下列哪一句的成語用得正確？",o:["想舉發組長舞弊，又怕連累一起工作的朋友，他只好投鼠忌器。","海邊的夕陽如鏡花水月般壯麗。","自從搬到山上，他家戶限為穿，一整年都沒有訪客。","他畫了一條虛與委蛇的彩帶裝飾海報。"],e:"投鼠忌器是想行動又怕傷及旁人。鏡花水月指虛幻，戶限為穿指訪客極多，虛與委蛇指假意敷衍。"},
 {s:"下列哪個成語形容拜訪的人非常多？",o:["戶限為穿","門可羅雀","杳無人跡","鏡花水月"],e:"戶限就是門檻，連門檻都被踩破了。門可羅雀剛好相反，是冷清得沒有人上門。"},
 {s:"「虛與委蛇」是什麼意思？",o:["假意敷衍應付","道路彎彎曲曲","真心對待別人","像蛇一樣靈活"],e:"讀ㄒㄩ ㄩˇ ㄨㄟ ㄧˊ，跟蛇和道路都沒有關係。"},
 {s:"下列哪一位同學最符合「從諫如流」？",o:["班長聽了同學的建議，立刻修改活動規則。","班長堅持己見，和同學爭到下課。","班長聽完沒有回應，照原定計畫進行。","班長在背後批評提建議的同學。"],e:"從諫如流是樂於接受別人的規勸，像水往低處流一樣自然。"},
 {s:"「面對老闆要她虛報帳目的要求，她當面直言拒絕。」最適合用哪個成語形容？",o:["耿介不阿","前倨後恭","矯情干譽","假公濟私"],e:"耿介不阿是正直、不迎合別人。"},
 {s:"「店員原本愛理不理，一知道對方是董事長，馬上變得殷勤。」最適合用哪個成語形容？",o:["前倨後恭","先公後私","反求諸己","從善如流"],e:"倨是傲慢。先傲慢、後恭敬，形容待人勢利。"},
 {s:"下列哪一句的成語用得正確？",o:["他做事一絲不苟，連標點符號都仔細檢查。", "這家店的菜差強人意，難吃得讓人吃不下。", "他們兄弟倆相敬如賓，感情很好。", "老師對我們的照顧真是罄竹難書。"],e:"差強人意是大致令人滿意；相敬如賓用在夫妻；罄竹難書形容罪行多到寫不完。"},
 {s:"「差強人意」是什麼意思？",o:["大致還能令人滿意", "非常令人失望", "勉強別人同意", "完全超出期待"],e:"差＝稍微，強＝振奮。意思是還算可以，不是很差。"},
 {s:"下列哪一句的「首當其衝」用得正確？",o:["颱風登陸，沿海村落首當其衝。", "比賽一開始，他首當其衝跑到最前面。", "他首當其衝報名當志工。", "抽獎時她首當其衝抽中頭獎。"],e:"首當其衝是最先受到衝擊或災害，不是「搶第一」。"},
 {s:"「剛學寫字的他，在書法老師面前得意地示範筆法。」最適合用哪個成語形容？",o:["班門弄斧", "拋磚引玉", "按圖索驥", "守株待兔"],e:"班是魯班，木匠的祖師。在行家面前賣弄本事，就是班門弄斧。"},
 {s:"「他上次靠猜題考了高分，從此不讀書，只等著再猜中。」最適合用哪個成語形容？",o:["守株待兔", "亡羊補牢", "未雨綢繆", "畫蛇添足"],e:"守株待兔是死守偶然的好運，不肯努力。"},
 {s:"下列哪個情境最符合「亡羊補牢」？",o:["資料遺失後，他立刻養成備份的習慣。", "颱風來之前，他先把窗戶釘牢。", "他寫完作文又多加一段，反而離題。", "他一次報名三個社團，結果都沒去。"],e:"亡羊補牢是出了問題之後趕快補救。第二個是未雨綢繆，第三個是畫蛇添足。"},
 {s:"哪個成語形容「話不多，卻把重點說得很完整」？",o:["言簡意賅", "長篇大論", "語無倫次", "口若懸河"],e:"賅＝完備。話簡短、意思完整。口若懸河是說話滔滔不絕。"},
 {s:"「罄竹難書」最適合用來形容什麼？",o:["詐騙集團的種種惡行", "老師對學生的照顧", "圖書館豐富的藏書", "選手得過的獎項"],e:"古人把字寫在竹簡上。用光竹子也寫不完，專指罪行很多，不能用來稱讚人。"},
 {s:"下列哪一句的成語用得正確？",o:["這次失敗對他是當頭棒喝，他開始認真檢討。", "他的歌聲真是不堪入目。", "這首曲子琳瑯滿目，十分好聽。", "妹妹的房間汗牛充棟，到處是玩具。"],e:"當頭棒喝是讓人猛然醒悟。不堪入目、琳瑯滿目都是用眼睛看的；汗牛充棟專指書多。"},
 {s:"「他平常不準備，考試前一晚才熬夜讀書。」最適合用哪個成語形容？",o:["臨渴掘井", "未雨綢繆", "有備無患", "循序漸進"],e:"口渴了才挖井，比喻事到臨頭才想辦法。"}
]},
{t:"文句通順",d:"找贅字，看關聯詞，檢查前後意思。",q:[
 {s:"下列哪一句沒有贅字？",o:["我們應該珍惜水資源。","請大家提早預約座位。","我親眼目睹了整個過程。","這是他過去的往事。"],e:"預約已有事先的意思；目睹就是親眼看見；往事就是過去的事。"},
 {s:"「不是……而是……」要有對比。下列哪一句用得正確？",o:["他讀書不是為了分數，而是為了弄懂問題。","她運動不是為了健康，而是為了讓身體更好。","他道歉不是為了認錯，而是為了承認自己錯了。","我早起不是為了趕車，而是為了搭上早班車。"],e:"分數和弄懂問題是兩個不同的目標，才有對比。其他三句前後意思相同。"},
 {s:"「儘管……仍然……」要有轉折。下列哪一句用得正確？",o:["儘管天氣炎熱，選手仍然堅持跑完全程。","儘管大家都支持他，他仍然很受歡迎。","儘管今天放假，我仍然開心地睡到自然醒。","儘管我肚子很餓，我仍然吃了很多飯。"],e:"天熱本來會想放棄，選手卻堅持，前後才是轉折。其他三句都是順著說。"},
 {s:"下列哪一句是表態句（描寫主語的性質或狀態）？",o:["操場上的草地翠綠柔軟。","小明是班長。","教室裡有一臺投影機。","貓跳上了窗臺。"],e:"表語「翠綠柔軟」是形容詞。其他依序是判斷句、有無句、敘事句。"},
 {s:"「今天的任務有三項□打掃、買菜、做飯。」□應該填哪個標點？",o:["：","；","、","？"],e:"冒號用來提起下文，後面接著列出三項任務。"},
 {s:"下列哪一句前後語意矛盾？",o:["他是個懶散的人，每天都第一個到校打掃。","她生性節儉，買東西前總會比價。","他個性急躁，常常等不及別人說完。","弟弟很怕狗，看到狗就繞路走。"],e:"懶散的人和每天第一個到校打掃互相矛盾。"},
 {s:"下列哪一句沒有語病？",o:["經過練習，他的泳技進步了。", "經過這次練習，使他的泳技進步了。", "通過老師的說明，讓我明白了題意。", "在大家的幫忙下，使活動順利完成。"],e:"「經過……使……」「通過……讓……」會讓句子找不到主語。拿掉「使」或「讓」就通了。"},
 {s:"下列哪一句沒有贅字？",o:["這本書上個月出版了。", "這是我個人的私事。", "他大約跑了三公里左右。", "店家免費贈送小禮物。"],e:"私事就是個人的事；大約和左右意思重複；贈送本來就不用錢。"},
 {s:"「雖然……但是……」要有轉折。下列哪一句用得正確？",o:["雖然題目很難，但是他還是解出來了。", "雖然他很努力，但是他很用功。", "雖然下雨了，但是地上濕了。", "雖然她喜歡畫畫，但是她常常畫畫。"],e:"題目難，本來可能解不出來，結果解出來了，前後才是轉折。其他三句前後方向相同。"},
 {s:"「不但……而且……」要更進一層。下列哪一句用得正確？",o:["他不但會彈鋼琴，而且會作曲。", "他不但常遲到，而且很準時。", "這道菜不但好吃，而且難以下嚥。", "她不但愛運動，而且討厭出門。"],e:"後半句要和前半句方向相同，而且程度更進一步。"},
 {s:"下列哪一句是敘事句（說明主語做了什麼）？",o:["弟弟打破了花瓶。", "這個花瓶很漂亮。", "他是我的弟弟。", "桌上有一個花瓶。"],e:"敘事句的重點是動作。其他依序是表態句、判斷句、有無句。"},
 {s:"「哥哥喜歡打球□弟弟喜歡看書。」□應該填哪個標點？",o:["；", "、", "：", "？"],e:"兩個並列的分句，中間用分號隔開。頓號只用在並列的詞語之間。"},
 {s:"「我最近讀完了□西遊記□。」□□應該填哪一組標點？",o:["《　》", "「　」", "（　）", "──　──"],e:"書名用書名號。引號用在說話內容或特別強調的詞語。"},
 {s:"下列哪一句語序通順？",o:["我昨天在圖書館借了兩本小說。", "我借了昨天兩本小說在圖書館。", "我在圖書館兩本小說借了昨天。", "昨天我圖書館在借了兩本小說。"],e:"常見順序是：誰＋什麼時候＋在哪裡＋做什麼。"},
 {s:"下列哪一句的詞語搭配正確？",o:["他改掉了熬夜的習慣。", "他改善了愛遲到的缺點。", "我們要提高教室的環境衛生。", "他這次的成績增加了很多。"],e:"缺點要「改正」，環境衛生要「改善」，成績是「進步」。動詞和名詞要配得起來。"},
 {s:"下列哪一句只有一種解讀？",o:["我看見他正在騎腳踏車。", "三個學校的老師來參觀。", "他借我一百元。", "咬死獵人的狗跑了。"],e:"「三個學校的老師」可能是三所學校，也可能是三位老師；「他借我一百元」分不出誰借給誰；最後一句分不出是誰咬死誰。"}
]},
{t:"抓選項陷阱",d:"倒、吹、換、搬，回短文找證據。",q:[
 {p:"小鎮的舊鐵橋在颱風後封閉。居民每天改走河堤小路，才發現河堤上的步道長滿雜草。里長發起清掃活動，三個月後，步道開始有人晨跑，鎮公所也編列了修繕預算。",s:"哪一個選項犯了「倒」的毛病（先後順序弄反）？",o:["鎮公所編列預算後，里長才發起清掃活動。","舊鐵橋封閉後，居民改走河堤小路。","清掃之後，步道開始有人晨跑。","颱風過後，舊鐵橋封閉了。"],e:"短文的順序是先清掃，三個月後才編列預算。"},
 {p:"小鎮的舊鐵橋在颱風後封閉。居民每天改走河堤小路，才發現河堤上的步道長滿雜草。里長發起清掃活動，三個月後，步道開始有人晨跑，鎮公所也編列了修繕預算。",s:"哪一個選項犯了「吹」的毛病（說得比原文多）？",o:["清掃活動使小鎮成為全國知名的運動勝地。","居民改走河堤小路。","里長發起清掃活動。","鎮公所編列了修繕預算。"],e:"短文只說開始有人晨跑，沒有提到全國知名。"},
 {p:"蜂蜜放久了會結晶，這是葡萄糖析出的自然現象，不代表變質。想恢復液狀，可以隔溫水慢慢加熱，但水溫不宜過高，否則香氣會流失。",s:"哪一個選項犯了「換」的毛病（關鍵詞被偷換）？",o:["蜂蜜結晶是蔗糖析出的現象。","蜂蜜放久了會結晶。","可以隔溫水加熱，讓蜂蜜恢復液狀。","水溫過高，香氣會流失。"],e:"短文寫的是葡萄糖，選項換成了蔗糖。"},
 {p:"校內籃球賽有三支隊伍：甲隊擅長防守，乙隊擅長快攻，丙隊以投籃命中率高聞名。",s:"哪一個選項犯了「搬」的毛病（張冠李戴）？",o:["甲隊擅長快攻。","甲隊擅長防守。","乙隊擅長快攻。","丙隊投籃命中率高。"],e:"快攻是乙隊的特色，被搬到甲隊身上。"},
 {p:"小鎮的舊鐵橋在颱風後封閉。居民每天改走河堤小路，才發現河堤上的步道長滿雜草。里長發起清掃活動，三個月後，步道開始有人晨跑，鎮公所也編列了修繕預算。",s:"根據短文，下列何者不正確？",o:["鎮公所反對修繕步道。","舊鐵橋在颱風後封閉。","步道原本長滿雜草。","里長發起清掃活動。"],e:"看到「不正確」先圈起來。短文寫鎮公所編列了修繕預算，並沒有反對。"},
 {p:"蜂蜜放久了會結晶，這是葡萄糖析出的自然現象，不代表變質。想恢復液狀，可以隔溫水慢慢加熱，但水溫不宜過高，否則香氣會流失。",s:"為什麼水溫不宜過高？",o:["因為香氣會流失。","因為蜂蜜會結晶。","因為蜂蜜會變質。","因為葡萄糖會消失。"],e:"問理由時，直接找「否則」後面的句子。"},
 {p:"學校圖書館上學期借書量下降。館員調查後發現，多數學生不是不想看書，而是不知道有哪些新書。於是圖書館每週在走廊展示五本新書，並請學生寫短評。一學期後，借書量回升了兩成。",s:"哪一個選項犯了「倒」的毛病（先後順序弄反）？",o:["借書量回升後，圖書館才開始展示新書。", "館員調查後，發現學生不知道有哪些新書。", "圖書館每週展示五本新書。", "一學期後，借書量回升了。"],e:"原文是先展示新書，借書量才回升。選項把先後弄反了。"},
 {p:"學校圖書館上學期借書量下降。館員調查後發現，多數學生不是不想看書，而是不知道有哪些新書。於是圖書館每週在走廊展示五本新書，並請學生寫短評。一學期後，借書量回升了兩成。",s:"哪一個選項犯了「吹」的毛病（說得比原文多）？",o:["展示新書後，全校學生都愛上了閱讀。", "借書量回升了兩成。", "圖書館請學生寫短評。", "上學期借書量下降。"],e:"原文只說借書量回升兩成，沒有說「全校都愛上閱讀」。"},
 {p:"學校圖書館上學期借書量下降。館員調查後發現，多數學生不是不想看書，而是不知道有哪些新書。於是圖書館每週在走廊展示五本新書，並請學生寫短評。一學期後，借書量回升了兩成。",s:"哪一個選項犯了「換」的毛病（關鍵詞被偷換）？",o:["多數學生是不想看書。", "上學期借書量下降。", "圖書館每週展示五本新書。", "借書量回升了兩成。"],e:"原文是「不是不想看書」，選項把否定詞拿掉，意思就反了。"},
 {p:"學校圖書館上學期借書量下降。館員調查後發現，多數學生不是不想看書，而是不知道有哪些新書。於是圖書館每週在走廊展示五本新書，並請學生寫短評。一學期後，借書量回升了兩成。",s:"借書量下降的主要原因是什麼？",o:["學生不知道有哪些新書。", "學生不想看書。", "圖書館的書太舊。", "走廊的空間太小。"],e:"看到「不是……而是……」，答案在「而是」後面。"},
 {p:"爺爺種了三種果樹：芒果樹在前院，夏天結果；柿子樹在後院，秋天結果；橘子樹種在屋旁，冬天才能採收。",s:"哪一個選項犯了「搬」的毛病（張冠李戴）？",o:["柿子樹在夏天結果。", "芒果樹種在前院。", "橘子樹冬天才能採收。", "柿子樹種在後院。"],e:"夏天結果的是芒果樹，被搬到柿子樹身上。"},
 {p:"爺爺種了三種果樹：芒果樹在前院，夏天結果；柿子樹在後院，秋天結果；橘子樹種在屋旁，冬天才能採收。",s:"根據短文，秋天要到哪裡採水果？",o:["後院", "前院", "屋旁", "短文沒有說"],e:"先找秋天結果的是柿子樹，再找柿子樹在後院。要連兩個線索。"},
 {p:"爺爺種了三種果樹：芒果樹在前院，夏天結果；柿子樹在後院，秋天結果；橘子樹種在屋旁，冬天才能採收。",s:"哪一個選項犯了「吹」的毛病（說得比原文多）？",o:["爺爺種的橘子是全村最甜的。", "橘子樹種在屋旁。", "芒果樹在夏天結果。", "爺爺種了三種果樹。"],e:"短文沒有提到甜不甜，也沒有和別人比較。"},
 {p:"夜晚的城市太亮，會影響候鳥辨認方向。有些城市在候鳥遷徙的季節，要求高樓在深夜關掉外牆燈光。實施後，研究人員記錄到的鳥類撞擊事件明顯減少，不過他們也提醒，這項做法只在遷徙季節有效果。",s:"哪一個選項把話說得太滿？",o:["關燈之後，鳥類再也不會撞上高樓。", "城市太亮會影響候鳥辨認方向。", "鳥類撞擊事件明顯減少。", "這項做法在遷徙季節有效果。"],e:"原文是「明顯減少」，選項變成「再也不會」。看到全部、一定、再也不，要回原文核對。"},
 {p:"夜晚的城市太亮，會影響候鳥辨認方向。有些城市在候鳥遷徙的季節，要求高樓在深夜關掉外牆燈光。實施後，研究人員記錄到的鳥類撞擊事件明顯減少，不過他們也提醒，這項做法只在遷徙季節有效果。",s:"哪一個選項犯了「換」的毛病（關鍵詞被偷換）？",o:["有些城市要求高樓在深夜關掉室內燈光。", "夜晚太亮會影響候鳥辨認方向。", "研究人員記錄到撞擊事件減少。", "這項做法只在遷徙季節有效果。"],e:"原文是「外牆燈光」，被換成「室內燈光」。"},
 {p:"夜晚的城市太亮，會影響候鳥辨認方向。有些城市在候鳥遷徙的季節，要求高樓在深夜關掉外牆燈光。實施後，研究人員記錄到的鳥類撞擊事件明顯減少，不過他們也提醒，這項做法只在遷徙季節有效果。",s:"研究人員提醒了什麼？",o:["這項做法只在遷徙季節有效果。", "高樓應該全年關燈。", "候鳥不受燈光影響。", "撞擊事件沒有變化。"],e:"找「不過」後面的句子。轉折後面常常是重點。"}
]},
{t:"找證據句",d:"讀短文，點出能證明結論的那一句。",ev:true,q:[
 {c:"阿哲揉麵的技術還不純熟。",a:3,x:["阿哲每天放學後到爺爺的麵店幫忙。", "他最常做的工作是擦桌子和收碗。", "上個月，爺爺開始教他揉麵糰。", "他揉的麵糰還不夠均勻，爺爺總要再揉一遍。", "阿哲說，等他學會了，要煮一碗麵給爺爺吃。"],e:"「不夠均勻」「爺爺總要再揉一遍」就是還不純熟。第 3 句只說開始學，沒說學得怎麼樣。"},
 {c:"打鐵店變少，是因為工廠產品的競爭。",a:1,x:["這條老街原本有十幾家打鐵店。", "隨著工廠量產的刀具越來越便宜，上門的客人逐年減少。", "現在只剩下一家還在營業。", "老師傅說，他的顧客多半是廚師和農夫。", "他們認為手工打的刀比較耐用。"],e:"結論問的是原因。第 2 句的「隨著……」說出了原因；第 3 句只是結果。"},
 {c:"小芸上臺前很緊張。",a:1,x:["小芸第一次參加演講比賽。", "上臺前，她的手心一直冒汗，稿子也拿不穩。", "開口之後，她發現臺下的同學都很專心。", "她越講越順，最後還加了一段原本沒有準備的話。", "評審稱讚她臺風穩健。"],e:"文章沒有寫「緊張」兩個字，但手心冒汗、稿子拿不穩就是緊張的樣子。證據常常換一種說法出現。"},
 {c:"整修前，公園的設施很少。",a:1,x:["社區的公園去年重新整修。", "整修前，公園只有一座溜滑梯，傍晚幾乎沒有人。", "整修後增加了步道、運動器材和夜間照明。", "現在每天晚上都有居民來散步、運動。", "里長打算明年再增設閱讀角。"],e:"「只有一座溜滑梯」就是設施很少。第 3 句講的是整修後，時間不對。"},
 {c:"臺灣黑熊的食物以植物為主。",a:2,x:["臺灣黑熊的胸前有一道白色的 V 字形斑紋。", "牠們雖然體型龐大，卻很會爬樹。", "黑熊什麼都吃，但食物中大部分是植物的果實和嫩葉。", "秋天櫟樹的果實成熟時，牠們會聚集到櫟樹林。", "研究人員常在樹幹上發現牠們留下的爪痕。"],e:"「大部分是植物」就是以植物為主。第 4 句只說秋天去哪裡，沒有說吃的比例。"},
 {c:"爸爸從第一次的失敗中學到了教訓。",a:2,x:["爸爸決定把陽臺改成小菜園。", "他先種了番茄，結果葉子被蟲吃光。", "第二次他改種九層塔，並且在盆子外面罩上紗網。", "這一次，九層塔長得又高又茂盛。", "媽媽笑說，以後煮菜不用再去市場買香料了。"],e:"罩上紗網，是針對上次被蟲吃光做的改變，這就是學到教訓。第 4 句只是結果。"},
 {c:"這家書店能幫讀者拓展閱讀範圍。",a:3,x:["這家書店不賣暢銷排行榜上的書。", "老闆每個月只選二十本書，放在店中央的長桌上。", "每本書旁邊都有他手寫的推薦卡片。", "有客人說，在這裡常常遇見自己原本不會拿起來的書。", "書店雖然小，週末卻總是擠滿了人。"],e:"「遇見原本不會拿起來的書」就是閱讀範圍變廣了。第 5 句只能證明書店受歡迎。"},
 {c:"阿公不換車，是因為這輛車裡有回憶。",a:3,x:["阿公的腳踏車已經騎了三十年。", "車身的漆掉了不少，鈴鐺也不太響。", "鄰居勸他換一輛新的，他只是笑笑。", "他說，這輛車載過阿嬤，也載過小時候的爸爸。", "每個星期天，他還是會替鏈條上油，把輪框擦亮。"],e:"第 3 句只說他不換，沒說原因。原因藏在他自己說的話裡：這輛車載過家人。"}
]},
{t:"文言短篇",d:"一篇短古文連問三步：字義、誰做了什麼、找證據句。",texts:[
 {src:"《韓非子・外儲說左上》",x:["鄭人有欲買履者，先自度其足，而置之其坐。", "至之市，而忘操之。", "已得履，乃曰：「吾忘持度。」反歸取之。", "及反，市罷，遂不得履。", "人曰：「何不試之以足？」曰：「寧信度，無自信也。」"]},
 {src:"《呂氏春秋・察今》",x:["楚人有涉江者，其劍自舟中墜於水。", "遽契其舟，曰：「是吾劍之所從墜。」", "舟止，從其所契者入水求之。", "舟已行矣，而劍不行。", "求劍若此，不亦惑乎？"]},
 {src:"《世說新語・德行》",x:["管寧、華歆共園中鋤菜，見地有片金。", "管揮鋤與瓦石不異，華捉而擲去之。", "又嘗同席讀書，有乘軒冕過門者。", "寧讀如故，歆廢書出看。", "寧割席分坐，曰：「子非吾友也。」"]},
 {src:"《世說新語・雅量》",x:["王戎七歲，嘗與諸小兒遊。", "看道邊李樹多子折枝。", "諸兒競走取之，唯戎不動。", "人問之，答曰：「樹在道邊而多子，此必苦李。」", "取之信然。"]},
 {src:"《孟子・公孫丑上》",x:["宋人有閔其苗之不長而揠之者。", "芒芒然歸。", "謂其人曰：「今日病矣！予助苗長矣！」", "其子趨而往視之。", "苗則槁矣。"]},
 {src:"《世說新語・方正》",x:["陳太丘與友期行，期日中。", "過中不至，太丘舍去，去後乃至。", "元方時年七歲，門外戲。客問元方：「尊君在不？」答曰：「待君久不至，已去。」", "友人便怒曰：「非人哉！與人期行，相委而去。」", "元方曰：「君與家君期日中，日中不至，則是無信；對子罵父，則是無禮。」", "友人慚，下車引之，元方入門不顧。"]},
 {src:"《世說新語・德行》",x:["華歆、王朗俱乘船避難，有一人欲依附，歆輒難之。", "朗曰：「幸尚寬，何為不可？」", "後賊追至，王欲捨所攜人。", "歆曰：「本所以疑，正為此耳。既已納其自託，寧可以急相棄邪？」", "遂攜拯如初。", "世以此定華、王之優劣。"]},
 {src:"《韓非子・五蠹》",x:["宋人有耕田者，田中有株。", "兔走觸株，折頸而死。", "因釋其耒而守株，冀復得兔。", "兔不可復得，而身為宋國笑。"]},
 {src:"《韓非子・說難》",x:["宋有富人，天雨牆壞。", "其子曰：「不築，必將有盜。」", "其鄰人之父亦云。", "暮而果大亡其財。", "其家甚智其子，而疑鄰人之父。"]},
 {src:"《韓非子・內儲說上》",x:["齊宣王使人吹竽，必三百人。", "南郭處士請為王吹竽，宣王說之，廩食以數百人。", "宣王死，湣王立。", "好一一聽之，處士逃。"]},
 {src:"《韓非子・難一》",x:["楚人有鬻盾與矛者。", "譽之曰：「吾盾之堅，物莫能陷也。」", "又譽其矛曰：「吾矛之利，於物無不陷也。」", "或曰：「以子之矛陷子之盾，何如？」", "其人弗能應也。"]},
 {src:"《呂氏春秋・自知》",x:["范氏之亡也，百姓有得鍾者。", "欲負而走，則鍾大不可負。", "以椎毀之，鍾況然有音。", "恐人聞之而奪己也，遽揜其耳。"]},
 {src:"《世說新語・雅量》",x:["謝公與人圍棋，俄而謝玄淮上信至。", "看書竟，默然無言，徐向局。", "客問淮上利害，答曰：「小兒輩大破賊。」", "意色舉止，不異於常。"]},
 {src:"《孟子・告子上》",x:["弈秋，通國之善弈者也。", "使弈秋誨二人弈，其一人專心致志，惟弈秋之為聽。", "一人雖聽之，一心以為有鴻鵠將至，思援弓繳而射之。", "雖與之俱學，弗若之矣。"]},
 {src:"《戰國策・楚策一》",x:["虎求百獸而食之，得狐。", "狐曰：「子無敢食我也。天帝使我長百獸，今子食我，是逆天帝命也。", "子以我為不信，吾為子先行，子隨我後，觀百獸之見我而敢不走乎？」", "虎以為然，故遂與之行。", "獸見之皆走。", "虎不知獸畏己而走也，以為畏狐也。"]}
],q:[
 {t:0,k:"第 1 步・關鍵字義",s:"「先自度其足」的「度」是什麼意思？",o:["測量（動作）", "量好的尺碼", "渡過", "程度"],e:"這裡是量腳的動作，讀ㄉㄨㄛˋ。後面「吾忘持度」的「度」才是量好的尺碼，讀ㄉㄨˋ。同一個字，位置不同，意思和讀音都變了。"},
 {t:0,k:"第 2 步・誰做了什麼",s:"「反歸取之」，是誰回去拿什麼？",o:["鄭人回家拿量好的尺碼", "鄭人回家拿錢", "賣鞋的人回去拿鞋", "路人回去拿尺"],e:"文言常省略主語，這裡還是鄭人。「之」指前一句「吾忘持度」的「度」。"},
 {t:0,k:"第 3 步・找證據句",c:"這個人只相信尺碼，不相信自己的腳。",a:4,e:"「寧信度，無自信也」是他親口說的理由。第 3 句只說他忘了帶尺碼，還看不出他的想法。"},
 {t:1,k:"第 1 步・關鍵字義",s:"「遽契其舟」的「契」是什麼意思？",o:["用刀刻", "契約", "合得來", "約定"],e:"契＝刻。他急忙在船邊刻下記號。「遽」是急忙、立刻。"},
 {t:1,k:"第 2 步・誰做了什麼",s:"「從其所契者入水求之」，是誰下水找什麼？",o:["楚人下水找劍", "船夫下水找記號", "楚人下水找船", "路人下水找楚人"],e:"主語省略，仍是掉劍的楚人。「之」指劍。他是從刻記號的地方下水。"},
 {t:1,k:"第 3 步・找證據句",c:"這樣找不到劍，因為船已經移動，劍卻留在原地。",a:3,e:"第 4 句說出了原因。第 5 句是作者的評語，只說這樣很糊塗，沒有說為什麼。"},
 {t:2,k:"第 1 步・關鍵字義",s:"「歆廢書出看」的「廢」是什麼意思？",o:["放下、停止", "沒有用處", "弄壞", "取消"],e:"廢書＝放下書本，停下來不讀。不是把書弄壞。"},
 {t:2,k:"第 2 步・誰做了什麼",s:"「捉而擲去之」，是誰做了什麼？",o:["華歆撿起金子，再丟掉", "管寧撿起金子，再丟掉", "華歆撿起瓦石，丟到園外", "管寧把鋤頭丟掉"],e:"這半句的主語是前面的「華」。管寧把金子看得和瓦石一樣，鋤頭照揮；華歆卻撿起來看了才丟。"},
 {t:2,k:"第 3 步・找證據句",c:"管寧讀書時不受外面的熱鬧影響。",a:3,e:"「如故」就是照舊。第 2 句寫的是兩人對金錢的態度，和讀書專不專心無關。"},
 {t:3,k:"第 1 步・關鍵字義",s:"「諸兒競走取之」的「走」是什麼意思？",o:["跑", "慢慢走", "離開", "逃走"],e:"文言的「走」是跑。白話說的走路，文言用「行」。"},
 {t:3,k:"第 2 步・誰做了什麼",s:"「人問之，答曰」，回答的人是誰？",o:["王戎", "其他小孩", "問話的人", "李樹的主人"],e:"「之」指王戎。有人問他，所以回答的也是他，主語被省略了。"},
 {t:3,k:"第 3 步・找證據句",c:"王戎的判斷是對的。",a:4,e:"信然＝確實如此。第 4 句只是他的推論，第 5 句摘下來一嘗，才證明推論正確。"},
 {t:4,k:"第 1 步・關鍵字義",s:"「今日病矣」的「病」是什麼意思？",o:["疲累", "生病", "缺點", "擔心"],e:"他拔了一整天的苗，是累壞了，不是生病。"},
 {t:4,k:"第 2 步・誰做了什麼",s:"「趨而往視之」，是誰去看什麼？",o:["宋人的兒子跑去看禾苗", "宋人跑去看兒子", "鄰居跑去看宋人", "宋人的兒子跑去看父親"],e:"主語是「其子」。「之」指禾苗。趨是快步走。"},
 {t:4,k:"第 3 步・找證據句",c:"宋人的做法反而害了禾苗。",a:4,e:"槁＝枯乾。第 3 句是宋人自己以為幫了忙，結果要看最後一句。"},
 {t:5,k:"第 1 步・關鍵字義",s:"「太丘舍去」的「去」是什麼意思？",o:["離開", "前往", "去掉", "過去"],e:"文言的「去」是離開。太丘等不到人，就先走了。白話說「去某地」，文言用「往、之」。"},
 {t:5,k:"第 2 步・誰做了什麼",s:"「過中不至」，是誰沒有到？",o:["陳太丘的朋友", "陳太丘", "元方", "元方的家人"],e:"兩人約好中午出發，過了中午還沒到的是朋友，所以太丘才先走。"},
 {t:5,k:"第 3 步・找證據句",c:"朋友後來知道自己理虧。",a:5,e:"「慚」是慚愧，還下車想拉元方的手示好。第 5 句是元方指出他的錯，第 6 句才寫出朋友的反應。"},
 {t:6,k:"第 1 步・關鍵字義",s:"「歆輒難之」的「難」是什麼意思？",o:["感到為難，不肯馬上答應", "困難", "災難", "責罵"],e:"有人想搭船同行，華歆覺得為難。他不是冷漠，而是先想到後面可能遇到的危險。"},
 {t:6,k:"第 2 步・誰做了什麼",s:"「王欲捨所攜人」，是誰想丟下誰？",o:["王朗想丟下那個搭船的人", "華歆想丟下王朗", "賊想丟下搭船的人", "搭船的人想離開王朗"],e:"「王」是王朗。「所攜人」是他們帶上船的那個人。當初爽快答應的人，遇到危險反而想丟下對方。"},
 {t:6,k:"第 3 步・找證據句",c:"華歆當初猶豫，是因為預想到危急時可能顧不了對方。",a:3,e:"「本所以疑，正為此耳」意思是：我當初猶豫，就是為了這個。這是華歆自己說出的理由。"},
 {t:7,k:"第 1 步・關鍵字義",s:"「冀復得兔」的「冀」是什麼意思？",o:["希望", "已經", "計畫", "害怕"],e:"冀＝希望。他希望再撿到一隻撞死的兔子。"},
 {t:7,k:"第 2 步・誰做了什麼",s:"「而身為宋國笑」，是誰被誰笑？",o:["農夫被宋國人取笑", "兔子被農夫取笑", "宋國人被農夫取笑", "農夫取笑宋國人"],e:"「為……笑」是「被……笑」。「身」指農夫自己。"},
 {t:7,k:"第 3 步・找證據句",c:"農夫不再耕田了。",a:2,e:"耒是翻土的農具。「釋其耒」是放下農具，也就是不耕田了。"},
 {t:8,k:"第 1 步・關鍵字義",s:"「暮而果大亡其財」的「亡」是什麼意思？",o:["丟失", "死亡", "逃跑", "滅亡"],e:"亡＝丟失。到了晚上，果然被偷走很多財物。"},
 {t:8,k:"第 2 步・誰做了什麼",s:"「其鄰人之父亦云」，鄰居老人說了什麼？",o:["不修牆，一定會有小偷", "今晚會下大雨", "富人的兒子很聰明", "牆是被小偷弄壞的"],e:"「亦云」是「也這麼說」。說的內容就是前一句兒子講的話。"},
 {t:8,k:"第 3 步・找證據句",c:"同樣一句話，富人一家對兩個人的看法卻不同。",a:4,e:"覺得兒子聰明，卻懷疑鄰居老人。同樣的提醒，只因為親疏不同，評價就不一樣。"},
 {t:9,k:"第 1 步・關鍵字義",s:"「宣王說之」的「說」是什麼意思？",o:["高興、喜歡", "說話", "勸說", "解釋"],e:"這裡的「說」同「悅」，讀ㄩㄝˋ。文言裡常常這樣用。"},
 {t:9,k:"第 2 步・誰做了什麼",s:"「好一一聽之」，是誰喜歡一個一個聽？",o:["湣王", "宣王", "南郭處士", "三百個樂手"],e:"主語省略，承接上一句的「湣王立」。宣王喜歡三百人合奏，湣王喜歡一個一個獨奏。"},
 {t:9,k:"第 3 步・找證據句",c:"南郭處士其實不會吹竽。",a:3,e:"要一個一個吹，他就逃了，可見不會。第 2 句只說他自己請求加入，還看不出會不會。"},
 {t:10,k:"第 1 步・關鍵字義",s:"「楚人有鬻盾與矛者」的「鬻」是什麼意思？",o:["賣", "買", "製造", "拿著"],e:"鬻讀ㄩˋ，是賣。後面他一直誇自己的貨，就是在叫賣。"},
 {t:10,k:"第 2 步・誰做了什麼",s:"「或曰」的「或」指的是誰？",o:["旁邊的某個人", "賣盾的楚人", "買矛的官員", "楚人的朋友們"],e:"文言的「或」常常是「有人」，不確定是誰。不是「或許」。"},
 {t:10,k:"第 3 步・找證據句",c:"楚人發現自己的話說不通。",a:4,e:"「弗能應」是答不出來。被人一問，前後兩句話互相衝突，他就沒話說了。"},
 {t:11,k:"第 1 步・關鍵字義",s:"「欲負而走」的「負」是什麼意思？",o:["背在身上", "辜負", "失敗", "虧欠"],e:"負＝背。他想把鐘背起來跑走。「走」是跑。"},
 {t:11,k:"第 2 步・誰做了什麼",s:"「恐人聞之而奪己也」，是誰怕什麼？",o:["得到鐘的人怕別人聽到鐘聲", "范氏怕百姓聽到消息", "別人怕聽到鐘聲", "得到鐘的人怕別人聽到他說話"],e:"主語是得到鐘的那個人。「之」指敲鐘發出的聲音。"},
 {t:11,k:"第 3 步・找證據句",c:"這口鐘沒辦法整個搬走。",a:1,e:"「鍾大不可負」是鐘太大、背不動，所以他才想把鐘敲碎。"},
 {t:12,k:"第 1 步・關鍵字義",s:"「看書竟」的「書」是什麼意思？",o:["書信", "書本", "書法", "寫字"],e:"前面說淮上有人送消息來，這裡的「書」是信。「竟」是完，看完信的意思。"},
 {t:12,k:"第 2 步・誰做了什麼",s:"「答曰：小兒輩大破賊」，回答的人是誰？",o:["謝公", "謝玄", "客人", "送信的人"],e:"客人問，下棋的謝公回答。主語省略了。謝玄在前線，不在場。"},
 {t:12,k:"第 3 步・找證據句",c:"這封信帶來的是打勝仗的消息。",a:2,e:"「大破賊」就是大敗敵軍。第 2 句只寫他看完信不說話，還看不出信的內容。"},
 {t:13,k:"第 1 步・關鍵字義",s:"「使弈秋誨二人弈」的「誨」是什麼意思？",o:["教導", "後悔", "責罵", "邀請"],e:"誨＝教。成語「誨人不倦」就是教人不知疲倦。"},
 {t:13,k:"第 2 步・誰做了什麼",s:"「思援弓繳而射之」，是誰想射什麼？",o:["分心的那個學生想射天鵝", "弈秋想射天鵝", "專心的那個學生想射天鵝", "弈秋想射學生"],e:"主語是「一人」，就是心裡想著鴻鵠的那個學生。「之」指鴻鵠（天鵝）。"},
 {t:13,k:"第 3 步・找證據句",c:"兩個人一起學，成果卻不一樣。",a:3,e:"「俱學」是一起學，「弗若之」是比不上他。第 2、3 句寫的是學習的態度，最後一句才寫結果。"},
 {t:14,k:"第 1 步・關鍵字義",s:"「天帝使我長百獸」的「長」是什麼意思？",o:["當首領、掌管", "長大", "長度", "擅長"],e:"這裡讀ㄓㄤˇ，當動詞用，意思是做百獸的首領。"},
 {t:14,k:"第 2 步・誰做了什麼",s:"「故遂與之行」，是誰跟誰一起走？",o:["老虎跟狐狸一起走", "狐狸跟百獸一起走", "老虎跟百獸一起走", "天帝跟狐狸一起走"],e:"主語承接前半句的「虎」。「之」指狐狸。"},
 {t:14,k:"第 3 步・找證據句",c:"野獸真正害怕的是老虎。",a:5,e:"「獸畏己而走」的「己」是老虎自己。第 5 句只說野獸都跑了，沒說怕的是誰。"}
]}

var CAPS = ["同一把鑰匙，打開的門不一樣。同一個字，放進不同的詞，意思也不一樣。", "兩盞燈籠幾乎一樣，差別只在小地方。形近字也要看清楚偏旁。", "成語像一齣小戲，先想像畫面，才知道該用在什麼場合。", "多餘的積木要拿掉，軌道接得順，火車才跑得動。句子也一樣。", "把箭頭翻過來是倒，把氣球吹大是吹，偷換卡片是換，把箱子搬走是搬。"];

var ROUND = 8; // 每關每次抽幾題
var GROUPS = 3; // 文言短篇每次抽幾篇
STAGES.forEach(function(s){ if(!s.texts)return; s.q.forEach(function(q){
  var T=s.texts[q.t]; if(q.c){q.x=T.x; q.k+="　"+T.src} else q.p=T.x.join("")+"（"+T.src+"）";
})});
function size(s){return s.texts?GROUPS*3:Math.min(ROUND,s.q.length)}
function draw(s){
  var idx=s.q.map(function(_,k){return k});
  if(!s.texts)return shuffle(idx).slice(0,ROUND);
  var out=[]; shuffle(s.texts.map(function(_,k){return k})).slice(0,GROUPS).forEach(function(t){idx.forEach(function(k){if(s.q[k].t===t)out.push(k)})});
  return out;
}
var KEY = "word-quest-best-v2";
function readBest(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
function saveBest(b){try{localStorage.setItem(KEY,JSON.stringify(b))}catch(e){}}
var best = readBest();
var app = document.getElementById("app");

function el(tag, cls, text){var n=document.createElement(tag); if(cls)n.className=cls; if(text!==undefined)n.textContent=text; return n}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function clear(){app.textContent="";window.scrollTo(0,0)}
function back(label,fn){var a=el("a","back",label);a.href=fn?"#":"../index.html";if(fn)a.onclick=function(e){e.preventDefault();fn()};app.appendChild(a)}

function home(){
  clear(); back("← 回學習小站");
  app.appendChild(el("h1","","字詞語句闖關"));
  app.appendChild(el("p","sub","前五關是選擇題，共 80 題，每關每次隨機抽 8 題。第六關「找證據句」要回短文點出證據；第七關「文言短篇」有 15 篇短古文，每次抽 3 篇，每篇連問三步。答完馬上看解析，答錯的可以再練。"));
  STAGES.forEach(function(s,i){
    var b=el("button","stage");
    b.appendChild(el("span","num",String(i+1)));
    var d=el("span"); d.appendChild(el("b","",s.t)); d.appendChild(el("small","",s.d)); b.appendChild(d);
    if(best[i]!==undefined)b.appendChild(el("span","score","最佳 "+best[i]+"/"+size(s)));
    b.onclick=function(){play(i,draw(s),[])};
    app.appendChild(b);
  });
  app.appendChild(el("footer","","題目與短文皆為自編。進度只存在這台裝置的瀏覽器裡。"));
}

function play(si,order,missed,pos,isRetry){
  pos=pos||0; var stage=STAGES[si], item=stage.q[order[pos]];
  clear(); back("← 回關卡列表",home);
  var m=el("div","meta"); m.appendChild(el("span","",(isRetry?"再練一次・":"")+stage.t)); m.appendChild(el("span","",(pos+1)+" / "+order.length)); app.appendChild(m);
  var bar=el("div","bar"), fill=el("i"); fill.style.width=(pos/order.length*100)+"%"; bar.appendChild(fill); app.appendChild(bar);
  if(pos===0&&!isRetry&&ART[si]){var fig=el("figure","art"),img=el("img");img.src=ART[si];img.alt=CAPS[si];img.width=640;img.height=427;fig.appendChild(img);fig.appendChild(el("figcaption","",CAPS[si]));app.appendChild(fig)}
  if(item.k)app.appendChild(el("p","step",item.k));
  if(item.x){playEv(si,order,missed,pos,isRetry,item);return}
  if(item.p)app.appendChild(el("div","passage",item.p));
  app.appendChild(el("p","q",item.s));
  var right=item.o[0], boxes=[];
  shuffle(item.o).forEach(function(t){
    var b=el("button","opt",t); boxes.push(b);
    b.onclick=function(){
      var ok=t===right;
      boxes.forEach(function(x){x.disabled=true; if(x.textContent===right)x.classList.add("ok")});
      if(!ok){b.classList.add("no"); missed.push(order[pos])}
      var ex=el("div","ex"+(ok?"":" wrong")); ex.appendChild(el("b","",ok?"答對了！":"再想想："));
      ex.appendChild(document.createTextNode(item.e)); app.appendChild(ex);
      var go=el("button","go",pos+1<order.length?"下一題":"看結果");
      go.onclick=function(){pos+1<order.length?play(si,order,missed,pos+1,isRetry):result(si,order,missed,isRetry)};
      app.appendChild(go); go.focus({preventScroll:true});
    };
    app.appendChild(b);
  });
}

function playEv(si,order,missed,pos,isRetry,item){
  var c=el("div","claim"); c.appendChild(el("small","","結論")); c.appendChild(document.createTextNode(item.c)); app.appendChild(c);
  app.appendChild(el("p","hint","下面哪一句最能證明這個結論？點那一句。"));
  var boxes=[];
  item.x.forEach(function(t,k){
    var b=el("button","opt sent"); b.appendChild(el("span","sn",String(k+1))); b.appendChild(el("span","",t)); boxes.push(b);
    b.onclick=function(){
      var ok=k===item.a;
      boxes.forEach(function(x,n){x.disabled=true; if(n===item.a)x.classList.add("ok")});
      if(!ok){b.classList.add("no"); missed.push(order[pos])}
      var ex=el("div","ex"+(ok?"":" wrong")); ex.appendChild(el("b","",ok?"找到了！":"再想想："));
      ex.appendChild(document.createTextNode(item.e)); app.appendChild(ex);
      var go=el("button","go",pos+1<order.length?"下一題":"看結果");
      go.onclick=function(){pos+1<order.length?play(si,order,missed,pos+1,isRetry):result(si,order,missed,isRetry)};
      app.appendChild(go); go.focus({preventScroll:true});
    };
    app.appendChild(b);
  });
}

function result(si,order,missed,isRetry){
  var stage=STAGES[si], got=order.length-missed.length;
  if(!isRetry){ if(best[si]===undefined||got>best[si]){best[si]=got;saveBest(best)} }
  clear(); back("← 回關卡列表",home);
  app.appendChild(el("h1","",(isRetry?"再練一次：":"")+stage.t));
  app.appendChild(el("p","big",got+" / "+order.length));
  app.appendChild(el("p","sub",missed.length?"把下面的題目再看一次，然後重練。":"全部答對，可以挑戰下一關！"));
  missed.forEach(function(k){var q=stage.q[k],d=el("div","miss");d.appendChild(el("b","",q.s||q.c));d.appendChild(el("small","",q.o?"正解："+q.o[0]:"證據句："+q.x[q.a]));app.appendChild(d)});
  if(missed.length){var r=el("button","go","只練答錯的題目");r.onclick=function(){play(si,shuffle(missed),[],0,true)};app.appendChild(r)}
  var h=el("button","go ghost","回關卡列表");h.onclick=home;app.appendChild(h);
}
home();
</script>
</body>
</html>
