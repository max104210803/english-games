<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神祕的天空闖關</title>
<!-- 五上自然 神祕的天空 闖關（網站版，2026-11-21）：只有模擬器、遊戲與自編題。由 build_nat_quest.py 產生。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fa; --paper:#ffffff; --ink:#1f2a37; --muted:#5f6b7a; --line:#dbe3ec;
  --red:#c8463d; --red-soft:#fbe9e6; --yellow:#e8b730; --yellow-soft:#fdf3d4;
  --blue:#2f6fbf; --blue-soft:#e4eefa; --green:#2f8a57; --green-soft:#e3f3e9;
  --purple:#7a54b8; --purple-soft:#efe8fa;
  --shadow:0 2px 0 rgba(31,42,55,.06), 0 8px 24px rgba(31,42,55,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a21; --paper:#1d252f; --ink:#e8eef5; --muted:#a3b0bf; --line:#334050;
    --red:#ec7b70; --red-soft:#3b2422; --yellow:#e9c04e; --yellow-soft:#3a3220;
    --blue:#7eaee8; --blue-soft:#1d2c40; --green:#5cc08a; --green-soft:#1b3326;
    --purple:#b49be2; --purple-soft:#2c2440; --shadow:0 2px 0 rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#141a21; --paper:#1d252f; --ink:#e8eef5; --muted:#a3b0bf; --line:#334050;
  --red:#ec7b70; --red-soft:#3b2422; --yellow:#e9c04e; --yellow-soft:#3a3220;
  --blue:#7eaee8; --blue-soft:#1d2c40; --green:#5cc08a; --green-soft:#1b3326;
  --purple:#b49be2; --purple-soft:#2c2440; --shadow:0 2px 0 rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
header h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(26px,5vw,38px);margin:8px 0 2px}
header p{margin:0;color:var(--muted);font-size:15px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.theme{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:4px 10px;font:inherit;font-size:14px;cursor:pointer}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 22px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--line)}
nav button{flex:1 1 auto;min-width:96px;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 10px;font:inherit;font-size:15px;cursor:pointer}
nav button .st{color:var(--line);margin-left:4px}
nav button.done .st{color:var(--yellow)}
nav button.on{border-color:var(--blue);box-shadow:inset 0 -3px 0 var(--blue)}
section.stage{display:none}
section.stage.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.badge{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700}
.badge.ext{background:var(--purple)}
h2{font-family:"Noto Serif TC",serif;font-size:clamp(24px,4.4vw,32px);margin:8px 0 4px}
h3{font-size:19px;margin:0 0 8px}
img.hero{display:block;width:100%;max-width:560px;height:auto;margin:10px auto 14px;border-radius:18px;box-shadow:var(--shadow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) img.hero{filter:brightness(.88)}}
:root[data-theme="dark"] img.hero{filter:brightness(.88)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;box-shadow:var(--shadow)}
.motto{background:var(--yellow-soft);border-left:6px solid var(--yellow);border-radius:12px;padding:12px 16px;font-weight:700}
.small{font-size:14px;color:var(--muted)}
.q{margin:6px 0 4px}
.q .num{font-weight:700;color:var(--blue);margin-right:6px}
.q .stem{font-weight:500;margin-bottom:8px}
.q .zh{font-size:14px;color:var(--muted);margin:-4px 0 8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer;transition:transform .1s}
.opt:hover{border-color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);animation:shake .3s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{margin-top:8px;font-size:15px;border-radius:10px;padding:8px 12px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--green-soft)} .fb.no{background:var(--red-soft)}
.para{display:block;margin-top:6px;font-size:14px;background:var(--blue-soft);border-radius:8px;padding:6px 10px}
.btn{border:none;background:var(--blue);color:#fff;border-radius:10px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;margin:8px 8px 0 0}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font:inherit;font-size:14px;border-radius:999px;padding:3px 12px;background:var(--paper);color:var(--muted);border:1.5px solid var(--line);cursor:pointer}
.pill:hover{border-color:var(--blue);color:var(--ink)}
.pill.sel{background:var(--blue-soft);border-color:var(--blue);color:var(--ink)}
.tipbox{display:none;margin-top:10px;border-radius:12px;padding:10px 14px;background:var(--blue-soft);font-size:15px;border-left:5px solid var(--blue)}
.tipbox.show{display:block;animation:fade .2s ease}
.reveal{display:none;margin-top:10px;background:var(--green-soft);border-radius:12px;padding:10px 14px}
.reveal.show{display:block;animation:fade .2s ease}
.clear{display:none;text-align:center;background:var(--yellow-soft);border:2px solid var(--yellow);border-radius:16px;padding:16px;margin:20px 0;font-weight:700;font-size:18px}
.clear.show{display:block;animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9)}70%{transform:scale(1.03)}100%{transform:scale(1)}}
.score{font-size:14px;color:var(--muted);text-align:right}
/* Watch / Warning */
.sort{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sort .opt{flex:1 1 140px;text-align:center;font-weight:700}
.wbox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wbox > div{border-radius:12px;padding:12px 14px}
.wbox .w1{background:var(--yellow-soft);border-left:6px solid var(--yellow)}
.wbox .w2{background:var(--red-soft);border-left:6px solid var(--red)}
@media (max-width:600px){.wbox{grid-template-columns:1fr} nav{position:static}}
/* 點線索 */
.sent{line-height:2.3;font-size:18px}
.sent .ch{cursor:pointer;border-radius:6px;padding:2px 3px;border:1.5px dashed transparent;transition:background .15s}
.sent .ch:hover{border-color:var(--blue);background:var(--blue-soft)}
.sent .ch.hit{background:var(--green-soft);border:1.5px solid var(--green)}
.sent .ch.miss{background:var(--red-soft);border:1.5px solid var(--red)}
.sent u{text-decoration-thickness:2px;font-weight:700}
textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--paper);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--blue)}
label.chk{display:block;margin:4px 0;cursor:pointer}
.starter{font-size:14px;color:var(--muted);margin:4px 0 8px}
.starter code{background:var(--blue-soft);color:var(--ink);border-radius:6px;padding:1px 6px;font-family:inherit}
table.vt{width:100%;border-collapse:collapse;font-size:15px}
table.vt td,table.vt th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.vt th{color:var(--muted);font-weight:500}
footer{margin-top:30px;font-size:13px;color:var(--muted)}
/* 拖拉分類框 */
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;z-index:4;background:var(--bg);padding:8px 0}
.bin{border:3px dashed var(--line);border-radius:14px;padding:10px;text-align:center;font-weight:700;transition:transform .15s,background .15s}
.bin small{font-weight:400;color:var(--muted)}
.bin[data-v="Watch"]{background:var(--yellow-soft);border-color:var(--yellow)}
.bin[data-v="Warning"]{background:var(--red-soft);border-color:var(--red)}
.bin.over{transform:scale(1.04);border-style:solid}
.grip{display:inline-block;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;background:var(--blue-soft);border:1.5px solid var(--blue);border-radius:8px;padding:0 8px;margin-right:6px;font-size:14px}
.dragghost{position:fixed;z-index:60;pointer-events:none;max-width:320px;background:var(--paper);border:2px solid var(--blue);border-radius:12px;padding:8px 12px;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.25);transform:rotate(-2deg)}
.card.dragging{opacity:.4}
/* 進度與鼓勵 */
.pbar{position:relative;height:22px;background:var(--line);border-radius:999px;margin:6px 0 10px;overflow:hidden}
.pbar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--green),var(--yellow));border-radius:999px;transition:width .5s ease}
.pbar span{position:relative;display:block;text-align:center;font-size:13px;line-height:22px;font-weight:700;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-weight:700;box-shadow:var(--shadow);transition:opacity .4s}
.toast.bye{opacity:0}
.celebrate{position:fixed;inset:0;z-index:80;background:rgba(10,15,25,.55);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .25s ease}
.cbox{background:var(--paper);border-radius:22px;max-width:440px;width:100%;padding:24px 22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .4s ease}
.cemo{font-size:64px;line-height:1.1;animation:bounce 1s ease infinite alternate}
@keyframes bounce{to{transform:translateY(-8px) rotate(-6deg)}}
.ctitle{font-family:"Noto Serif TC",serif;font-weight:900;font-size:24px;margin:6px 0}
.cstars{font-size:38px;color:var(--yellow);letter-spacing:4px}
.cstars span{display:inline-block;animation:pop .45s ease both}
.cstars .dim{color:var(--line);animation:none}
.cen{font-size:22px;font-weight:700;color:var(--blue);margin-top:4px}
.czh{margin:2px 0 10px}
.cstat{font-size:14px;color:var(--muted);margin-bottom:8px}
.crest{background:var(--yellow-soft);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:6px}
canvas.confetti{position:fixed;inset:0;z-index:90;pointer-events:none}

.sim{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px;margin:0 0 16px;box-shadow:var(--shadow)}
.simrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0}
.simrow .lab{font-weight:700;min-width:44px}
.simrow input[type=range]{flex:1;min-width:160px;accent-color:var(--blue)}
.chip{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:2px 12px;font:inherit;font-size:15px;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.views{display:grid;grid-template-columns:3fr 2fr;gap:10px;margin-top:8px}
.views svg{width:100%;height:auto;background:var(--bg);border-radius:12px}
.vcap{font-size:13px;color:var(--muted);text-align:center}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-top:10px}
.readout div{background:var(--bg);border-radius:10px;padding:4px 10px;font-size:15px}
.readout b{color:var(--blue)}
.pl{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 12px 3px 4px;margin:4px;font:inherit;font-size:16px;cursor:pointer}
.pl i{display:inline-block;border-radius:50%}
.pl.used{opacity:.25;pointer-events:none}
.pl.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
.slot{min-width:64px;min-height:36px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px}
.slot.fill{border-style:solid;border-color:var(--green);background:var(--green-soft);font-weight:700}
.gmsg{min-height:1.8em;font-weight:700}
.big{font-size:22px;font-weight:900;margin:6px 0}
@media (max-width:640px){.views{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="topbar">
    <span class="badge"><a href="../index.html" style="color:inherit;text-decoration:none">← 回學習小站</a></span>
    <span><button class="theme" id="sndBtn" title="音效開關">🔊</button> <button class="theme" id="themeBtn" title="切換深淺色">🌓</button></span>
  </div>
  <h1>神祕的天空闖關</h1>
  <p>四關：先用太陽模擬器看太陽一年四季怎麼走，再答題；接著幫八大行星排隊、分類，最後答題。答錯可以再選，「第一次就答對」才算分。</p>
</header>
<nav id="nav"></nav>
<div id="stages"></div>
<footer>
  題目與模擬器為自編內容，地點以北緯 23.5 度計算。進度存在這台電腦的瀏覽器。
  <button class="btn ghost" id="resetBtn" style="font-size:13px;padding:2px 10px">清除進度</button>
</footer>
</div>

    if(s.h>0){ var p=P(s.h,s.az); mk("circle",{cx:p[0],cy:p[1],r:.075,fill:"#fbbf24",stroke:"#f59e0b","stroke-width":.015}); }
    map.innerHTML="";
    mk("circle",{cx:0,cy:0,r:1.05,fill:"rgba(126,174,232,.12)",stroke:"#94a3b8","stroke-width":.015},map);
    D8.forEach(function(nm,k){ var a=k*45*Math.PI/180, r=k%2?1.2:1.28;
      var t=mk("text",{x:(r*Math.sin(a)).toFixed(3),y:(-r*Math.cos(a)+0.06).toFixed(3),"font-size":k%2?0.15:0.19,"text-anchor":"middle",fill:"currentColor","font-weight":k%2?400:700},map); t.textContent=nm; });
    var read=$("sunRead");
    if(s.h>0){
      var L=1/Math.tan(s.h*Math.PI/180), sl=Math.min(L,3.2)*0.32, sa=(s.az+180)*Math.PI/180, za=s.az*Math.PI/180;
      if(s.h<89.5) mk("line",{x1:0,y1:0,x2:(sl*Math.sin(sa)).toFixed(3),y2:(-sl*Math.cos(sa)).toFixed(3),stroke:"#475569","stroke-width":.09,"stroke-linecap":"round",opacity:.75},map);
      mk("circle",{cx:(0.85*Math.sin(za)).toFixed(3),cy:(-0.85*Math.cos(za)).toFixed(3),r:.12,fill:"#fbbf24",stroke:"#f59e0b","stroke-width":.02},map);
      mk("circle",{cx:0,cy:0,r:.06,fill:"#ea580c"},map);
      read.innerHTML='<div>高度角：<b>'+Math.round(s.h)+' 度</b></div><div>太陽方位：<b>'+(s.h>89.5?"頭頂上":dir8(s.az))+'</b></div>'+
        '<div>影子方位：<b>'+(s.h>89.5?"幾乎沒有影子":dir8((s.az+180)%360))+'</b></div><div>影子長：<b>'+(s.h>89.5?"0":L.toFixed(1))+' 倍竿高</b></div>';
    }else{
      mk("circle",{cx:0,cy:0,r:.06,fill:"#ea580c"},map);
      read.innerHTML='<div><b>'+(hour<12?"太陽還沒升起":"太陽已經下山")+'</b></div><div>沒有影子</div>';
    }
    var riseTxt=Math.abs(riseAz-90)<1.5?"正東":(riseAz<90?"東偏北":"東偏南"), setTxt=Math.abs(riseAz-90)<1.5?"正西":(riseAz<90?"西偏北":"西偏南");
    read.innerHTML+='<div>日出方位：<b>'+riseTxt+'</b></div><div>日落方位：<b>'+setTxt+'</b></div>'+
      '<div>日出約 <b>'+hm(12-H0)+'</b>、日落約 <b>'+hm(12+H0)+'</b></div><div>白天約 <b>'+(2*H0).toFixed(1)+' 小時</b></div>';
  }
  dayR.oninput=draw; hourR.oninput=draw;
  document.querySelectorAll("#sunsim .chip").forEach(function(b){ b.onclick=function(){ dayR.value=b.dataset.day; draw(); } });
  draw();
}


function buildPlanets(gid0, gid1){
  var PL=[["水星","#9ca3af","體積最小、離太陽最近"],["金星","#f59e0b","最熱，可達 480 ℃"],["地球","#3b82f6","目前所知唯一有生命"],["火星","#dc2626","表面橘紅色"],
          ["木星","#d6a36b","體積最大、有彩色條紋"],["土星","#eab308","體積第二大、有最大最亮的環"],["天王星","#22d3ee","最冷、藍綠色"],["海王星","#2563eb","離太陽最遠、藍色"]];
  var SZ=[12,16,16,13,30,27,21,21];
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t } return a }
  var slots=$("slots"), pool=$("pool"), next=0, miss1=0;
  PL.forEach(function(){ slots.insertAdjacentHTML("beforeend",'<span class="slot">?</span>') });
  function fillAll(){ slots.querySelectorAll(".slot").forEach(function(s,i){ s.textContent=PL[i][0]; s.classList.add("fill") });
    $("msg1").textContent="🎉 排好了：水金地火木土天海！"; }
  if(prog.ans[gid0]!==undefined){ fillAll(); }
  else shuffle(PL.map(function(_,i){return i})).forEach(function(i){
    var b=el('<button class="pl"><i style="width:'+SZ[i]+'px;height:'+SZ[i]+'px;background:'+PL[i][1]+'"></i>'+PL[i][0]+'</button>');
    b.onclick=function(){
      if(i===next){ b.classList.add("used"); var s=slots.querySelectorAll(".slot")[next]; s.textContent=PL[i][0]; s.classList.add("fill");
        $("msg1").textContent="✅ 第 "+(next+1)+" 顆："+PL[i][0]+"（"+PL[i][2]+"）"; sfx("ok"); next++;
        if(next===8){ fillAll(); markGame(gid0, miss1===0); } }
      else{ miss1++; b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); sfx("no");
        $("msg1").textContent="❌ 不是它喔。第 "+(next+1)+" 顆要比"+(next?PL[next-1][0]:"太陽")+"再遠一點。"; }
    };
    pool.appendChild(b);
  });
  var order=shuffle([0,1,2,3,4,5,6,7]), k=0, miss2=0;
  function ask(){ if(k>=8){ $("sortQ").textContent="🎉 全部分好了！"; $("msg2").innerHTML="類地：水金地火（近、小、密度大、有固態表面）；類木：木土天海（遠、大、密度小、沒有固態表面）。";
      $("btnT").disabled=$("btnJ").disabled=true; return true }
    $("sortQ").textContent="第 "+(k+1)+" / 8 顆："+PL[order[k]][0]+" 是哪一類？"; return false }
  function pick(j){ var i=order[k], ok=(i>=4)===j;
    if(ok){ sfx("ok"); $("msg2").textContent="✅ "+PL[i][0]+"是"+(j?"類木":"類地")+"行星："+PL[i][2]; k++; if(ask()) markGame(gid1, miss2===0); }
    else{ miss2++; sfx("no"); $("msg2").textContent="❌ 再想想：水金地火是類地，木土天海是類木。"; } }
  $("btnT").onclick=function(){pick(false)}; $("btnJ").onclick=function(){pick(true)};
  if(prog.ans[gid1]!==undefined){ k=8; ask(); } else ask();
}

var N=STAGES.length, IDS={};
STAGES.forEach(function(S,si){
  var st=si+1;
  $("nav").insertAdjacentHTML("beforeend",'<button data-go="'+st+'">第'+st+'關 '+S.name+'<span class="st">★</span></button>');
  var sec=el('<section class="stage" data-stage="'+st+'"><span class="badge">第 '+st+' 關</span>'+(S.tag?' <span class="badge ext">'+S.tag+'</span>':'')+
    '<h2>'+S.name+'</h2><div class="pbar" id="pb'+st+'"><i></i><span></span></div><div class="card"><div class="motto">'+S.motto+'</div></div>'+
    (S.widget||"")+'<div id="mc'+st+'"></div><div class="score" id="sc'+st+'"></div><div class="clear" data-clear="'+st+'">'+S.emo+' 第 '+st+' 關過關！</div></section>');
  $("stages").appendChild(sec);
  IDS[st]=S.games ? S.games.slice() : S.list.map(function(_,i){return "s"+st+"q"+i});
});
function renderMC(st, list){
  var box=$("mc"+st);
  list.forEach(function(it,i){
    var id="s"+st+"q"+i;
    var c=el('<div class="card q">'+
      '<div class="stem"><span class="num">'+(i+1)+'.</span>'+it.q+'</div>'+
      '<div class="opts"></div><div class="fb"></div></div>');
    var opts=c.querySelector(".opts"), fb=c.querySelector(".fb");
    it.o.forEach(function(t,k){ var b=el('<button class="opt">'+(it.ox?t:LET[k]+' '+t)+'</button>'); b.onclick=function(){ choose(k,true) }; opts.appendChild(b); });
    function choose(k,user){
      var bs=opts.querySelectorAll(".opt");
      if(k===it.a){
        bs.forEach(function(x,j){ x.disabled=true; if(j===it.a) x.classList.add("right") });
        fb.className="fb show ok"; fb.innerHTML="✅ "+(user?praise()+" ":"答對了！")+it.e+(it.p?'<span class="para">📌 陷阱：'+it.p+'</span>':"");
        if(user){ sfx("ok"); if(!(id in prog.first)) prog.first[id]=true; prog.ans[id]=k; save(); check(st,true) }
      }else{
        bs[k].classList.add("wrong"); bs[k].disabled=true; fb.className="fb show no"; fb.innerHTML="❌ 再想想，"+(STAGES[st-1].widget?"用上面的模擬器試試看。":"回想筆記的重點。");
        if(user){ sfx("no"); if(!(id in prog.first)) prog.first[id]=false; save() }
      }
    }
    box.appendChild(c);
    if(prog.ans[id]!==undefined) choose(prog.ans[id],false);
  });
}
function markGame(id, firstOK){ var st=+Object.keys(IDS).filter(function(s){return IDS[s].indexOf(id)>=0})[0];
  if(!(id in prog.first)) prog.first[id]=firstOK; prog.ans[id]=1; save(); check(st,true); }
function check(st,user){
  var ids=IDS[st], fin=ids.filter(function(id){ return prog.ans[id]!==undefined }).length, tot=ids.length, ok=fin===tot, was=!!prog.done[st],
      first=ids.filter(function(id){ return prog.first[id]===true }).length;
  $("sc"+st).textContent=(STAGES[st-1].games?"一次就完成的遊戲：":"第一次就答對：")+first+" / "+tot;
  var pb=$("pb"+st); pb.querySelector("i").style.width=Math.round(fin/tot*100)+"%"; pb.querySelector("span").textContent="本關進度 "+fin+" / "+tot+(ok?"　⭐ 完成":"");
  var c=document.querySelector('[data-clear="'+st+'"]'); if(ok){ c.classList.add("show"); prog.done[st]=true; save() }
  var nb=document.querySelector('nav [data-go="'+st+'"]'); if(nb) nb.classList.toggle("done", !!prog.done[st]);
  if(user && ok && !was) celebrate(st, first, tot);
}
var PRAISE=["太棒了！","好厲害！","漂亮！","答對了！","很會喔！","讚！"];
var FIN=["神祕天空探險家！", "太陽、四季和八大行星都難不倒你。"], T0=Date.now();
function praise(){ return PRAISE[Math.floor(Math.random()*PRAISE.length)] }
function celebrate(st, first, tot){
  var stars=first===tot?3:(first>=tot*0.6?2:1), mins=Math.max(1,Math.round((Date.now()-T0)/60000)),
      all=STAGES.every(function(_,i){return prog.done[i+1]}), S=STAGES[st-1], starHtml="";
  for(var i=0;i<3;i++) starHtml+= i<stars ? '<span style="animation-delay:'+(0.25+i*0.25)+'s">★</span>' : '<span class="dim">★</span>';
  var nextSt=st<N?st+1:0;
  var m=el('<div class="celebrate"><div class="cbox"><div class="cemo">'+(all?"🏆":S.emo)+'</div>'+
    '<div class="ctitle">'+(all?"全部過關！":"第 "+st+" 關「"+S.name+"」過關！")+'</div><div class="cstars">'+starHtml+'</div>'+
    '<div class="cen">'+(all?FIN[0]:S.cheer[0])+'</div><div class="czh">'+(all?FIN[1]:S.cheer[1])+'</div>'+
    '<div class="cstat">'+(S.games?"一次就完成 ":"第一次就答對 ")+'<b>'+first+' / '+tot+'</b>　·　這次練了 <b>'+mins+'</b> 分鐘</div>'+
    (mins>=15?'<div class="crest">☕ 已經練超過 15 分鐘了，起來喝口水、看看遠方，再回來繼續。</div>':'')+
    '<div>'+(nextSt?'<button class="btn" data-next>下一關 →</button>':'')+'<button class="btn ghost" data-close>'+(nextSt?'先休息一下':'關閉')+'</button></div></div></div>');
  document.body.appendChild(m); confetti(); sfx("win");
  var nx=m.querySelector("[data-next]"); if(nx) nx.onclick=function(){ m.remove(); go(nextSt); window.scrollTo({top:0,behavior:"smooth"}) };
  m.querySelector("[data-close]").onclick=function(){ m.remove() }; m.onclick=function(e){ if(e.target===m) m.remove() };
}
function confetti(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var cv=document.createElement("canvas"), x=cv.getContext("2d"), W=cv.width=innerWidth, H=cv.height=innerHeight, P=[], col=["#e8b730","#2f6fbf","#c8463d","#2f8a57","#7a54b8","#f08cb4"];
  cv.className="confetti"; document.body.appendChild(cv);
  for(var i=0;i<140;i++) P.push({x:W/2+(Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*14, vy:-Math.random()*13-4, r:Math.random()*6+4, c:col[i%col.length], a:Math.random()*6, s:(Math.random()-.5)*.3});
  var t0=performance.now();
  (function f(t){ var k=Math.max(0,(t-t0)/1000); x.clearRect(0,0,W,H);
    P.forEach(function(p){ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.s; x.save(); x.globalAlpha=Math.max(0,1-k/2.6); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore() });
    if(k<2.6) requestAnimationFrame(f); else cv.remove() })(t0);
}


function go(n){
  document.querySelectorAll("section.stage").forEach(function(s){ s.classList.toggle("on", s.dataset.stage==n) });
  document.querySelectorAll("nav button").forEach(function(b){ b.classList.toggle("on", b.dataset.go==n) });
  prog.cur=n; save();
}
document.addEventListener("click",function(e){ var g=e.target.closest("[data-go]"); if(g){ go(g.dataset.go); window.scrollTo({top:0,behavior:"smooth"}) } });
$("themeBtn").onclick=function(){
  var r=document.documentElement, dark=r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; prog.theme=r.dataset.theme; save();
};
if(prog.theme) document.documentElement.dataset.theme=prog.theme;
$("sndBtn").onclick=function(){ prog.mute=!prog.mute; save(); sndIcon(); if(!prog.mute) sfx("ok") };
sndIcon();
$("resetBtn").onclick=function(){ if(confirm("確定要清除所有作答進度嗎？")){ try{localStorage.removeItem(KEY)}catch(e){} location.reload() } };
STAGES.forEach(function(S,si){
  var st=si+1;
  if(S.kind==="sun") buildSun();
  if(S.kind==="planets") buildPlanets(S.games[0], S.games[1]);
  if(S.list) renderMC(st, S.list);
  check(st,false);
});
go(prog.cur||1);
})();
</script>
