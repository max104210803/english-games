<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神祕的天空闖關</title>
<!-- 五上自然 神祕的天空 闖關（網站版，2026-11-21）：只有模擬器、動畫、遊戲、圖解與自編題。由 build_nat_quest.py 產生。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fa; --paper:#ffffff; --ink:#1f2a37; --muted:#5f6b7a; --line:#dbe3ec;
  --red:#c8463d; --red-soft:#fbe9e6; --yellow:#e8b730; --yellow-soft:#fdf3d4;
  --blue:#2f6fbf; --blue-soft:#e4eefa; --green:#2f8a57; --green-soft:#e3f3e9;
  --purple:#7a54b8; --purple-soft:#efe8fa;
  --shadow:0 2px 0 rgba(31,42,55,.06), 0 8px 24px rgba(31,42,55,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a21; --paper:#1d252f; --ink:#e8eef5; --muted:#a3b0bf; --line:#334050;
    --red:#ec7b70; --red-soft:#3b2422; --yellow:#e9c04e; --yellow-soft:#3a3220;
    --blue:#7eaee8; --blue-soft:#1d2c40; --green:#5cc08a; --green-soft:#1b3326;
    --purple:#b49be2; --purple-soft:#2c2440; --shadow:0 2px 0 rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#141a21; --paper:#1d252f; --ink:#e8eef5; --muted:#a3b0bf; --line:#334050;
  --red:#ec7b70; --red-soft:#3b2422; --yellow:#e9c04e; --yellow-soft:#3a3220;
  --blue:#7eaee8; --blue-soft:#1d2c40; --green:#5cc08a; --green-soft:#1b3326;
  --purple:#b49be2; --purple-soft:#2c2440; --shadow:0 2px 0 rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
header h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(26px,5vw,38px);margin:8px 0 2px}
header p{margin:0;color:var(--muted);font-size:15px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.theme{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:4px 10px;font:inherit;font-size:14px;cursor:pointer}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 22px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--line)}
nav button{flex:1 1 auto;min-width:96px;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 10px;font:inherit;font-size:15px;cursor:pointer}
nav button .st{color:var(--line);margin-left:4px}
nav button.done .st{color:var(--yellow)}
nav button.on{border-color:var(--blue);box-shadow:inset 0 -3px 0 var(--blue)}
section.stage{display:none}
section.stage.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.badge{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700}
.badge.ext{background:var(--purple)}
h2{font-family:"Noto Serif TC",serif;font-size:clamp(24px,4.4vw,32px);margin:8px 0 4px}
h3{font-size:19px;margin:0 0 8px}
img.hero{display:block;width:100%;max-width:560px;height:auto;margin:10px auto 14px;border-radius:18px;box-shadow:var(--shadow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) img.hero{filter:brightness(.88)}}
:root[data-theme="dark"] img.hero{filter:brightness(.88)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;box-shadow:var(--shadow)}
.motto{background:var(--yellow-soft);border-left:6px solid var(--yellow);border-radius:12px;padding:12px 16px;font-weight:700}
.small{font-size:14px;color:var(--muted)}
.q{margin:6px 0 4px}
.q .num{font-weight:700;color:var(--blue);margin-right:6px}
.q .stem{font-weight:500;margin-bottom:8px}
.q .zh{font-size:14px;color:var(--muted);margin:-4px 0 8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer;transition:transform .1s}
.opt:hover{border-color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);animation:shake .3s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{margin-top:8px;font-size:15px;border-radius:10px;padding:8px 12px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--green-soft)} .fb.no{background:var(--red-soft)}
.para{display:block;margin-top:6px;font-size:14px;background:var(--blue-soft);border-radius:8px;padding:6px 10px}
.btn{border:none;background:var(--blue);color:#fff;border-radius:10px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;margin:8px 8px 0 0}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font:inherit;font-size:14px;border-radius:999px;padding:3px 12px;background:var(--paper);color:var(--muted);border:1.5px solid var(--line);cursor:pointer}
.pill:hover{border-color:var(--blue);color:var(--ink)}
.pill.sel{background:var(--blue-soft);border-color:var(--blue);color:var(--ink)}
.tipbox{display:none;margin-top:10px;border-radius:12px;padding:10px 14px;background:var(--blue-soft);font-size:15px;border-left:5px solid var(--blue)}
.tipbox.show{display:block;animation:fade .2s ease}
.reveal{display:none;margin-top:10px;background:var(--green-soft);border-radius:12px;padding:10px 14px}
.reveal.show{display:block;animation:fade .2s ease}
.clear{display:none;text-align:center;background:var(--yellow-soft);border:2px solid var(--yellow);border-radius:16px;padding:16px;margin:20px 0;font-weight:700;font-size:18px}
.clear.show{display:block;animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9)}70%{transform:scale(1.03)}100%{transform:scale(1)}}
.score{font-size:14px;color:var(--muted);text-align:right}
/* Watch / Warning */
.sort{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sort .opt{flex:1 1 140px;text-align:center;font-weight:700}
.wbox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wbox > div{border-radius:12px;padding:12px 14px}
.wbox .w1{background:var(--yellow-soft);border-left:6px solid var(--yellow)}
.wbox .w2{background:var(--red-soft);border-left:6px solid var(--red)}
@media (max-width:600px){.wbox{grid-template-columns:1fr} nav{position:static}}
/* 點線索 */
.sent{line-height:2.3;font-size:18px}
.sent .ch{cursor:pointer;border-radius:6px;padding:2px 3px;border:1.5px dashed transparent;transition:background .15s}
.sent .ch:hover{border-color:var(--blue);background:var(--blue-soft)}
.sent .ch.hit{background:var(--green-soft);border:1.5px solid var(--green)}
.sent .ch.miss{background:var(--red-soft);border:1.5px solid var(--red)}
.sent u{text-decoration-thickness:2px;font-weight:700}
textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--paper);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--blue)}
label.chk{display:block;margin:4px 0;cursor:pointer}
.starter{font-size:14px;color:var(--muted);margin:4px 0 8px}
.starter code{background:var(--blue-soft);color:var(--ink);border-radius:6px;padding:1px 6px;font-family:inherit}
table.vt{width:100%;border-collapse:collapse;font-size:15px}
table.vt td,table.vt th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.vt th{color:var(--muted);font-weight:500}
footer{margin-top:30px;font-size:13px;color:var(--muted)}
/* 拖拉分類框 */
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;z-index:4;background:var(--bg);padding:8px 0}
.bin{border:3px dashed var(--line);border-radius:14px;padding:10px;text-align:center;font-weight:700;transition:transform .15s,background .15s}
.bin small{font-weight:400;color:var(--muted)}
.bin[data-v="Watch"]{background:var(--yellow-soft);border-color:var(--yellow)}
.bin[data-v="Warning"]{background:var(--red-soft);border-color:var(--red)}
.bin.over{transform:scale(1.04);border-style:solid}
.grip{display:inline-block;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;background:var(--blue-soft);border:1.5px solid var(--blue);border-radius:8px;padding:0 8px;margin-right:6px;font-size:14px}
.dragghost{position:fixed;z-index:60;pointer-events:none;max-width:320px;background:var(--paper);border:2px solid var(--blue);border-radius:12px;padding:8px 12px;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.25);transform:rotate(-2deg)}
.card.dragging{opacity:.4}
/* 進度與鼓勵 */
.pbar{position:relative;height:22px;background:var(--line);border-radius:999px;margin:6px 0 10px;overflow:hidden}
.pbar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--green),var(--yellow));border-radius:999px;transition:width .5s ease}
.pbar span{position:relative;display:block;text-align:center;font-size:13px;line-height:22px;font-weight:700;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-weight:700;box-shadow:var(--shadow);transition:opacity .4s}
.toast.bye{opacity:0}
.celebrate{position:fixed;inset:0;z-index:80;background:rgba(10,15,25,.55);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .25s ease}
.cbox{background:var(--paper);border-radius:22px;max-width:440px;width:100%;padding:24px 22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .4s ease}
.cemo{font-size:64px;line-height:1.1;animation:bounce 1s ease infinite alternate}
@keyframes bounce{to{transform:translateY(-8px) rotate(-6deg)}}
.ctitle{font-family:"Noto Serif TC",serif;font-weight:900;font-size:24px;margin:6px 0}
.cstars{font-size:38px;color:var(--yellow);letter-spacing:4px}
.cstars span{display:inline-block;animation:pop .45s ease both}
.cstars .dim{color:var(--line);animation:none}
.cen{font-size:22px;font-weight:700;color:var(--blue);margin-top:4px}
.czh{margin:2px 0 10px}
.cstat{font-size:14px;color:var(--muted);margin-bottom:8px}
.crest{background:var(--yellow-soft);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:6px}
canvas.confetti{position:fixed;inset:0;z-index:90;pointer-events:none}

.sim{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px;margin:0 0 16px;box-shadow:var(--shadow)}
.simrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0}
.simrow .lab{font-weight:700;min-width:44px}
.simrow input[type=range]{flex:1;min-width:160px;accent-color:var(--blue)}
.chip{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:2px 12px;font:inherit;font-size:15px;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.views{display:grid;grid-template-columns:3fr 2fr;gap:10px;margin-top:8px}
.views svg{width:100%;height:auto;background:var(--bg);border-radius:12px}
.vcap{font-size:13px;color:var(--muted);text-align:center}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-top:10px}
.readout div{background:var(--bg);border-radius:10px;padding:4px 10px;font-size:15px}
.readout b{color:var(--blue)}
.pl{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 12px 3px 4px;margin:4px;font:inherit;font-size:16px;cursor:pointer}
.pl i{display:inline-block;border-radius:50%}
.pl.used{opacity:.25;pointer-events:none}
.pl.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
.slot{min-width:64px;min-height:36px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px}
.slot.fill{border-style:solid;border-color:var(--green);background:var(--green-soft);font-weight:700}
.gmsg{min-height:1.8em;font-weight:700}
.big{font-size:22px;font-weight:900;margin:6px 0}
.learn{background:var(--paper);border:2px solid var(--blue);border-radius:16px;padding:10px 14px;margin:0 0 16px;box-shadow:var(--shadow)}
.learn summary{font-weight:900;font-size:18px;cursor:pointer;color:var(--blue)}
.learn ul{margin:8px 0;padding-left:1.3em;line-height:1.75}
.learn .figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.learn figure{margin:0;background:#e6e6e6;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.learn img{width:100%;height:auto;display:block;cursor:zoom-in}
.learn figcaption{font-size:13px;color:#475569;text-align:center;padding:4px}
.lb{position:fixed;inset:0;background:rgba(15,23,42,.9);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;cursor:zoom-out}
.lb img{max-width:100%;max-height:86vh;border-radius:8px;background:#e6e6e6}
.lbcap{color:#fff;margin-top:8px;font-size:14px}
.memwrap{margin:16px 0}
.memt{font-weight:900;margin-bottom:8px}
.mem{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.flip{perspective:800px;background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:center}
.flip .in{position:relative;display:block;width:100%;height:120px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px 12px;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--line);font-size:16px;line-height:1.5}
.flip .f{background:var(--purple-soft);font-weight:700}
.flip .f::after{content:"👆 翻面";position:absolute;bottom:5px;right:10px;font-size:12px;color:var(--muted);font-weight:400}
.flip .b{background:var(--yellow-soft);transform:rotateY(180deg)}
@media (max-width:640px){.views{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="topbar">
    <span class="badge"><a href="../index.html" style="color:inherit;text-decoration:none">← 回學習小站</a></span>
    <span><button class="theme" id="sndBtn" title="音效開關">🔊</button> <button class="theme" id="themeBtn" title="切換深淺色">🌓</button></span>
  </div>
  <h1>神祕的天空闖關</h1>
  <p>四關加一個加油站：太陽模擬器 → 為什麼有四季（動畫）→ 八大行星排隊、分類 → 太陽系成員。每關先看「先看懂」圖解，最後翻「記起來」卡片；答錯可以再選，「第一次就答對」才算分，第一次答錯的題會放進「錯題再挑戰」。</p>
</header>
<nav id="nav"></nav>
<div id="stages"></div>
<footer>
  題目、模擬器、動畫與圖解皆為自編內容，地點以北緯 23.5 度計算。進度存在這台電腦的瀏覽器。
  <button class="btn ghost" id="resetBtn" style="font-size:13px;padding:2px 10px">清除進度</button>
</footer>
</div>
<script>
(function(){

var STAGES=[{"name": "太陽模擬器", "kind": "sun", "tag": "動手觀察", "widget": "<div class=\"sim\" id=\"sunsim\">\n  <div class=\"simrow\"><span class=\"lab\">日期</span>\n    <button class=\"chip\" data-day=\"80\">春分</button><button class=\"chip\" data-day=\"172\">夏至</button>\n    <button class=\"chip\" data-day=\"266\">秋分</button><button class=\"chip\" data-day=\"356\">冬至</button>\n    <input type=\"range\" id=\"dayR\" min=\"1\" max=\"365\" step=\"1\" value=\"172\"><span id=\"dayL\" style=\"min-width:80px\"></span></div>\n  <div class=\"simrow\"><span class=\"lab\">時間</span>\n    <input type=\"range\" id=\"hourR\" min=\"5\" max=\"19\" step=\"0.25\" value=\"9\"><span id=\"hourL\" style=\"min-width:56px\"></span></div>\n  <div class=\"views\">\n    <div><svg id=\"dome\" viewBox=\"-1.45 -1.12 2.9 1.82\"></svg><div class=\"vcap\">圓頂帳篷：北在左、南在右、東在前；灰虛線＝夏至、春秋分、冬至的路線</div></div>\n    <div><svg id=\"map\" viewBox=\"-1.5 -1.5 3 3\"></svg><div class=\"vcap\">從上往下看竿子：上北、右東</div></div>\n  </div>\n  <div class=\"readout\" id=\"sunRead\"></div>\n  <div class=\"vcap\">地點：北緯 23.5 度（嘉義）。時間用太陽時，和手錶可能差幾分鐘。</div>\n</div>", "list": [{"q": "按「冬至」，時間拉到 12:00。太陽高度角大約幾度？", "o": ["約 90 度", "約 66 度", "約 43 度", "約 20 度"], "a": 2, "e": "冬至中午太陽<b>最低</b>，約 43 度；夏至中午 90 度、春分秋分約 66 度。"}, {"q": "按「夏至」，看「日出方位」那一格。夏至的太陽從哪裡升起？", "o": ["東偏北", "正東", "東偏南", "正南"], "a": 0, "e": "夏至從<b>東偏北</b>升起、西偏北落下。"}, {"q": "按「春分」，看日出和日落方位。春分的太陽怎麼走？", "o": ["東偏北升、西偏北落", "正東升、正西落", "東偏南升、西偏南落", "正南升、正北落"], "a": 1, "e": "春分、秋分：<b>正東升、正西落</b>，白天和黑夜差不多一樣長。"}, {"q": "按「冬至」，時間拉到 10:00。竿子的影子指向哪一個方位？", "o": ["東南", "西北", "東北", "西南"], "a": 1, "e": "這時太陽在<b>東南</b>，影子在相反的<b>西北</b>。"}, {"q": "時間停在 12:00，依序按「夏至 → 春分 → 冬至」。影子長度怎麼變？", "o": ["越來越短", "越來越長", "都一樣長", "先變長再變短"], "a": 1, "e": "太陽越來越低，影子就<b>越來越長</b>：夏高冬低。"}, {"q": "按「夏至」，把時間從早上拖到傍晚。影子什麼時候最短？", "o": ["早上 6 時", "上午 9 時", "中午 12 時", "傍晚 18 時"], "a": 2, "e": "中午太陽最高，影子<b>最短</b>；早晚太陽低，影子很長。"}], "motto": "拖拖看：日期換季節、時間從早到晚，看太陽和影子怎麼跑。", "emo": "🧭", "cheer": ["模擬器達人！", "你親眼看到太陽一年四季怎麼走。"], "pre": "<details class=\"learn\" open><summary>📘 先看懂：太陽的位置</summary><ul><li><b>太陽高度角</b>：竿頂拉到影子末端的線，和地面的夾角。角度越大，太陽越高。</li><li>太陽越高，<b>影子越短</b>；影子永遠在太陽的<b>相反方位</b>（太陽在東南 → 影子在西北）。</li><li>一天之中：早上太陽在東邊、很低；<b>中午最高、影子最短</b>；傍晚到西邊又變低。</li><li>不同季節：夏至太陽從<b>東偏北</b>升起、中午最高；冬至從<b>東偏南</b>升起、中午最低；春分、秋分從<b>正東</b>升起。</li></ul><div class=\"figs\"><figure><img src=\"data:image/webp;base64,UklGRqCUAABXRUJQVlA4IJSUAACQRAKdASqwBNACPm02l0kkIqUhIrNJKKANiWdu7mGCblDWA9ybUgNfpqX2N3/P7C36b+9/ur/gvf+5B8CPg2VPx/7Y8urnv9K/lr85/+P/1/Y1/bf9V/2/cD/W71Rf879zvdX/bf+r6gv6T/lf2z93b/dfuD7k/7B/xPYA/qn+y/+XtXf+H2Gv8f/2P/t7g/9G/1///9dz93Pg8/tn/M/cn4Dv2w//P/H/9nwAf//1AP/d1t/VT/F/4X9jffb8i/X/79/hP8p/s/8X6b/jPzP9y/vX7Yf272rPpvyH+n/0n/l/xv4Y/Bf8n+1v5/+6/539kfbj/a/4z9uvNX4t/3X+H9gX8p/nv+i/tnrO+3/7P/af5v9gvGD0//Sf87/PewL6xfTv+D/iP3r/1Punevf7D+9fkh8D/ov91/5n+b/K/7Af5N/VP+J+d/+j/////+9f9P4G/3P/cf+v/hfkh9gX8u/vH/R/zH+v/Zf6Vf6j/z/6H/b/uN7Zfzn/Rf+n/Sf7j5Cf5x/af+5/jv9T7+3//94H7sf//3U/3J/+orl4+OuGXj464ZePjrhl4+OuGXj464ZePjrhl4+OuGXj464ZePjrhl4+OuGXj464ZePd0gEVTDYNeOlttRXASOVYLuX4w+3eqfumdOJ73IB2Mzcyynncp4/JwX9RxlrNScgkhMO61mCt4A6CCUQDoIJRAOgglEA6CCUQDoIJRAOgglEA52rACV0WVkVgFRDkOi3GwjwGcS9POwTQz2fNHohejM+/HEi044RBgqipmeTkn3m/jtrXSO9RRs2cobS2oO6Lw9ViB/BZaCKl4TpYJeUUE/Y2r0DuJlc0Ck8Ux7YYePjrhl4+OuGXj464ZePjrhl4+OuGXj464YsihiypMBq28rBfFMLdt1imSSCDwoIUpL18cMIMck3IQegSvwHvptUcX3y6+0IuYa5ro6+oxGOFw40kdp0tLVquIIilA6oDa3x7+UB0EEogHQQSiAdBBKIB0EEogHQQSiAI9fyEAitTgaKPzNSSH4ALu/L6fSVL9xf+f3pCb9xB8aPyAWGCoAxwwkYW9m4XBZROh3CPFbc4YZFoAmg0sy09MF18TCKraAjdfK4QD7Q55SNFpBNNX/2bjgnCzCQPGiFAKOSzR3HvQpRYAgTXKGwvoeYmW62REIpeFfJskuJliCPzc6cwzyhNNL80JnSHWXrR6+464ZePjrhl4+Op8PL1gByh85fFugNCD/vpx4MIIEIAhhhAo1EFNDbSFSWiXwUdekSXzM1qu3/sHjLBjS2CGMgnkybYWBw2y/hiWk2uYCWJLMFmj/yz5GlPKfRaBO9aWl5cd5e7XiK5X4r/GhcL4mnfdshGW0MlM5ZbVx1WWKd0ifxIvCp9OLAXOxzCSlcwJsdf4Zce6SwRSM5RAuYMXQErXE2nIm4R0UTLFp8EBkqRH5NDuuJEjdjrcPyF6Z8iLDLvoREAlBDL1aVAfugA39ZUQA4r8PnHzhnwo+4Bl4+OuGamL0/OlcjtVFEPmjrdlFQBvm8vNj71ZloT0Hlp1/GLxOW5OC5XsChhS09P4njKsBLFlwwkD/EZuHPA6ouT+capz79edIP ss=\"flip\"><span class=\"in\"><span class=\"f\"><span>太陽越高，影子會怎樣？</span></span><span class=\"b\"><span><b>越短</b><br>中午太陽最高，影子最短</span></span></span></button><button class=\"flip\"><span class=\"in\"><span class=\"f\"><span>夏至、冬至、春秋分，太陽從哪裡升起？</span></span><span class=\"b\"><span>夏至<b>東偏北</b>、冬至<b>東偏南</b>、<br>春秋分<b>正東</b></span></span></span></button></div></div>"}, {"name": "為什麼有四季", "tag": "動畫＋選擇題", "list": [{"q": "中午時，太陽高度角最大的季節是哪一個？", "o": ["春季", "夏季", "秋季", "冬季"], "a": 1, "e": "夏季中午太陽最高，高度角最大，影子也最短。", "p": "夏高冬低，不要記反"}, {"q": "從早上到中午，太陽高度角通常怎麼變化？", "o": ["越來越小", "先變大再變小", "越來越大", "完全不會改變"], "a": 2, "e": "從日出到中午，太陽越升越高，高度角就越來越大。", "p": "中午最大，之後才慢慢變小"}, {"q": "嘉義在夏至中午時，太陽高度角大約是多少？", "o": ["90 度，剛好在頭頂上", "66 度", "約 43 度", "0 度，貼在地平線上"], "a": 0, "e": "嘉義位在北回歸線上，夏至中午太陽直射，高度角是 90 度。", "p": "冬至中午只有 43 度"}, {"q": "太陽在東南方的時候，影子會落在哪一個方位？", "o": ["東南方", "西北方", "西南方", "正北方"], "a": 1, "e": "影子和太陽的方位相反，太陽在東南，影子就落在西北。", "p": "影子和太陽唱反調"}, {"q": "小明上午站在操場，看到自己的影子落在西方，太陽大約在哪一方？", "o": ["北方", "南方", "西方", "東方"], "a": 3, "e": "影子在西方，太陽就在相反的東方，所以當時是上午。", "p": "影子在哪邊，太陽就在反方向"}, {"q": "一年之中，太陽從最偏北的方位升起是哪一天？", "o": ["春分", "秋分", "夏至", "冬至"], "a": 2, "e": "夏至日出東偏北、日落西偏北，是全年最偏北的時候。", "p": "夏北冬南，想想太陽偏哪邊"}, {"q": "冬至那天的太陽，從哪一個方位升起？", "o": ["東偏南", "東偏北", "正東", "正南方"], "a": 0, "e": "冬至日出東偏南、日落西偏南，是全年最偏南的時候。", "p": "夏北冬南，方位不要顛倒"}, {"q": "一年中，白晝時間最長的是哪一天？", "o": ["春分", "秋分", "冬至", "夏至"], "a": 3, "e": "夏至的白天最長、夜晚最短，以嘉義為例大約 13.5 小時。", "p": "冬至剛好相反，白天最短"}, {"q": "冬季時，白天和夜晚的長短有什麼特色？", "o": ["晝夜一樣長", "晝短夜長", "晝長夜短", "白天比夜晚長很多"], "a": 1, "e": "冬天日出較晚、日落較早，所以白天短、夜晚長。", "p": "夏天剛好反過來"}, {"q": "地球上有四季，主要是因為下列哪一個原因？", "o": ["地球每天自轉一圈", "月球繞著地球運行", "地軸傾斜，陽光直射的緯度不同", "地球離太陽有時近有時遠"], "a": 2, "e": "地球公轉時地軸傾斜，陽光直射的緯度改變，才有四季。", "p": "距離遠近不是四季的主因"}, {"q": "冬至時，地球離太陽是比較近還是比較遠？", "o": ["比較近，位在近日點", "比較遠，位在遠日點", "和夏至一樣近", "每天都不一樣"], "a": 0, "e": "冬至時地球位在近日點，可見四季不是距離遠近造成的。", "p": "冬天反而離太陽比較近"}, {"q": "二十四節氣是怎麼訂出來的？", "o": ["依月亮的圓缺排出來", "依每天日出的時間排出來", "依星星的亮度排出來", "依地球在公轉軌道上的位置排出來"], "a": 3, "e": "古人依地球在公轉軌道上的位置，把一年分成 24 份。", "p": "節氣看太陽，不看月亮"}, {"q": "關於二十四節氣，下列哪一個說法<b>錯誤</b>？", "o": ["古人依地球在公轉軌道上的位置訂出節氣", "節氣常被用在農業和傳統習俗上", "節氣是依月亮的圓缺訂出來的", "節氣把一年分成 24 份"], "a": 2, "e": "節氣是依地球在公轉軌道上的位置訂的，和月亮圓缺無關。", "p": "節氣跟著地球公轉，不看月亮"}], "motto": "新題：影子和太陽唱反調；四季靠公轉，晝夜靠自轉。", "emo": "🌏", "cheer": ["新題也過關！", "影子、高度角、四季成因都難不倒你。"], "pre": "<details class=\"learn\" open><summary>📘 先看懂：為什麼有四季</summary><ul><li>地球的<b>地軸是斜的</b>（約 23.5 度），而且一直斜向同一邊；地球就這樣斜斜地繞太陽<b>公轉，一圈是一年</b>。</li><li>所以太陽<b>直射</b>的地方，一年中在北回歸線和南回歸線之間來回移動。</li><li><b>夏至</b>直射北回歸線：嘉義太陽最高、白天最長 → 夏天；<b>冬至</b>直射南回歸線：太陽最低、白天最短 → 冬天；<b>春分、秋分</b>直射赤道，白天黑夜差不多一樣長。</li><li>太陽越高，陽光越集中、越熱；所以四季<b>不是</b>因為地球離太陽忽遠忽近。</li></ul><div class=\"figs\"><figure><img src=\"data:image/webp;base64,UklGRhqlAABXRUJQVlA4IA6lAACwdAKdASqwBAwDPm02l0kkIqIhInV5KIANiWdu/HizsjdMcmCzW/6n5O+PzIfqb+B/kP3b9uXkXwy+kaVn9fva+B/5nl39F/Nv80/9J/7P8f7jP6h/pfYC/WL9kP8z8I/+L+0Put/vH/H/Lz4Bf0v/Q/uH7x3+6/a73U/4f/fflV8gH9s/23ro/+X2Hv8r/0f//7gH7af//13f3Z+EL+1/8z91P/J8iH7df/7/fe4B/6va1/gH/59QD1b+pP+C/vv4y/FL45+q/5T+4f5j/k/2v05/Fvn38B/cv83/wv7z7U3/L/hPGn6X/Kf7b/SepP8i+5H67+7/5v0z/2f9+/dX/S+hv5f+8/8b/I/lL8gv5H/Nf9b/f/yO+JP4H/XdrbrH+o/6P+M9gX10+p/8T/B/6X9ofRb/w/8f6kfp393/5v+R+AH+ef1n/o/4v3D/1n7M+RT99/2X7S/AD/OP79/2f8V/n/3F+lv+q/9v+k/4X70e2L87/0X/w/1H+o+Qr+df2//w/5T27P//7zv3x9mb9zP/2KZeNs6pMaVRbLzuOtKotl53HWlUWy87jrSqLZedx1pVFsvO460qi2XncdaVRbLzuOtH2PALuTbogUvxG39B2A1s7t5x9PLpCLZ5ydVqnmFhBtxqMdaJAILWs5VSRmeOtKotl53HWlUWy87jrSqLZedx1pVFsvO460qfTdjlAQY80s0xa1rrRegSFykq7rgmU1d8lVvDLrdYvZHovgS1NIwH1NdexY9o60tNcbGyYRNUh8DsXVZjWJ+x96rKy/zQmyFbTed5EKjXWJXXc/2PcpGOtKotl53HWlUWy87jrSqLZedx1pVFsuhATuGcn34O48YE69COMDHqgEXvNRzxwZHKpNJWWfeU6MTlMKmlVFQx5LvTPrZXa+VkI+uhG/A8aSvoOK5SjLR4LLzuOtKotl53HWlUWy87jrSqLZHXvCiiHKlbfNjGf+qe4ejgiWn4YEx58DONd02XU7aux7Mg5PXoMCnt/VHr/EKZkZ0OaQfWaJsAn/bUYuhXSipTQPVjhVkCI9vqseu82uBQ3QKmo9lijMNvgaKQZ0cb5yQUMNp0ho5EabQcS2pmcj+izC3QAvovbAQSUEZdPHmPlt99ciu45gxZsO77Kelqt2pP2+rY7wlc8Tnqg54EpTdEITuDXPVRiezlhPXZbvh5lblw3jwKAU3n7kyVC5SLYXD1vAJcWjHO42LeoegMSTRShyw/f3BNfq+BqFoVFsvO460qi2 et": "<div class=\"sim\" id=\"plsim\">\n  <div class=\"big\">遊戲 1：幫八大行星排隊</div>\n  <div>從<b>離太陽最近</b>的開始，依序點下去。</div>\n  <div class=\"slots\" id=\"slots\"><span style=\"font-size:26px\">☀️</span></div>\n  <div id=\"pool\"></div>\n  <div class=\"gmsg\" id=\"msg1\"></div>\n  <hr style=\"border:0;border-top:2px dashed var(--line);margin:14px 0\">\n  <div class=\"big\">遊戲 2：類地還是類木？</div>\n  <div id=\"sortQ\" class=\"big\" style=\"font-size:20px\"></div>\n  <div><button class=\"btn\" id=\"btnT\">類地行星</button> <button class=\"btn\" id=\"btnJ\">類木行星</button></div>\n  <div class=\"gmsg\" id=\"msg2\"></div>\n</div>", "games": ["siteg0", "siteg1"], "motto": "先幫八大行星排隊，再把它們分成類地、類木兩組。", "emo": "🪐", "cheer": ["行星排隊成功！", "水金地火木土天海，一個都沒排錯。"], "pre": "<details class=\"learn\" open><summary>📘 先看懂：八大行星</summary><ul><li>太陽系以<b>太陽</b>為中心，八大行星由近到遠：<b>水、金、地、火、木、土、天、海</b>。</li><li><b>類地行星</b>（水金地火）：離太陽近、體積小、有固態表面；<b>類木行星</b>（木土天海）：離太陽遠、體積大、沒有固態表面。</li><li>記特色：<b>木星最大、水星最小；金星最熱、天王星最冷；海王星最遠</b>。</li><li>課本的圖是示意圖；看真實比例，木星寬約 11 個地球，海王星離太陽約是地球的 30 倍遠。</li></ul><div class=\"figs\"><figure><img src=\"data:image/webp;base64,UklGRpaYAABXRUJQVlA4IIqYAACQTAKdASqwBHMCPm00l0ikIqIiIzO5sIANiWdu/HA5xcZ+3inJPfy/9P/i/3I8pOOfRH7L/Ift7/k/27+erlfwI9a+Nfyn+7L+33efCf9nyx+ev+v/kfyX+af+89SH6i9gL9Uf+z/kfcp/1fU//fv+96gf67/qv3H92X/d/uP7nP8R/wv2a/6HyBf1D/Xf/P14fYY/yn/P////h+AP+cf5H/3evP+7vwlf3v/sfuR8Ef7t//T2AP/t6gH//62fqH/m/8F/ZPI9+sf4n+6/td/i/S38V+afv39v/bb+++2n85+Of0b+s8zP5V9p/0/9u/yn7Ke2n+m/u/5K+jv5n+8/8//H+wL+T/0T/Y/3n8lPj3+W/6n+n/0ne8ah/o/+1/avYF9aPo/+3/yf7sf5L0Jf83+/+on6D/b//D/cvgB/lv9b/7vrf/rvA++v/7b9wfgB/mX9+/7/+b/1v7qfSx/Rf+D/P/6/9vvbj+c/6f/3f6b4DP6B/dP+//kPbo///vB/c7/5+6j+7H/rHInUCVDqZUMfRfA9TKhj6L4HqZUMfRfA9TKhj6L4HqZUMfRfA9TKhj6L4HqZUMfRfA9TKhDIJeumA5VgzUpDdwxWRF9TuctqsbcW+6nYQJvfg2gpUHKpah/+aR/26LYiFeTp67aLg9xgfcEf8amdJwP3Bdsb6L4HqZUMfRfA9TKhj6L4HqZUMfRfA9TKZ4Ludu3fAQSaelDBreQjIFLB9gN9+FPZKxGl6xB2rBvA8fPmFMvcC+9RkAQgw/QpJfDkHQV91U2iT0fbC6ECajB/8X96yF8v4qdsSrqrr8xuzVoXbG+i+B6mVDH0XwPUyoY+i+B6mVDH0XbNmHjE+F : ["水星、火星、地球、金星", "水星、地球、金星、火星", "水星、金星、地球、火星", "地球、水星、金星、火星"], "a": 2, "e": "前四顆依序是水星、金星、地球、火星，再往外是木土天海。", "p": "水金地火木土天海"}, {"q": "距離太陽最遠的行星是哪一顆？", "o": ["土星", "海王星", "天王星", "木星"], "a": 1, "e": "海王星位在八大行星的最外圍，表面是藍色。", "p": "天王星也很遠，但海王星更外圈"}, {"q": "八大行星中，體積最大的是哪一顆？", "o": ["地球", "土星", "海王星", "木星"], "a": 3, "e": "木星體積最大，表面有不同顏色的條紋。", "p": "體積第二大的是土星"}, {"q": "八大行星中，表面溫度最高的是哪一顆？", "o": ["金星", "水星", "火星", "地球"], "a": 0, "e": "金星最熱，表面溫度可達 480 ℃，雖然它不是離太陽最近的。", "p": "最近不等於最熱"}, {"q": "有一顆行星表面是橘紅色的，它是哪一顆？", "o": ["金星", "木星", "火星", "水星"], "a": 2, "e": "火星表面是橘紅色，是它最好認的特色。", "p": "木星是彩色條紋，不是橘紅"}, {"q": "八大行星中，最冷的是哪一顆？", "o": ["海王星", "天王星", "土星", "木星"], "a": 1, "e": "天王星最冷，表面是藍綠色。", "p": "最遠的是海王星，最冷的是天王星"}, {"q": "月球是哪一顆行星的衛星？", "o": ["金星", "火星", "水星", "地球"], "a": 3, "e": "月球繞著地球運行，所以月球是地球的衛星。", "p": "衛星繞行星，行星繞太陽"}, {"q": "關於月球，下列哪一個說法<b>正確</b>？", "o": ["月球是地球的衛星", "月球是一顆恆星", "月球自己會發出強光", "月球直接繞著太陽運行"], "a": 0, "e": "月球繞地球運行，是地球的衛星，自己不會發光。", "p": "月球繞的是地球，不是太陽"}, {"q": "類地行星包含下面哪一組？", "o": ["木星、土星、天王星、海王星", "水星、金星、木星、火星", "地球、火星、木星、土星", "水星、金星、地球、火星"], "a": 3, "e": "類地行星是水星、金星、地球、火星，離太陽比較近。", "p": "以火星、木星為界分兩組"}, {"q": "類木行星和類地行星比起來，哪一項特色<b>正確</b>？", "o": ["類木行星的體積比較小", "類木行星的密度比較大", "類木行星沒有固態表面", "類木行星的衛星比較少"], "a": 2, "e": "類木行星體積大、密度小、沒有固態表面，衛星也比較多。", "p": "類地小又密，類木大又疏"}], "motto": "新題：最小最近水星、最大木星、最熱金星、最冷天王星、最遠海王星。", "emo": "🚀", "cheer": ["新題也過關！", "八大行星的特色都記住了。"], "pre": "<details class=\"learn\" open><summary>📘 先看懂：恆星、行星、衛星</summary><ul><li><b>恆星</b>：自己會發光、發熱，例如<b>太陽</b>。</li><li><b>行星</b>：繞著恆星轉，例如地球；<b>衛星</b>：繞著行星轉，例如<b>月球是地球的衛星</b>。</li><li>行星和衛星自己不會發光，看起來亮，是因為<b>反射太陽光</b>。</li></ul><div class=\"figs\"><figure><img src=\"data:image/webp;base64,UklGRoZsAABXRUJQVlA4IHpsAACQ6gGdASqwBIACPm02mEikIyKhIrJpmIANiWdu+/v+NE2qcuMfqb7wcVzKvkY+aB+JbzX/4f9n8OuXfY/5z/H+n9yX3W+1vvfsK/0/DT53/h+XfzF/5P8J+WfzB/2P/k/xf+Z+Df9Q/zP/p9wH9Vf1y9zv/Z9WH97/7H5FfAL+o/4n9u/ed/3/7he57+9f6z9pP9N8gX9r/1Prm/9f//+5B/hv95///cC/n/+c//XtI/9X9zPhP/uv/T/c//0e9d///937gH/z9QD/4dcP1i/xfbJ/mf8P+Mnpn+J/Lv4v+4fuN/ function declOf(N){ return 23.44*Math.sin(phaseOf(N)*Math.PI/2); }

function buildSun(){
  var LAT=23.5*Math.PI/180, T=0.5, K=Math.sqrt(1-T*T), NS="http://www.w3.org/2000/svg";
  var D8=["北","東北","東","東南","南","西南","西","西北"], NAMED={80:"春分",172:"夏至",266:"秋分",356:"冬至"};
  var dayR=$("dayR"), hourR=$("hourR"), dome=$("dome"), map=$("map");
  function decl(N){ return declOf(N); }
  function sunAt(dec,hour){ var d=dec*Math.PI/180, H=(hour-12)*15*Math.PI/180;
    var sh=Math.sin(LAT)*Math.sin(d)+Math.cos(LAT)*Math.cos(d)*Math.cos(H);
    var e=-Math.cos(d)*Math.sin(H), n=Math.cos(LAT)*Math.sin(d)-Math.sin(LAT)*Math.cos(d)*Math.cos(H);
    var az=(Math.atan2(e,n)*180/Math.PI+360)%360; return {h:Math.asin(sh)*180/Math.PI, az:az}; }
  function P(h,az){ var a=h*Math.PI/180,z=az*Math.PI/180, e=Math.cos(a)*Math.sin(z), n=Math.cos(a)*Math.cos(z), u=Math.sin(a);
    return [-n, -(u*K-e*T)]; }
  function mk(tag,attr,par){ var el=document.createElementNS(NS,tag); for(var k in attr) el.setAttribute(k,attr[k]); (par||dome).appendChild(el); return el; }
  function hm(x){ var h=Math.floor(x+1e-9), m=Math.round((x-h)*60); if(m===60){h++;m=0} return h+":"+(m<10?"0":"")+m; }
  function dir8(az){ return D8[Math.round(az/45)%8]; }
  function draw(){
    var N=+dayR.value, hour=+hourR.value, dec=decl(N), s=sunAt(dec,hour);
    document.querySelectorAll("#sunsim .chip").forEach(function(b){ b.classList.toggle("on", Math.abs(N-b.dataset.day)<=2) });
    $("dayL").textContent=dateText(N)+(NAMED[N]?"（"+NAMED[N]+"）":""); $("hourL").textContent=hm(hour);
    var cosH0=-Math.tan(LAT)*Math.tan(dec*Math.PI/180), H0=Math.acos(Math.max(-1,Math.min(1,cosH0)))*180/Math.PI/15;
    var riseAz=Math.acos(Math.sin(dec*Math.PI/180)/Math.cos(LAT))*180/Math.PI;
    dome.innerHTML="";
    mk("ellipse",{cx:0,cy:0,rx:1,ry:T,fill:"rgba(92,192,138,.22)",stroke:"#2f8a57","stroke-width":.012});
    mk("path",{d:"M -1 0 A 1 1 0 0 1 1 0",fill:"none",stroke:"#94a3b8","stroke-width":.01,"stroke-dasharray":".04 .03"});
    [["北",-1.2,0.04],["南",1.2,0.04],["東",0,T+0.14],["西",0.22,-T-0.06]].forEach(function(t){
      var x=mk("text",{x:t[1],y:t[2],"font-size":0.13,"text-anchor":"middle",fill:"currentColor","font-weight":700}); x.textContent=t[0]; });
    [23.44,0,-23.44].forEach(function(dd){ var cH=-Math.tan(LAT)*Math.tan(dd*Math.PI/180), h0=Math.acos(cH)*180/Math.PI/15, rp=[];
      for(var i=0;i<=60;i++){ var q=sunAt(dd,12-h0+2*h0*i/60), p=P(Math.max(q.h,0),q.az); rp.push(p[0].toFixed(3)+","+p[1].toFixed(3)); }
      mk("polyline",{points:rp.join(" "),fill:"none",stroke:"#94a3b8","stroke-width":.008,"stroke-dasharray":".03 .025",opacity:.8}); });
    var pts=[]; for(var i=0;i<=120;i++){ var hh=12-H0+2*H0*i/120, q=sunAt(dec,hh), p=P(Math.max(q.h,0),q.az); pts.push(p[0].toFixed(3)+","+p[1].toFixed(3)); }
    mk("polyline",{points:pts.join(" "),fill:"none",stroke:"#e8b730","stroke-width":.025});
    mk("circle",{cx:0,cy:0,r:.035,fill:"#ea580c"});
    if(s.h>0){ var p=P(s.h,s.az); mk("circle",{cx:p[0],cy:p[1],r:.075,fill:"#fbbf24",stroke:"#f59e0b","stroke-width":.015}); }
    map.innerHTML="";
    mk("circle",{cx:0,cy:0,r:1.05,fill:"rgba(126,174,232,.12)",stroke:"#94a3b8","stroke-width":.015},map);
    D8.forEach(function(nm,k){ var a=k*45*Math.PI/180, r=k%2?1.2:1.28;
      var t=mk("text",{x:(r*Math.sin(a)).toFixed(3),y:(-r*Math.cos(a)+0.06).toFixed(3),"font-size":k%2?0.15:0.19,"text-anchor":"middle",fill:"currentColor","font-weight":k%2?400:700},map); t.textContent=nm; });
    var read=$("sunRead");
    if(s.h>0){
      var L=1/Math.tan(s.h*Math.PI/180), sl=Math.min(L,3.2)*0.32, sa=(s.az+180)*Math.PI/180, za=s.az*Math.PI/180;
      if(s.h<89.5) mk("line",{x1:0,y1:0,x2:(sl*Math.sin(sa)).toFixed(3),y2:(-sl*Math.cos(sa)).toFixed(3),stroke:"#475569","stroke-width":.09,"stroke-linecap":"round",opacity:.75},map);
      mk("circle",{cx:(0.85*Math.sin(za)).toFixed(3),cy:(-0.85*Math.cos(za)).toFixed(3),r:.12,fill:"#fbbf24",stroke:"#f59e0b","stroke-width":.02},map);
      mk("circle",{cx:0,cy:0,r:.06,fill:"#ea580c"},map);
      read.innerHTML='<div>高度角：<b>'+Math.round(s.h)+' 度</b></div><div>太陽方位：<b>'+(s.h>89.5?"頭頂上":dir8(s.az))+'</b></div>'+
        '<div>影子方位：<b>'+(s.h>89.5?"幾乎沒有影子":dir8((s.az+180)%360))+'</b></div><div>影子長：<b>'+(s.h>89.5?"0":L.toFixed(1))+' 倍竿高</b></div>';
    }else{
      mk("circle",{cx:0,cy:0,r:.06,fill:"#ea580c"},map);
      read.innerHTML='<div><b>'+(hour<12?"太陽還沒升起":"太陽已經下山")+'</b></div><div>沒有影子</div>';
    }
    var riseTxt=Math.abs(riseAz-90)<1.5?"正東":(riseAz<90?"東偏北":"東偏南"), setTxt=Math.abs(riseAz-90)<1.5?"正西":(riseAz<90?"西偏北":"西偏南");
    read.innerHTML+='<div>日出方位：<b>'+riseTxt+'</b></div><div>日落方位：<b>'+setTxt+'</b></div>'+
      '<div>日出約 <b>'+hm(12-H0)+'</b>、日落約 <b>'+hm(12+H0)+'</b></div><div>白天約 <b>'+(2*H0).toFixed(1)+' 小時</b></div>';
  }
  dayR.oninput=draw; hourR.oninput=draw;
  document.querySelectorAll("#sunsim .chip").forEach(function(b){ b.onclick=function(){ dayR.value=b.dataset.day; draw(); } });
  draw();
}

    for(var i=0;i<12;i++){ var a=i*Math.PI/6; mk("line",{x1:f(.25*Math.cos(a)),y1:f(.25*Math.sin(a)),x2:f(.34*Math.cos(a)),y2:f(.34*Math.sin(a)),stroke:"#f59e0b","stroke-width":.025,"stroke-linecap":"round"},top); }
    mk("circle",{cx:0,cy:0,r:.2,fill:"#fbbf24",stroke:"#f59e0b","stroke-width":.02},top); tx(top,0,0.045,"太陽",0.11,"#92400e");
    var ex=AX*Math.cos(lam), ey=-AY*Math.sin(lam), r=.13, th=Math.atan2(-ey,-ex);
    mk("circle",{cx:f(ex),cy:f(ey),r:r,fill:"#1e3a8a"},top);
    var a1=th-Math.PI/2, a2=th+Math.PI/2;
    mk("path",{d:"M "+f(ex+r*Math.cos(a1))+" "+f(ey+r*Math.sin(a1))+" A "+r+" "+r+" 0 0 1 "+f(ex+r*Math.cos(a2))+" "+f(ey+r*Math.sin(a2))+" Z",fill:"#60a5fa"},top);
    var ux=Math.sin(TILT)*.24, uy=-Math.cos(TILT)*.24;
    mk("line",{x1:f(ex-ux),y1:f(ey-uy),x2:f(ex+ux),y2:f(ey+uy),stroke:"#0f172a","stroke-width":.02},top);

    tx(top,-1.7,0.95,"↺ 公轉一圈＝一年",0.1,"#64748b","start");
    // ---- 側面圖
    side.innerHTML="";
    var cx=0.2, cy=0, Re=0.78;
    [-0.6,-0.3,0,0.3,0.6].forEach(function(y){ var xe=cx-Math.sqrt(Re*Re-y*y);
      mk("line",{x1:-1.35,y1:y,x2:f(xe-0.03),y2:y,stroke:"#f59e0b","stroke-width":.018},side);
      mk("path",{d:"M "+f(xe-0.03)+" "+y+" l -0.07 -0.035 l 0 0.07 Z",fill:"#f59e0b"},side); });
    tx(side,-1.33,-0.72,"陽光",0.11,"#b45309","start");
    mk("circle",{cx:cx,cy:cy,r:Re,fill:"#bfdbfe",stroke:"#1e3a8a","stroke-width":.015},side);
    mk("path",{d:"M "+cx+" "+(cy-Re)+" A "+Re+" "+Re+" 0 0 1 "+cx+" "+(cy+Re)+" Z",fill:"rgba(15,23,42,.45)"},side);
    var nx=-Math.sin(dr), ny=-Math.cos(dr), vx=Math.cos(dr), vy=-Math.sin(dr);
    [[23.44,"#dc2626",".05 .03"],[0,"#047857",""],[-23.44,"#2563eb",".05 .03"]].forEach(function(L){
      var lr=L[0]*Math.PI/180, mx=cx+nx*Re*Math.sin(lr), my=cy+ny*Re*Math.sin(lr), h=Re*Math.cos(lr);
      mk("line",{x1:f(mx-vx*h),y1:f(my-vy*h),x2:f(mx+vx*h),y2:f(my+vy*h),stroke:L[1],"stroke-width":.02,"stroke-dasharray":L[2]},side); });
    mk("line",{x1:f(cx-nx*Re*1.25),y1:f(cy-ny*Re*1.25),x2:f(cx+nx*Re*1.25),y2:f(cy+ny*Re*1.25),stroke:"#0f172a","stroke-width":.022},side);
    tx(side,f(cx+nx*Re*1.38),f(cy+ny*Re*1.38+0.04),"北",0.11,"#0f172a");

    mk("circle",{cx:f(cx-Re),cy:cy,r:.05,fill:"#dc2626",stroke:"#fff","stroke-width":.012},side);

    // ---- 讀數
    var noon=90-Math.abs(LATC-d), H0=Math.acos(-Math.tan(LATC*Math.PI/180)*Math.tan(dr))*180/Math.PI/15*2;
    var where=Math.abs(d)<0.3?"赤道":(Math.abs(d)>23.3?(d>0?"北回歸線":"南回歸線")+"（"+(d>0?"北":"南")+"緯 23.5 度）":(d>0?"北":"南")+"緯 "+Math.abs(d).toFixed(1)+" 度");
    $("orbRead").innerHTML='<div>太陽直射：<b>'+where+'</b></div><div>嘉義中午高度角：<b>約 '+Math.round(noon)+' 度</b></div>'+
      '<div>嘉義白天：<b>約 '+H0.toFixed(1)+' 小時</b></div><div>北極那端：<b>'+(d>0.3?"斜向太陽":(d<-0.3?"背向太陽":"不偏向也不背向"))+'</b></div>';
  }
  function stop(){ if(timer){ clearInterval(timer); timer=null; $("orbPlay").textContent="▶ 播放一年"; } }

  $("orbPlay").onclick=function(){ if(timer){ stop(); return; } this.textContent="⏸ 暫停";
    timer=setInterval(function(){ R.value=(+R.value)%365+1; draw(); },45); };
  draw();
}


function buildPlanets(gid0, gid1){
  var PL=[["水星","#9ca3af","體積最小、離太陽最近"],["金星","#f59e0b","最熱，可達 480 ℃"],["地球","#3b82f6","目前所知唯一有生命"],["火星","#dc2626","表面橘紅色"],
          ["木星","#d6a36b","體積最大、有彩色條紋"],["土星","#eab308","體積第二大、有最大最亮的環"],["天王星","#22d3ee","最冷、藍綠色"],["海王星","#2563eb","離太陽最遠、藍色"]];
  var SZ=[12,16,16,13,30,27,21,21];
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t } return a }
  var slots=$("slots"), pool=$("pool"), next=0, miss1=0;
  PL.forEach(function(){ slots.insertAdjacentHTML("beforeend",'<span class="slot">?</span>') });
  function fillAll(){ slots.querySelectorAll(".slot").forEach(function(s,i){ s.textContent=PL[i][0]; s.classList.add("fill") });
    $("msg1").textContent="🎉 排好了：水金地火木土天海！"; }
  if(prog.ans[gid0]!==undefined){ fillAll(); }
  else shuffle(PL.map(function(_,i){return i})).forEach(function(i){
    var b=el('<button class="pl"><i style="width:'+SZ[i]+'px;height:'+SZ[i]+'px;background:'+PL[i][1]+'"></i>'+PL[i][0]+'</button>');
    b.onclick=function(){
      if(i===next){ b.classList.add("used"); var s=slots.querySelectorAll(".slot")[next]; s.textContent=PL[i][0]; s.classList.add("fill");
        $("msg1").textContent="✅ 第 "+(next+1)+" 顆："+PL[i][0]+"（"+PL[i][2]+"）"; sfx("ok"); next++;
        if(next===8){ fillAll(); markGame(gid0, miss1===0); } }
      else{ miss1++; b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); sfx("no");
        $("msg1").textContent="❌ 不是它喔。第 "+(next+1)+" 顆要比"+(next?PL[next-1][0]:"太陽")+"再遠一點。"; }
    };
    pool.appendChild(b);
  });
  var order=shuffle([0,1,2,3,4,5,6,7]), k=0, miss2=0;
  function ask(){ if(k>=8){ $("sortQ").textContent="🎉 全部分好了！"; $("msg2").innerHTML="類地：水金地火（近、小、密度大、有固態表面）；類木：木土天海（遠、大、密度小、沒有固態表面）。";
      $("btnT").disabled=$("btnJ").disabled=true; return true }
    $("sortQ").textContent="第 "+(k+1)+" / 8 顆："+PL[order[k]][0]+" 是哪一類？"; return false }
  function pick(j){ var i=order[k], ok=(i>=4)===j;
    if(ok){ sfx("ok"); $("msg2").textContent="✅ "+PL[i][0]+"是"+(j?"類木":"類地")+"行星："+PL[i][2]; k++; if(ask()) markGame(gid1, miss2===0); }
    else{ miss2++; sfx("no"); $("msg2").textContent="❌ 再想想：水金地火是類地，木土天海是類木。"; } }
  $("btnT").onclick=function(){pick(false)}; $("btnJ").onclick=function(){pick(true)};
  if(prog.ans[gid1]!==undefined){ k=8; ask(); } else ask();
}

var N=STAGES.length, IDS={};
STAGES.forEach(function(S,si){
  var st=si+1;
  if(S.kind==="retry"){
    $("nav").insertAdjacentHTML("beforeend",'<button data-go="'+st+'">🔁 '+S.name+'</button>');
    $("stages").appendChild(el('<section class="stage" data-stage="'+st+'"><span class="badge">加油站</span><h2>'+S.name+'</h2>'+
      '<div class="card"><div class="motto">'+S.motto+'</div></div><div id="mc'+st+'"></div></section>'));
    return;
  }
  $("nav").insertAdjacentHTML("beforeend",'<button data-go="'+st+'">第'+st+'關 '+S.name+'<span class="st">★</span></button>');
  var sec=el('<section class="stage" data-stage="'+st+'"><span class="badge">第 '+st+' 關</span>'+(S.tag?' <span class="badge ext">'+S.tag+'</span>':'')+
    '<h2>'+S.name+'</h2><div class="pbar" id="pb'+st+'"><i></i><span></span></div><div class="card"><div class="motto">'+S.motto+'</div></div>'+
    (S.pre||"")+(S.widget||"")+'<div id="mc'+st+'"></div><div class="score" id="sc'+st+'"></div>'+(S.post||"")+
    '<div class="clear" data-clear="'+st+'">'+S.emo+' 第 '+st+' 關過關！</div></section>');
  $("stages").appendChild(sec);
  IDS[st]=S.games ? S.games.slice() : S.list.map(function(_,i){return "s"+st+"q"+i});
});
function buildRetry(st){
  var box=$("mc"+st), L=[]; box.innerHTML="";
  STAGES.forEach(function(S,si){ if(S.list && S.kind!=="retry") S.list.forEach(function(it,i){ var id="s"+(si+1)+"q"+i;
    if(prog.first[id]===false && !prog.fixed[id]) L.push({id:id,it:it,from:si+1}); }); });
  if(!L.length){ box.innerHTML='<div class="card"><b>目前沒有要再挑戰的題目 🎉</b><br>各關「第一次答錯」的選擇題會自動放到這裡；再一次就答對，就會移出這裡。</div>'; return; }
  box.insertAdjacentHTML("beforeend",'<p>共 <b>'+L.length+'</b> 題。答錯可以再選；這次一次就答對，下次就不會再出現。</p>');
  L.forEach(function(r,n){
    var it=r.it, ord=it.ox?[0,1]:shuffle(it.o.map(function(_,k){return k})), miss=false;
    var c=el('<div class="card q"><div class="zh">來自第 '+r.from+' 關</div><div class="stem"><span class="num">'+(n+1)+'.</span>'+it.q+'</div><div class="opts"></div><div class="fb"></div></div>');
    var opts=c.querySelector(".opts"), fb=c.querySelector(".fb");
    ord.forEach(function(k,j){ var b=el('<button class="opt">'+(it.ox?it.o[k]:LET[j]+' '+it.o[k])+'</button>');
      b.onclick=function(){
        if(k===it.a){ opts.querySelectorAll(".opt").forEach(function(x){ x.disabled=true }); b.classList.add("right");
          fb.className="fb show ok"; fb.innerHTML=(miss?"✅ 答對了！":"🌟 一次就答對，這題學會了！")+it.e+(it.p?'<span class="para">📌 陷阱：'+it.p+'</span>':"");
          sfx("ok"); if(!miss){ prog.fixed[r.id]=true; save(); } }
        else{ miss=true; b.classList.add("wrong"); b.disabled=true; sfx("no"); fb.className="fb show no";
          fb.innerHTML="❌ 再想想，可以回第 "+r.from+" 關看「先看懂」和「記起來」。"; } };
      opts.appendChild(b); });
    box.appendChild(c);
  });
}
document.addEventListener("click",function(e){
  var fl=e.target.closest(".flip"); if(fl) fl.classList.toggle("on");
  var im=e.target.closest(".learn img"); if(im){ var o=el('<div class="lb"><img alt=""><div class="lbcap">點一下關閉</div></div>');
    o.querySelector("img").src=im.src; o.onclick=function(){ o.remove() }; document.body.appendChild(o); }
});
function renderMC(st, list){
  var box=$("mc"+st);
  list.forEach(function(it,i){
    var id="s"+st+"q"+i;
    var c=el('<div class="card q">'+
      '<div class="stem"><span class="num">'+(i+1)+'.</span>'+it.q+'</div>'+
      '<div class="opts"></div><div class="fb"></div></div>');
    var opts=c.querySelector(".opts"), fb=c.querySelector(".fb");
    it.o.forEach(function(t,k){ var b=el('<button class="opt">'+(it.ox?t:LET[k]+' '+t)+'</button>'); b.onclick=function(){ choose(k,true) }; opts.appendChild(b); });
    function choose(k,user){
      var bs=opts.querySelectorAll(".opt");
      if(k===it.a){
        bs.forEach(function(x,j){ x.disabled=true; if(j===it.a) x.classList.add("right") });
        fb.className="fb show ok"; fb.innerHTML="✅ "+(user?praise()+" ":"答對了！")+it.e+(it.p?'<span class="para">📌 陷阱：'+it.p+'</span>':"");
        if(user){ sfx("ok"); if(!(id in prog.first)) prog.first[id]=true; prog.ans[id]=k; save(); check(st,true) }
      }else{
        bs[k].classList.add("wrong"); bs[k].disabled=true; fb.className="fb show no"; fb.innerHTML="❌ 再想想，"+(STAGES[st-1].widget?"用上面的動畫或模擬器試試看。":(STAGES[st-1].pre?"看看上面的「先看懂」再選。":"回想筆記的重點。"));
        if(user){ sfx("no"); if(!(id in prog.first)) prog.first[id]=false; save() }
      }
    }
    box.appendChild(c);
    if(prog.ans[id]!==undefined) choose(prog.ans[id],false);
  });
}
function markGame(id, firstOK){ var st=+Object.keys(IDS).filter(function(s){return IDS[s].indexOf(id)>=0})[0];
  if(!(id in prog.first)) prog.first[id]=firstOK; prog.ans[id]=1; save(); check(st,true); }
function check(st,user){
  var ids=IDS[st], fin=ids.filter(function(id){ return prog.ans[id]!==undefined }).length, tot=ids.length, ok=fin===tot, was=!!prog.done[st],
      first=ids.filter(function(id){ return prog.first[id]===true }).length;
  $("sc"+st).textContent=(STAGES[st-1].games?"一次就完成的遊戲：":"第一次就答對：")+first+" / "+tot;
  var pb=$("pb"+st); pb.querySelector("i").style.width=Math.round(fin/tot*100)+"%"; pb.querySelector("span").textContent="本關進度 "+fin+" / "+tot+(ok?"　⭐ 完成":"");
  var c=document.querySelector('[data-clear="'+st+'"]'); if(ok){ c.classList.add("show"); prog.done[st]=true; save() }
  var nb=document.querySelector('nav [data-go="'+st+'"]'); if(nb) nb.classList.toggle("done", !!prog.done[st]);
  if(user && ok && !was) celebrate(st, first, tot);
}
var PRAISE=["太棒了！","好厲害！","漂亮！","答對了！","很會喔！","讚！"];
var FIN=["神祕天空探險家！", "太陽、四季和八大行星都難不倒你。"], T0=Date.now();
function praise(){ return PRAISE[Math.floor(Math.random()*PRAISE.length)] }
function celebrate(st, first, tot){
  var stars=first===tot?3:(first>=tot*0.6?2:1), mins=Math.max(1,Math.round((Date.now()-T0)/60000)),
      all=STAGES.every(function(R,i){return R.kind==="retry" || prog.done[i+1]}), S=STAGES[st-1], starHtml="";
  for(var i=0;i<3;i++) starHtml+= i<stars ? '<span style="animation-delay:'+(0.25+i*0.25)+'s">★</span>' : '<span class="dim">★</span>';
  var nextSt=st<N?st+1:0;
  var m=el('<div class="celebrate"><div class="cbox"><div class="cemo">'+(all?"🏆":S.emo)+'</div>'+
    '<div class="ctitle">'+(all?"全部過關！":"第 "+st+" 關「"+S.name+"」過關！")+'</div><div class="cstars">'+starHtml+'</div>'+
    '<div class="cen">'+(all?FIN[0]:S.cheer[0])+'</div><div class="czh">'+(all?FIN[1]:S.cheer[1])+'</div>'+
    '<div class="cstat">'+(S.games?"一次就完成 ":"第一次就答對 ")+'<b>'+first+' / '+tot+'</b>　·　這次練了 <b>'+mins+'</b> 分鐘</div>'+
    (mins>=15?'<div class="crest">☕ 已經練超過 15 分鐘了，起來喝口水、看看遠方，再回來繼續。</div>':'')+
    '<div>'+(nextSt?'<button class="btn" data-next>下一關 →</button>':'')+'<button class="btn ghost" data-close>'+(nextSt?'先休息一下':'關閉')+'</button></div></div></div>');
  document.body.appendChild(m); confetti(); sfx("win");
  var nx=m.querySelector("[data-next]"); if(nx) nx.onclick=function(){ m.remove(); go(nextSt); window.scrollTo({top:0,behavior:"smooth"}) };
  m.querySelector("[data-close]").onclick=function(){ m.remove() }; m.onclick=function(e){ if(e.target===m) m.remove() };
}
function confetti(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var cv=document.createElement("canvas"), x=cv.getContext("2d"), W=cv.width=innerWidth, H=cv.height=innerHeight, P=[], col=["#e8b730","#2f6fbf","#c8463d","#2f8a57","#7a54b8","#f08cb4"];
  cv.className="confetti"; document.body.appendChild(cv);
  for(var i=0;i<140;i++) P.push({x:W/2+(Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*14, vy:-Math.random()*13-4, r:Math.random()*6+4, c:col[i%col.length], a:Math.random()*6, s:(Math.random()-.5)*.3});
  var t0=performance.now();
  (function f(t){ var k=Math.max(0,(t-t0)/1000); x.clearRect(0,0,W,H);
    P.forEach(function(p){ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.s; x.save(); x.globalAlpha=Math.max(0,1-k/2.6); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore() });
    if(k<2.6) requestAnimationFrame(f); else cv.remove() })(t0);
}


function go(n){
  document.querySelectorAll("section.stage").forEach(function(s){ s.classList.toggle("on", s.dataset.stage==n) });
  document.querySelectorAll("nav button").forEach(function(b){ b.classList.toggle("on", b.dataset.go==n) });
  if(STAGES[n-1] && STAGES[n-1].kind==="retry") buildRetry(n);
  prog.cur=n; save();
}
document.addEventListener("click",function(e){ var g=e.target.closest("[data-go]"); if(g){ go(g.dataset.go); window.scrollTo({top:0,behavior:"smooth"}) } });
$("themeBtn").onclick=function(){
  var r=document.documentElement, dark=r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; prog.theme=r.dataset.theme; save();
};
if(prog.theme) document.documentElement.dataset.theme=prog.theme;
$("sndBtn").onclick=function(){ prog.mute=!prog.mute; save(); sndIcon(); if(!prog.mute) sfx("ok") };
sndIcon();
$("resetBtn").onclick=function(){ if(confirm("確定要清除所有作答進度嗎？")){ try{localStorage.removeItem(KEY)}catch(e){} location.reload() } };
STAGES.forEach(function(S,si){
  var st=si+1;
  if(S.kind==="retry") return;
  if(S.kind==="sun") buildSun();
  if(S.orbit) buildOrbit();
  if(S.kind==="planets") buildPlanets(S.games[0], S.games[1]);
  if(S.list) renderMC(st, S.list);
  check(st,false);
});
go(prog.cur||1);
})();
