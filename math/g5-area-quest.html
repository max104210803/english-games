<script>
const DATA = [{"title": "第一關　剪一剪、拼一拼，公式從哪裡來？", "no": "", "diff": "", "src": "", "note": "", "photo": null, "extra": "<h3>本關重點<\/h3>\n<p><div class=\"callout tip\"><div class=\"ct\"><p>三個公式都是從「拼成平行四邊形」來的<\/p><\/div><ul>\n<li>平行四邊形：剪拼成長方形，<strong>長＝底、寬＝高<\/strong> → 底 × 高<\/li>\n<li>三角形：兩個拼成平行四邊形 → 底 × 高 <strong>÷ 2<\/strong><\/li>\n<li>梯形：兩個拼成平行四邊形，底變成「上底＋下底」 → (上底＋下底) × 高 <strong>÷ 2<\/strong><\/li>\n<\/ul><\/div><\/p>", "items": [{"label": "選擇1", "kind": "選擇", "stem": "<p>把一個底 9 公分、高 6 公分的平行四邊形，沿著高剪下一個三角形，移到另一邊，拼成一個長方形。這個長方形的長和寬各是多少公分？<\/p>", "opts": {"A": "<p>長 6、寬 9<\/p>", "B": "<p>長 9、寬 6<\/p>", "C": "<p>長 9、寬 9<\/p>", "D": "<p>長 15、寬 6<\/p>"}, "key": "B", "ans": "<p><strong>(B) 長 9、寬 6<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>剪下來再拼過去，<strong>底的長度沒有變<\/strong>，變成長方形的長；剪開的那條線就是高，變成長方形的寬。<br />\n所以長 = 底 = 9，寬 = 高 = 6，面積 9×6 = 54 平方公分，和平行四邊形的面積一樣。<br />\n這就是「平行四邊形面積 = 底 × 高」的由來。<\/p>"}, {"label": "選擇2", "kind": "選擇", "stem": "<p>兩個完全一樣的三角形（底 10 公分、高 7 公分）可以拼成一個平行四邊形。這個平行四邊形的面積，和一個三角形的面積，各是多少平方公分？<\/p>", "opts": {"A": "<p>70、70<\/p>", "B": "<p>70、35<\/p>", "C": "<p>35、17.5<\/p>", "D": "<p>140、70<\/p>"}, "key": "B", "ans": "<p><strong>(B) 70、35<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>拼成的平行四邊形，底和高就是三角形的底和高：10×7 = 70。<br />\n一個三角形是平行四邊形的一半：70÷2 = 35。<br />\n所以「三角形面積 = 底 × 高 ÷ 2」。<\/p>"}, {"label": "選擇3", "kind": "選擇", "stem": "<p>兩個完全一樣的梯形（上底 5 公分、下底 11 公分、高 4 公分），把其中一個倒過來接在旁邊，拼成一個平行四邊形。這個平行四邊形的底是幾公分？<\/p>", "opts": {"A": "<p>5<\/p>", "B": "<p>11<\/p>", "C": "<p>16<\/p>", "D": "<p>20<\/p>"}, "key": "C", "ans": "<p><strong>(C) 16<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>倒過來接上去以後，一條邊是「上底＋下底」：5 + 11 = 16 公分，高還是 4 公分。<br />\n平行四邊形面積 16×4 = 64，一個梯形是一半：64÷2 = 32 平方公分。<br />\n所以「梯形面積 = (上底＋下底) × 高 ÷ 2」。<\/p>"}]}, {"title": "第二關　哪一條才是高？", "no": "", "diff": "", "src": "", "note": "", "photo": null, "extra": "<h3>本關重點<\/h3>\n<p><img class=\"fig\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRhCJAABXRUJQVlA4IASJAAAwiwKdASp4BRQDPm02l0ikIyUhIfPJ+KANiWVu/DRigIBFU+dP7B2ueX5P  />\n15 公分的斜邊用不到，是來混淆的。<\/p>"}, {"label": "選擇6", "kind": "選擇", "stem": "<p>小美算一個三角形（底 16 公分、高 11 公分）的面積，她寫：16 × 11 = 176 平方公分。她錯在哪裡？<\/p>", "opts": {"A": "<p>沒有錯<\/p>", "B": "<p>忘了除以 2，正確答案是 88<\/p>", "C": "<p>應該算 16 + 11<\/p>", "D": "<p>應該再乘 2，答案是 352<\/p>"}, "key": "B", "ans": "<p><strong>(B) 忘了除以 2，正確答案是 88<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>16 × 11 = 176 是「兩個這樣的三角形」拼成的平行四邊形。三角形只有一半：176 ÷ 2 = 88。<\/p>"}]}, {"title": "第三關　梯形：先認出它是梯形", "no": "", "diff": "", "src": "", "note": "", "photo": null, "extra": "", "items": [{"label": "計算2", "kind": "計算", "stem": "<p>一個梯形，上底 6 公分、下底 10 公分、高 5 公分；上底的左端到左下角，水平距離是 2 公分。這個梯形的面積是多少平方公分？<\/p>", "opts": {}, "key": "", "ans": "<p><strong>40 平方公分<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>(6 + 10) × 5 ÷ 2 = 16 × 5 ÷ 2 = 40 平方公分。<br />\n「水平距離 2 公分」只是告訴你圖形斜了多少，算面積用不到。<\/p>"}, {"label": "選擇7", "kind": "選擇", "stem": "<p>一塊四邊形的花圃，上面那條邊 9 公尺、下面那條邊 5 公尺，兩條邊互相平行，中間的距離（高）是 6 公尺。阿強算面積寫 9 × 6 = 54 平方公尺。他對嗎？<\/p>", "opts": {"A": "<p>對<\/p>", "B": "<p>不對，上下兩邊不一樣長是梯形，答案是 42<\/p>", "C": "<p>不對，應該是 5 × 6 = 30<\/p>", "D": "<p>不對，應該是 (9+5) × 6 = 84<\/p>"}, "key": "B", "ans": "<p><strong>(B) 不對，上下兩邊不一樣長是梯形，答案是 42<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>上下兩邊平行但<strong>不一樣長<\/strong>，所以是梯形，不是平行四邊形。<br />\n(9 + 5) × 6 ÷ 2 = 14 × 6 ÷ 2 = 42 平方公尺。<br />\n(D) 忘了除以 2。<\/p>"}, {"label": "計算3", "kind": "計算", "stem": "<p>一個直角梯形，左右兩條直立的邊互相平行，分別是 3 公分和 8 公分；底下那條邊 6 公分，和兩條直立的邊都垂直。面積是多少平方公分？<\/p>", "opts": {}, "key": "", "ans": "<p><strong>33 平方公分<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>互相平行的兩條邊才是上底和下底：3 和 8。<br />\n和它們垂直的 6 公分是高。<br />\n(3 + 8) × 6 ÷ 2 = 11 × 6 ÷ 2 = 33 平方公分。<br />\n梯形不一定是「上下」擺放，<strong>先找出哪兩條邊平行<\/strong>。<\/p>"}, {"label": "計算4", "kind": "計算", "stem": "<p>直角梯形 ABCD 中，上底 AD = 12 公分，下底 BC = 20 公分，DC = 10 公分，而且 DC 和 AD、BC 都垂直。連接 BD，把梯形分成兩個三角形。<br />\n(1) 三角形 ABD 的面積是多少？<br />\n(2) 三角形 BCD 的面積是多少？<br />\n(3) 梯形 ABCD 的面積是多少？<\/p>", "opts": {}, "key": "", "ans": "<p><strong>(1) 60 平方公分　(2) 100 平方公分　(3) 160 平方公分<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>DC 和上下底都垂直，所以 DC = 10 公分就是高。<br />\n(1) 三角形 ABD：底 AD = 12，高 10 → 12 × 10 ÷ 2 = 60。<br />\n(2) 三角形 BCD：底 BC = 20，高 10 → 20 × 10 ÷ 2 = 100。<br />\n(3) 梯形：(12 + 20) × 10 ÷ 2 = 160。<br />\n驗算：60 + 100 = 160，兩個三角形合起來剛好是梯形。<br />\n斜邊 AB 不是高，題目也沒有給它的長度。<\/p>"}]}, {"title": "第四關　畫高和複合圖形", "no": "", "diff": "", "src": "", "note": "", "photo": null, "extra": "<h3>本關重點<\/h3>\n<p><img class=\"fig\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRhaRAABXRUJQVlA4IAqRAADwlgKdASp4BRQDPm00l0ikIqKhInNp2IANiWVu/B70DSn6vd22rFPf3/9v/X96B57/Mf3j/F/9X/Be/Vc38P/b/2Z7P/Inszy5ejf/P933zT/33qO/RP/B/Pv/p/YB+pf/J/yP5IfR3/t+qv+wf9v1F/zn/Ef9r/kf+T////f6iP+J+3nul/zH+r9gH+8f9f//+2T/yv/x7iP+L/5f//9wf+j/3j//+uh+2//S+TH+w/8j9zvgR/pX+o//f/e9wD/y+1v/AP/F1v/Tz+vf0r8P/GX+/f4v9k/8J6Y/jXzr99/vX7ef2n5qfpr/L8LvTH/M/0Hqb/LPuR+n/tn+P/8vsp/vP8j+7P+V9Ffyn9t/2f+S9gL8p/ln+d/tf5H/BL8p/mv833Umc/7H/Z/5v2BfVP57/wP8B/of/j/nvRn/sf7v/l/Yn7D/7D/Kfl19gP87/q3/I/wnnUeCZ90/4v7DfAD/Nv75/6/85/qf3F+mL+s/83+a/1n7ue3r84/0v/p/0f+x+Qr+af2f/vf4n8q/nw///vC/en//+7d+4///GlTKhj6L4HqZUMfRfA9TKhj6L4HqZUMfRfA9TKhj6L4HqZUMfRfA9TKhj6L4HqZUMfRfA9TKhj6L4EftV2+9oneH8tPn9QzXO2hda5xX8LYIzfoWaiDvjwcKVZQ5ZqKyCtNR5YIQF8RJ3iA+M5M5gaqpmf6ub7iO9TKhj6L4HqZUMfRfA9TKhj6L4HqZUMfRfA9TKhjxBblbkh21I6mkDwXSSwzi6W2IbBbedBdIbFoS6FLfwZtuRG+Uehjlfma9v4uvXBTr9mTX2o5+eV4FlgTc0Wbols9ZgAdTzxxbIHe/fRYRGIe4bDjbpu6yi4f2jlWQJUkqRYYUFFOMwEYcG4i0G8qz8Zmdvhx524sTVBo7pxISZLPYKVjytDG5o8Z7tS6RQKqrpncsDkSmrLflBQbMaVBzFEIiiRH85DbTxxph6mVDH0XwPUyoY+i+B6mVDH0XwPUyoY+iTie3CuyHjMNORA9stsgQ5RzwnrTCNR91dcmpvWdcgx71JCNuyjsmeBbCH6zYAUDVQcDRxKUuMPYzMhoRz0o+uJLseWqseHXL/HD/rrmKm5kBArYG8WPryeA+hnGiMCp0iqlkfShKfRfA9TKhj6L4HqZUMfRfA9TKhj6L4HqZUMfRfA9Tyb1Ghf3VhdZD9vZ0Ny+dlQx9F8D1MqGPovgeplQx9F8D1MqGPovgeplQx9F7r/FVtxomB4M8Php1HV/XFovHvNnEJyi7Z13U2wfOBpM1pu8EBICaCBKJEp6SlIWpjsIMR925YjZVWik653lhzCq/m6OVh04bviSPjH0XwPUyoY+i+B6mVDH0XwPUyoY+i+B6mVDH0XwPUyMBy8y6Nsm7uvEizy+bAx2fKTLP0evaL8F8GQYCfoaW2rtZDEnykBFDvdjBJ5cPztYo4URMSnR92CLdiwYopb95rohtcOG4DVzOcv3zxiNPzEjwvgVWjnZyAZeHp0SpgRPxuD4 p>\n<p><div class=\"callout tip\"><div class=\"ct\"><p>複合圖形三步驟<\/p><\/div><ol>\n<li>先算「全部」。<\/li>\n<li>把不要的部分切成三角形、長方形，<strong>每一塊都找出自己的底和高<\/strong>。<\/li>\n<li>全部 − 不要的，最後用「各部分加起來等於全部」驗算。<\/li>\n<\/ol><\/div><\/p>", "items": [{"label": "選擇8", "kind": "選擇", "stem": "<p>一個鈍角三角形，底在下面，最上面的頂點卻在底的左邊外面。要畫出這條底的高，下面哪一種方法正確？<\/p>", "opts": {"A": "<p>從頂點畫一條線到底的中點<\/p>", "B": "<p>把底往左延長，從頂點畫一條垂直於延長線的線<\/p>", "C": "<p>沿著最長的那條邊畫<\/p>", "D": "<p>鈍角三角形沒有高<\/p>"}, "key": "B", "ans": "<p><strong>(B)<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>高要和底<strong>垂直<\/strong>，而且要從<strong>底對面的頂點<\/strong>畫出來。<br />\n頂點不在底的正上方時，垂直線碰不到底，所以要先把底延長，垂直線落在延長線上，再標直角符號。<\/p>"}, {"label": "選擇9", "kind": "選擇", "stem": "<p>上一題的鈍角三角形，底是 7 公分，從頂點畫到延長線的高是 8 公分。面積是多少平方公分？<\/p>", "opts": {"A": "<p>56<\/p>", "B": "<p>28<\/p>", "C": "<p>14<\/p>", "D": "<p>高在外面，沒辦法算<\/p>"}, "key": "B", "ans": "<p><strong>(B) 28<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>高畫在外面也一樣是高：7 × 8 ÷ 2 = 28 平方公分。<\/p>"}, {"label": "計算5", "kind": "計算", "stem": "<p>三個正方形的邊長分別是 12 公分、9 公分、6 公分，由大到小並排，底邊對齊。<\/p>\n<ul>\n<li>一條長斜線，從大正方形的左上角連到小正方形的右下角。<\/li>\n<li>一條折線，連接三個正方形的左上角，最後也接到小正方形的右下角。<\/li>\n<\/ul>\n<p>兩條線中間夾的部分塗上顏色，塗色部分的面積是多少平方公分？<\/p>", "opts": {}, "key": "", "ans": "<p><strong>49.5 平方公分<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<ol>\n<li>三個正方形合起來：12×12 + 9×9 + 6×6 = 144 + 81 + 36 = 261。<\/li>\n<li>長斜線下面是一個大直角三角形：底 12+9+6 = 27，高 12 → 27 × 12 ÷ 2 = 162。<\/li>\n<li>折線上面有三個白色直角三角形：<br />\n   - 大正方形裡：12 × (12−9) ÷ 2 = 18<br />\n   - 中正方形裡：9 × (9−6) ÷ 2 = 13.5<br />\n   - 小正方形裡：6 × 6 ÷ 2 = 18<br />\n   - 合計 49.5<\/li>\n<li>塗色 = 261 − 162 − 49.5 = 49.5 平方公分。<\/li>\n<\/ol>\n<p>不規則的圖形，不能直接把全部除以 2（261 ÷ 2 = 130.5 不對），要「全部 − 不要的部分」。<\/p>"}, {"label": "計算6", "kind": "計算", "stem": "<p>一塊長 16 公分、寬 10 公分的長方形紙板，剪掉一個底 6 公分、高 4 公分的三角形。剩下的面積是多少平方公分？<\/p>", "opts": {}, "key": "", "ans": "<p><strong>148 平方公分<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>全部 − 剪掉的：16 × 10 − 6 × 4 ÷ 2 = 160 − 12 = 148 平方公分。<br />\n注意運算順序：先算 6 × 4 ÷ 2 = 12，再相減。<\/p>"}]}];
const KEY = 'mq-g5-area';
let st = {};
try { st = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const typeset = (node) => { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([node]).catch(() => {}); };

const themeBtn = $('#theme');
const paintTheme = () => { themeBtn.textContent = document.documentElement.dataset.theme === 'dark' ? '☀ 淺色' : '🌙 深色'; };
themeBtn.onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('deck-theme', r.dataset.theme); } catch (e) {} paintTheme(); };
paintTheme();

let filter = '全部';
const kinds = ['全部', ...new Set(DATA.flatMap(g => g.items.map(q => q.kind)))];
const bar = $('#bar');
[...kinds, '只看錯題'].forEach(k => {
  const b = el('button', 'chip' + (k === filter ? ' on' : ''), k);
  b.onclick = () => { filter = k; bar.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); applyFilter(); };
  bar.appendChild(b);
});
const reset = el('button', 'chip', '清除紀錄');
reset.onclick = () => { if (confirm('清除這一頁的作答紀錄？')) { st = {}; save(); location.reload(); } };
bar.appendChild(reset);
const prog = el('span', 'prog'); bar.appendChild(prog);

function updateProg() {
  const all = DATA.flatMap((g, gi) => g.items.map((q, qi) => gi + '-' + qi));
  const done = all.filter(id => st[id]).length, bad = all.filter(id => st[id] === 'bad').length;
  prog.innerHTML = `已作答 ${done} / ${all.length}　<span class="wrong-dot">錯 ${bad}</span>`;
}

function applyFilter() {
  let shown = 0;
  document.querySelectorAll('.group').forEach(g => {
    let any = false;
    g.querySelectorAll('.q').forEach(q => {
      const ok = filter === '全部' || (filter === '只看錯題' ? st[q.dataset.id] === 'bad' : q.dataset.kind === filter);
      q.hidden = !ok; any = any || ok;
    });
    g.hidden = !any; if (any) shown++;
  });
  $('#empty') && $('#empty').remove();
  if (!shown) $('#list').appendChild(el('div', 'empty', filter === '只看錯題' ? '目前沒有錯題 🎉' : '沒有符合的題目'));
  const e = $('.empty'); if (e) e.id = 'empty';
}

function reveal(qd, which) {
  const box = qd.querySelector('.box.' + which);
  if (box) { box.hidden = !box.hidden; if (!box.dataset.ts) { box.dataset.ts = 1; typeset(box); } }
}

function mark(qd, id, v) {
  st[id] = v; save(); updateProg();
  qd.querySelectorAll('.mark-ok,.mark-bad').forEach(b => b.style.fontWeight = '400');
  const b = qd.querySelector(v === 'ok' ? '.mark-ok' : '.mark-bad'); if (b) b.style.fontWeight = '900';
}

const list = $('#list');
DATA.forEach((g, gi) => {
  const gd = el('section', 'group');
  const head = el('div', 'gh');
  head.appendChild(el('h2', '', g.title));
  head.appendChild(el('span', 'meta', [g.no, g.diff, g.src].filter(Boolean).join('　')));
  gd.appendChild(head);
  if (g.photo) {
    const b = el('button', 'btn', '📷 原卷圖'); const img = el('img', 'photo'); img.hidden = true;
    b.onclick = () => { if (!img.src) img.src = g.photo; img.hidden = !img.hidden; };
    const row = el('div', 'btns'); row.appendChild(b); gd.appendChild(row); gd.appendChild(img);
  }
  g.items.forEach((q, qi) => {
    const id = gi + '-' + qi;
    const qd = el('div', 'q'); qd.dataset.id = id; qd.dataset.kind = q.kind;
    qd.appendChild(el('div', '', `<span class="qlabel">${q.label}</span><span class="tag">${q.kind}</span>`));
    qd.appendChild(el('div', 'stem', q.stem));
    const fb = el('div', 'fb');
    if (q.key) {
      const opts = el('div', 'opts');
      Object.entries(q.opts).forEach(([k, v]) => {
        const o = el('button', 'opt', `<b>(${k})</b> ${v}`);
        o.onclick = () => {
          if (k === q.key) {
            o.classList.add('ok'); fb.className = 'fb ok'; fb.textContent = '答對了！';
            if (!st[id]) mark(qd, id, 'ok');
            const a = qd.querySelector('.box.ans'); if (a.hidden) reveal(qd, 'ans');
          } else {
            o.classList.add('bad'); fb.className = 'fb bad'; fb.textContent = '再想想，或按「看解析」。';
            mark(qd, id, 'bad');
          }
        };
        opts.appendChild(o);
      });
      qd.appendChild(opts);
    }
    qd.appendChild(fb);
    const btns = el('div', 'btns');
    const bs = el('button', 'btn', '💡 看解析'); bs.onclick = () => reveal(qd, 'sol'); btns.appendChild(bs);
    const ba = el('button', 'btn', '✅ 看答案'); ba.onclick = () => reveal(qd, 'ans'); btns.appendChild(ba);
    if (!q.key) {
      const ok = el('button', 'btn mark-ok', '○ 我答對了'); ok.onclick = () => mark(qd, id, 'ok');
      const bad = el('button', 'btn mark-bad', '✗ 我答錯了'); bad.onclick = () => mark(qd, id, 'bad');
      btns.appendChild(ok); btns.appendChild(bad);
    }
    qd.appendChild(btns);
    const sol = el('div', 'box sol', q.sol || '（這題沒有另外的解析）'); sol.hidden = true; qd.appendChild(sol);
    const ans = el('div', 'box ans', q.ans); ans.hidden = true; qd.appendChild(ans);
    if (st[id]) mark(qd, id, st[id]);
    gd.appendChild(qd);
  });
  if (g.extra) {
    const b = el('button', 'btn', '📌 本組重點'); const box = el('div', 'box extra', g.extra); box.hidden = true;
    b.onclick = () => { box.hidden = !box.hidden; if (!box.dataset.ts) { box.dataset.ts = 1; typeset(box); } };
    const row = el('div', 'btns'); row.appendChild(b); gd.appendChild(row); gd.appendChild(box);
  }
  list.appendChild(gd);
});
updateProg(); applyFilter();
document.querySelectorAll('.stem,.opts').forEach(n => n.dataset.ts = 1);
window.addEventListener('load', () => typeset(list));
</script>
