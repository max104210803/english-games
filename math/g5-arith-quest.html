<script>
const DATA = [{"title": "第一關　拿掉括號，符號要不要變？", "no": "", "diff": "", "src": "", "note": "", "photo": null, "extra": "<h3>本關重點<\/h3>\n<p><div class=\"callout tip\"><div class=\"ct\"><p>拿掉括號的口訣<\/p><\/div><ul>\n<li>括號前是 <strong>×<\/strong> 或 <strong>+<\/strong>：直接拿掉，不用變號。<\/li>\n<li>括號前是 <strong>÷<\/strong>：括號裡 × 變 ÷、÷ 變 ×。<\/li>\n<li>括號前是 <strong>−<\/strong>：括號裡 + 變 −、− 變 +。<\/li>\n<li>拿不準就<strong>把兩邊都算出來比一比<\/strong>。<\/li>\n<\/ul><\/div><\/p>", "items": [{"label": "選擇1", "kind": "選擇", "stem": "<p>下面哪一個算式和 600÷(15×4) 的答案一樣？<\/p>", "opts": {"A": "<p>600÷15×4<\/p>", "B": "<p>600÷15÷4<\/p>", "C": "<p>600×15÷4<\/p>", "D": "<p>600÷4×15<\/p>"}, "key": "B", "ans": "<p><strong>(B) 600÷15÷4<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>600÷(15×4) 的意思是「600 平分成 15×4 = 60 份」，答案是 10。<br />\n平分成 60 份，可以先平分成 15 份，再把每份平分成 4 份，所以是 600÷15÷4 = 40÷4 = 10。<br />\n括號前面是 <strong>÷<\/strong>，拿掉括號時，括號裡的 <strong>× 要變成 ÷<\/strong>。<\/p>"}, {"label": "選擇2", "kind": "選擇", "stem": "<p>下面哪一個算式和 845−(245−60) 的答案一樣？<\/p>", "opts": {"A": "<p>845−245−60<\/p>", "B": "<p>845−245+60<\/p>", "C": "<p>845+245−60<\/p>", "D": "<p>845−60−245<\/p>"}, "key": "B", "ans": "<p><strong>(B) 845−245+60<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>845−(245−60) = 845−185 = 660。<br />\n括號裡「少減了 60」，所以拿掉括號後，要把 60 <strong>加回來<\/strong>：845−245+60 = 600+60 = 660。<br />\n括號前面是 <strong>−<\/strong>，拿掉括號時，括號裡的 <strong>− 要變成 +<\/strong>、<strong>+ 要變成 −<\/strong>。<\/p>"}, {"label": "選擇3", "kind": "選擇", "stem": "<p>下面哪一組，左右兩邊的答案相等？<\/p>", "opts": {"A": "<p>720÷(9×8) 和 720÷9×8<\/p>", "B": "<p>48÷6+2 和 48÷(6+2)<\/p>", "C": "<p>300×(40÷8) 和 300×40÷8<\/p>", "D": "<p>925−318−25 和 925−(318−25)<\/p>"}, "key": "C", "ans": "<p><strong>(C)<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<ul>\n<li>(A) 左邊 720÷72 = 10，右邊 80×8 = 640，不相等。<\/li>\n<li>(B) 左邊 8+2 = 10，右邊 48÷8 = 6，不相等。<\/li>\n<li>(C) 左邊 300×5 = 1500，右邊 12000÷8 = 1500，<strong>相等<\/strong>。括號前面是 ×，拿掉括號不必變號。<\/li>\n<li>(D) 左邊 582，右邊 925−293 = 632，不相等。<\/li>\n<\/ul>"}, {"label": "選擇4", "kind": "選擇", "stem": "<p>小華說：「72÷(6+3) = 72÷6 + 72÷3。」他說得對嗎？<\/p>", "opts": {"A": "<p>對，兩邊都是 36<\/p>", "B": "<p>不對，左邊是 8，右邊是 36<\/p>", "C": "<p>不對，左邊是 8，右邊是 12<\/p>", "D": "<p>對，除法也可以這樣拆開<\/p>"}, "key": "B", "ans": "<p><strong>(B) 不對，左邊是 8，右邊是 36<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>左邊：72÷9 = 8。右邊：12 + 24 = 36。兩邊不一樣。<br />\n(甲+乙)÷丙 可以拆成 甲÷丙 + 乙÷丙；但 <strong>丙÷(甲+乙) 不能拆<\/strong>。<\/p>"}]}, {"title": "第二關　分配律：先找「共同的那個數」", "no": "", "diff": "", "src": "", "note": "", "photo": null, "extra": "<h3>本關重點<\/h3>\n<p><img class=\"fig\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRiTYAABXRUJQVlA4IBjYAADQEAOdASp4BRQDPm02lkikIyUhIlaqWKANiWVu/GXhgrKY6G1GZhAGnYUP/A/xvisxb8A/Y/4r/F+uFxz3he9/wXrm/4PIT4X/p+Tbzp+mfbH/l/+1/gv8p8Gv6l/fv/J/if3/+gL9XP2N9dv1Xf3v/o/lj8Af6f/nf/b/sf3/+Wz/Z/tB7mf7D/sf2x/7fyB/3P/a//D2n/+d/8P+f8FP91/4H/79wn+g/5H/6+ux+5X/a+TT+z/9L92P+t8iP7X//z/re4B/6///7AH/l/////9wD1h+ln9a/sn9+/v/v2+Kfnv9Z/uP+S/x39W9JfxP5Z+wf23/Lf6n+1+1H/d+EnzP+C/2H+b9T/439j/xH9p/xH/f/vn70/cr9f/vn+S/cj+4eiP5Z+2/5D8uP8f8gv5B/Lv8X/Zf3f/vHxT/G/6P/O/5/9kvFi0T/F/6j/Hfu9+//0C+rPzv/Pf37/Pf9//K+5/6r/qf7N/nf/b7ifl/9g/0f+K/Ir7AP5F/Qf9d/gP8x/8f8Z///+79p/6X9l/I3+xf6n/2f5P4Av5R/ZP+J/kP9Z+1f0nfyP/T/y/+q/b/2m/mH+U/7f+c/137i/YN/LP65/zf8D/pP2z////2++3/we6v90P/l7pv7b//3/VECe30/65/KflwocLGyk2Btvp/1z+U/LhQ4WNlJsDbfT/rn8p+XChwsbKTYG2+n/XP5T8uFDhY2UmwNt9P+ubNsmFi+n6BelHfo9BHU0mCYZFuwAz6M5ypMFLZUKyuQMHDEkXXdrp/gwhhVQ6Cyk2Btvp/1z+U/LhQ4WNlJsDbfT/rn8p+XChwsbKTYG2+n9QeLufkkXpaTPi03vBuX698VP4rcKr6Gl6mJXCOf4yRkAhF6OdzbIVAcEuTx/LT7NSYZDnGA5nG6njszwCg/B6uIaDJdTtwKheDBqYgZwD6aTHb+WyrmKbZHAaf9c/lPy4UOFjZSbA230/65/KflwocLGyk2Btvp/1z+U/LfdmaeSsRXiztB94D536hxqWgIGu1N/iP9gT3OzpG3FeC+YcyAT1LA4wUX4TeuOxx44IA98BFAtuZqiKQx+rYEfn0BhCmrYWucu6Rvyk2Btvp/1z+U/LhQ4WNlJsDbfT/rn8p+XChwsbKTYG2+n/XQEjtUdhWyatnfGmwNt9P+ufyn5cKHCxspNgbb6f9c/lPy4UOFjZSbA230/65zwwZ0sgXpXIZH42uBQrjV8WeN15YY1zz5CFiULAYi2LMU5eByvEGbgYjzWBj/gYIubeP04QvaFbKflwocLGyk2Btvp/1z+U/LhQ4WNlJsDbfT/rn8p+XChwsa986Z1EcTK6fyJDrP3oPZNnqkznSLZTh7Ix38NGdwvtOnwRoU5MC4uS8dF6WDzTXGSul8ygSnYvXrkf 是 3<\/p>"}, "key": "C", "ans": "<p><strong>(C) 先減後除錯了，正確答案是 3970<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>前兩步都對。第三步她先做 4000−480，再除以 16，順序錯了。<br />\n括號算完以後，剩下的「4000 − 480÷16」仍然要<strong>先乘除、後加減<\/strong>：<br />\n480÷16 = 30，4000 − 30 = 3970。<\/p>"}, {"label": "計算3", "kind": "計算", "stem": "<p>已知 6×2417 = 14502，那麼 14502×13 − 18×2417 等於多少？<\/p>", "opts": {}, "key": "", "ans": "<p><strong>145020<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>18×2417 = 3×(6×2417) = 3×14502。<br />\n所以 14502×13 − 14502×3 = 14502×(13−3) = 14502×10 = 145020。<\/p>"}]}, {"title": "第三關　接近整十、整百、整千的數", "no": "", "diff": "", "src": "", "note": "", "photo": null, "extra": "<h3>本關重點<\/h3>\n<p><div class=\"callout tip\"><div class=\"ct\"><p>湊整的兩個方向<\/p><\/div><ul>\n<li><strong>加法<\/strong>：49999 看成 50000 − 1，最後再把少的減回來。<\/li>\n<li><strong>乘法<\/strong>：997 看成 1000 − 3，要減掉的是「3 個<strong>另一個數<\/strong>」。<\/li>\n<li>算完用估算檢查答案的大小。<\/li>\n<\/ul><\/div><\/p>", "items": [{"label": "選擇7", "kind": "選擇", "stem": "<p>9999×997 可以怎麼算？<\/p>", "opts": {"A": "<p>9999×1000 − 997×3<\/p>", "B": "<p>9999×1000 − 9999×3<\/p>", "C": "<p>9999×1000 − 3<\/p>", "D": "<p>10000×997 − 9999<\/p>"}, "key": "B", "ans": "<p><strong>(B) 9999×1000 − 9999×3<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>997 = 1000 − 3，所以 9999×997 是「1000 個 9999，拿掉 3 個 9999」：<br />\n9999×1000 − 9999×3 = 9999000 − 29997 = 9969003。<br />\n拿掉的是「3 個 9999」，不是「3 個 997」。<\/p>"}, {"label": "計算4", "kind": "計算", "stem": "<p>算算看（寫出簡化的算式）：9999×996<\/p>", "opts": {}, "key": "", "ans": "<p><strong>9959004<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>方法一：996 = 1000 − 4 → 9999×1000 − 9999×4 = 9999000 − 39996 = 9959004。<br />\n方法二：9999 = 10000 − 1 → 10000×996 − 996 = 9960000 − 996 = 9959004。<br />\n<strong>估算檢查<\/strong>：大約 10000×1000 = 10000000，答案比一千萬少一點點，合理。<\/p>"}, {"label": "計算5", "kind": "計算", "stem": "<p>算算看（寫出簡化的算式）：49999 + 4999 + 499 + 49<\/p>", "opts": {}, "key": "", "ans": "<p><strong>55546<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>每個數都比整數少 1：<br />\n50000 + 5000 + 500 + 50 − 4 = 55550 − 4 = 55546。<\/p>"}, {"label": "計算6", "kind": "計算", "stem": "<p>算算看（寫出簡化的算式）：0.8 + 9.8 + 99.8 + 999.8<\/p>", "opts": {}, "key": "", "ans": "<p><strong>1110.2<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>每個數都比整數少 0.2，一共 4 個：<br />\n1 + 10 + 100 + 1000 − 0.2×4 = 1111 − 0.8 = 1110.2。<br />\n寫小數時，小數點要寫清楚。<\/p>"}, {"label": "計算7", "kind": "計算", "stem": "<p>算算看（寫出簡化的算式）：666×999 + 666<\/p>", "opts": {}, "key": "", "ans": "<p><strong>666000<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>666 = 666×1，所以 666×999 + 666×1 = 666×(999+1) = 666×1000 = 666000。<\/p>"}]}, {"title": "第四關　應用題：畫出來就不會錯", "no": "", "diff": "", "src": "", "note": "", "photo": null, "extra": "<h3>本關重點<\/h3>\n<p><img class=\"fig\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRmTNAABXRUJQVlA4IFjNAACQEwOdASp4BRQDPm00lkikIqKiIpSKcIANiWVu/DD8CVDPJdbMCnW5NMA1+ftT/Bny36jv643+N/o/8Z+OvwG8n+VPwD8F64/9Xx6+H/5PlNc6f+n/E+2X/e/+H/Je6H+vf5j9l/gB/pH+F/aD3P/8X9pfdf/aP+N+VHwB/nn96/9P+u/f/5cv9t+1fuV/r3+p/a7/Z/IB/Uf77//Pam/4n//9yz+5f7//+e4P/O/8p/+fXR/dD/h/Jx/Z/+f+6n/N+RP9pv/9/yfcA/9fqAf+f//+wB6v/Sv+r/kj/bvQz+k/2T+0/s5/bvSX8T+W/sn9s/zf+h/tHs8/0X9v8h/n/8Z/u/8J/nPYz+QfYP8N/Zv8p/3f8J+9nxP/jv7v+3P+A9F/yb9z/0n+N/eT/G/IL+Qfy7/H/2f92/8X8Sfv3+y/2n5P+NJn3+b/1X+S9gX1N+d/63++f5z/zf5Lz+/4//CfvR+///z+g/z3+1/7b+8/j39gP8j/pX+6/uf73/5P/////7j/w3/d/P/0KftH+z/73+b+AH+U/2n/l/5D/OftL9Jn8l/2f8x/rf299rP5f/mP+//mP9x8g/8v/r3/P/w/+f/bH53f//7sP3e/+Purftr//iHx0J5tXm73k1cMavN3vJq4Y1ebveTVwxq83e8mrhjV5u95NXDGrzd7yauGNXm73k1cMavN3vJq4Y1ebveNiJavmgAGpIvbuZyHXTCh2TEdr3y4etbO9Qea8wz5xugsSjH+1mjY2ViCpFkTKFwicgRch5JNRozwKAlsBSasJZeKO1zqmD6DavN3vJq4Y1ebveTVwxq83e8mrhjV5u95NXDGrzd4/SuALKiWgkmH9UNK6G9Wgq8KmLGxsdToA90vqYpJ7VzM0vbavwwn/Pq9UenZmkwCztc8DAynv9Qglj1Btdz6bhgUnaCaiPQFThWDyhA31/lVyLpWLQEDVFeaSMSfjOiueiL9bFt3Yh8/YB6tLUMDhIb0NHAal9I3WKLwswSRrGNc6iPH+0E25tXm73k1cMavN3vJq4Y1ebveTVwxq83e8mrhjV5u95MKrYW9rV4d4xDeMRLEBONJgyx68TYniM6AY0BCVzEQJf9cyLqgIOgdY0Xz4+A9Zln5AtpVC3TgMhw+4MD6cuDj7nTSO1WFEnC5aB4mpJe2b8zdJhP4m9tAM6E82rzd7yauGNXm73k1cMavN3vJq4Y1ebveTVwxq83e8 : "<p>小明、小華、小美三人去露營。小明交給小美 300 元，小華交給小美 410 元，由小美負責付所有的錢，結果一共花了 1050 元。費用由 3 人平均分攤，誰該給誰幾元？<\/p>", "opts": {}, "key": "", "ans": "<p><strong>小明給小華 50 元，小美給小華 10 元<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<ol>\n<li>每人應付：1050 ÷ 3 = 350 元。<\/li>\n<li>小美自己付了：1050 − 300 − 410 = 340 元。<\/li>\n<li>跟 350 比：小明少付 50、小美少付 10、小華多付 60（50 + 10 = 60，剛好對上）。<\/li>\n<li>少付的人把錢補給多付的人。<\/li>\n<\/ol>\n<p>驗算：小明 300+50 = 350，小華 410−60 = 350，小美 340+10 = 350。<\/p>"}, {"label": "計算10", "kind": "計算", "stem": "<p>電信公司有兩種方案，合約都是 30 個月：<\/p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\"><\/th>\n<th style=\"text-align: center;\">甲方案<\/th>\n<th style=\"text-align: center;\">乙方案<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">月租費<\/td>\n<td style=\"text-align: center;\">599 元<\/td>\n<td style=\"text-align: center;\">399 元<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">搭配買手機<\/td>\n<td style=\"text-align: center;\">8000 元<\/td>\n<td style=\"text-align: center;\">12500 元<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>(1) 不買手機時，乙方案 30 個月比甲方案便宜多少元？<br />\n(2) 如果要買手機，哪一個方案比較划算？便宜多少元？<\/p>", "opts": {}, "key": "", "ans": "<p><strong>(1) 6000 元　(2) 乙方案，便宜 1500 元<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>(1) 每個月差 599 − 399 = 200 元，30 個月差 200×30 = 6000 元。<br />\n(2) 甲：8000 + 599×30 = 8000 + 17970 = 25970 元；乙：12500 + 399×30 = 12500 + 11970 = 24470 元。<br />\n乙比甲少 25970 − 24470 = 1500 元。手機雖然比較貴，但月租省下來的錢更多。<\/p>"}]}];
const KEY = 'mq-g5-arith';
let st = {};
try { st = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const typeset = (node) => { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([node]).catch(() => {}); };

const themeBtn = $('#theme');
const paintTheme = () => { themeBtn.textContent = document.documentElement.dataset.theme === 'dark' ? '☀ 淺色' : '🌙 深色'; };
themeBtn.onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('deck-theme', r.dataset.theme); } catch (e) {} paintTheme(); };
paintTheme();

let filter = '全部';
const kinds = ['全部', ...new Set(DATA.flatMap(g => g.items.map(q => q.kind)))];
const bar = $('#bar');
[...kinds, '只看錯題'].forEach(k => {
  const b = el('button', 'chip' + (k === filter ? ' on' : ''), k);
  b.onclick = () => { filter = k; bar.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); applyFilter(); };
  bar.appendChild(b);
});
const reset = el('button', 'chip', '清除紀錄');
reset.onclick = () => { if (confirm('清除這一頁的作答紀錄？')) { st = {}; save(); location.reload(); } };
bar.appendChild(reset);
const prog = el('span', 'prog'); bar.appendChild(prog);

function updateProg() {
  const all = DATA.flatMap((g, gi) => g.items.map((q, qi) => gi + '-' + qi));
  const done = all.filter(id => st[id]).length, bad = all.filter(id => st[id] === 'bad').length;
  prog.innerHTML = `已作答 ${done} / ${all.length}　<span class="wrong-dot">錯 ${bad}</span>`;
}

function applyFilter() {
  let shown = 0;
  document.querySelectorAll('.group').forEach(g => {
    let any = false;
    g.querySelectorAll('.q').forEach(q => {
      const ok = filter === '全部' || (filter === '只看錯題' ? st[q.dataset.id] === 'bad' : q.dataset.kind === filter);
      q.hidden = !ok; any = any || ok;
    });
    g.hidden = !any; if (any) shown++;
  });
  $('#empty') && $('#empty').remove();
  if (!shown) $('#list').appendChild(el('div', 'empty', filter === '只看錯題' ? '目前沒有錯題 🎉' : '沒有符合的題目'));
  const e = $('.empty'); if (e) e.id = 'empty';
}

function reveal(qd, which) {
  const box = qd.querySelector('.box.' + which);
  if (box) { box.hidden = !box.hidden; if (!box.dataset.ts) { box.dataset.ts = 1; typeset(box); } }
}

function mark(qd, id, v) {
  st[id] = v; save(); updateProg();
  qd.querySelectorAll('.mark-ok,.mark-bad').forEach(b => b.style.fontWeight = '400');
  const b = qd.querySelector(v === 'ok' ? '.mark-ok' : '.mark-bad'); if (b) b.style.fontWeight = '900';
}

const list = $('#list');
DATA.forEach((g, gi) => {
  const gd = el('section', 'group');
  const head = el('div', 'gh');
  head.appendChild(el('h2', '', g.title));
  head.appendChild(el('span', 'meta', [g.no, g.diff, g.src].filter(Boolean).join('　')));
  gd.appendChild(head);
  if (g.photo) {
    const b = el('button', 'btn', '📷 原卷圖'); const img = el('img', 'photo'); img.hidden = true;
    b.onclick = () => { if (!img.src) img.src = g.photo; img.hidden = !img.hidden; };
    const row = el('div', 'btns'); row.appendChild(b); gd.appendChild(row); gd.appendChild(img);
  }
  g.items.forEach((q, qi) => {
    const id = gi + '-' + qi;
    const qd = el('div', 'q'); qd.dataset.id = id; qd.dataset.kind = q.kind;
    qd.appendChild(el('div', '', `<span class="qlabel">${q.label}</span><span class="tag">${q.kind}</span>`));
    qd.appendChild(el('div', 'stem', q.stem));
    const fb = el('div', 'fb');
    if (q.key) {
      const opts = el('div', 'opts');
      Object.entries(q.opts).forEach(([k, v]) => {
        const o = el('button', 'opt', `<b>(${k})</b> ${v}`);
        o.onclick = () => {
          if (k === q.key) {
            o.classList.add('ok'); fb.className = 'fb ok'; fb.textContent = '答對了！';
            if (!st[id]) mark(qd, id, 'ok');
            const a = qd.querySelector('.box.ans'); if (a.hidden) reveal(qd, 'ans');
          } else {
            o.classList.add('bad'); fb.className = 'fb bad'; fb.textContent = '再想想，或按「看解析」。';
            mark(qd, id, 'bad');
          }
        };
        opts.appendChild(o);
      });
      qd.appendChild(opts);
    }
    qd.appendChild(fb);
    const btns = el('div', 'btns');
    const bs = el('button', 'btn', '💡 看解析'); bs.onclick = () => reveal(qd, 'sol'); btns.appendChild(bs);
    const ba = el('button', 'btn', '✅ 看答案'); ba.onclick = () => reveal(qd, 'ans'); btns.appendChild(ba);
    if (!q.key) {
      const ok = el('button', 'btn mark-ok', '○ 我答對了'); ok.onclick = () => mark(qd, id, 'ok');
      const bad = el('button', 'btn mark-bad', '✗ 我答錯了'); bad.onclick = () => mark(qd, id, 'bad');
      btns.appendChild(ok); btns.appendChild(bad);
    }
    qd.appendChild(btns);
    const sol = el('div', 'box sol', q.sol || '（這題沒有另外的解析）'); sol.hidden = true; qd.appendChild(sol);
    const ans = el('div', 'box ans', q.ans); ans.hidden = true; qd.appendChild(ans);
    if (st[id]) mark(qd, id, st[id]);
    gd.appendChild(qd);
  });
  if (g.extra) {
    const b = el('button', 'btn', '📌 本組重點'); const box = el('div', 'box extra', g.extra); box.hidden = true;
    b.onclick = () => { box.hidden = !box.hidden; if (!box.dataset.ts) { box.dataset.ts = 1; typeset(box); } };
    const row = el('div', 'btns'); row.appendChild(b); gd.appendChild(row); gd.appendChild(box);
  }
  list.appendChild(gd);
});
updateProg(); applyFilter();
document.querySelectorAll('.stem,.opts').forEach(n => n.dataset.ts = 1);
window.addEventListener('load', () => typeset(list));
</script>
