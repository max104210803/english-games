const DATA = [{"title": "第一關　點、直線與圓的位置關係", "no": "", "diff": "", "src": "", "note": "", "photo": null, "extra": "<h3>本關重點<\/h3>\n<p><div class=\"callout tip\"><div class=\"ct\"><p>位置關係只看「距離」和「半徑」<\/p><\/div><ul>\n<li>點與圓：點到圓心的距離 \\(&lt;r\\) 在圓內、\\(=r\\) 在圓上、\\(&gt;r\\) 在圓外。<\/li>\n<li>直線與圓：圓心到直線的距離 \\(&gt;r\\) 不相交、\\(=r\\) 相切、\\(&lt;r\\) 交兩點。<\/li>\n<li>題目給<strong>直徑<\/strong>時，先除以 2。<\/li>\n<\/ul><\/div><\/p>", "items": [{"label": "選擇1", "kind": "選擇", "stem": "<p>有一個直徑為 9 的圓 \\(O\\)。\\(A\\)、\\(B\\)、\\(C\\) 三點到圓心 \\(O\\) 的距離分別是 \\(2\\sqrt{5}\\)、\\(\\sqrt{21}\\)、\\(3\\sqrt{2}\\)，請問有幾個點在圓內？<\/p>", "opts": {"A": "<p>0<\/p>", "B": "<p>1<\/p>", "C": "<p>2<\/p>", "D": "<p>3<\/p>"}, "key": "C", "ans": "<p><strong>(C) 2 個<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>半徑 \\(r=4.5\\)，根號比大小先平方：\\(r^2=20.25\\)。<br />\n- \\((2\\sqrt5)^2=20&lt;20.25\\) → \\(A\\) 在圓內<br />\n- \\((\\sqrt{21})^2=21&gt;20.25\\) → \\(B\\) 在圓外<br />\n- \\((3\\sqrt2)^2=18&lt;20.25\\) → \\(C\\) 在圓內<\/p>"}, {"label": "選擇2", "kind": "選擇", "stem": "<p>坐標平面上，圓 \\(O\\) 的圓心在原點、直徑為 12。下列哪一條直線與圓 \\(O\\) 相切？<\/p>", "opts": {"A": "<p>\\(y=-6\\)<\/p>", "B": "<p>\\(x=12\\)<\/p>", "C": "<p>\\(x=3\\sqrt{2}\\)<\/p>", "D": "<p>\\(x+y=6\\)<\/p>"}, "key": "A", "ans": "<p><strong>(A) \\(y=-6\\)<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>半徑 \\(r=6\\)。直線與圓相切 ⇔ 圓心到直線的距離剛好等於 \\(r\\)。<br />\n- (A) 距離 6，<strong>相切<\/strong>，切點 \\((0,-6)\\)。<br />\n- (B) 距離 12 &gt; 6，不相交。<br />\n- (C) 距離 \\(3\\sqrt2\\approx4.24&lt;6\\)，交於兩點。<br />\n- (D) 直線經過 \\((6,0)\\) 和 \\((0,6)\\)，這兩點都在圓上 → 交於兩點。<\/p>"}, {"label": "選擇3", "kind": "選擇", "stem": "<p>圓 \\(O\\) 的半徑是 6，弦 \\(\\overline{AB}=6\\)，則 \\(\\angle AOB\\) 是幾度？<\/p>", "opts": {"A": "<p>\\(30^\\circ\\)<\/p>", "B": "<p>\\(45^\\circ\\)<\/p>", "C": "<p>\\(60^\\circ\\)<\/p>", "D": "<p>\\(90^\\circ\\)<\/p>"}, "key": "C", "ans": "<p><strong>(C) \\(60^\\circ\\)<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>\\(\\overline{OA}=\\overline{OB}=6\\)（半徑），又 \\(\\overline{AB}=6\\)，三邊都相等 → \\(\\triangle AOB\\) 是正三角形，\\(\\angle AOB=60^\\circ\\)。<\/p>"}]}, {"title": "第二關　切線段", "no": "", "diff": "", "src": "", "note": "", "photo": null, "extra": "<h3>本關重點<\/h3>\n<p><img class=\"fig\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRsa4AABXRUJQVlA4ILq4AADwbwKdASp4BSoCPm02l0ikIyKhI9MpaIANiWVu/ETcPYA1QvgFvFxqmfHLLS36EJbVAjT/53+S7+LXPlv7V/lv+Z/kvfq497Z/dH3n1nf3nfd2V5hHMH/Q/wv5HfNj/M/8j/Le5r9Lf9D8//oB/pv9r/5P+O/zv7KfGJ+4nuX/xP/U/7nsC/o3+M/63+N/f/5f/95+5nuY/uP+k/9v+F/3PyAf1r/Ef8/89fnC/7H//9x3/O/7r//+4J/Qv8f/6vXK/b3/i/KN/ZP99/8v9h/uv///9fsc/pf+K/+P7m////6/QB/9/a1/gH/m9QD1Z+ov9x/r/7F++f4x+mf4L+2/tp/dvTf8W+a/uP9s/yH+1/vXtO/33iP9C/k/95/qfUv+Sfar8x/cP8X/2/77+9/xb/sf8D+SHoX+W/uX+2/x35XfIL+R/zf/Sf3D95f8J8Z/x/+57W3Vf9L/t/7t7Avsx9F/3v94/03/x/0noJ/zv919R/1H+1f6L++fkZ9gP8w/pn+r/vn73/5X/////8I/yX7HeRh9q/1f/H/xv5a/YD/J/6v/xf7//ov2w+mD+V/83+n/3f7s+1n85/zv/j/zP+s/br7Cf5h/ZP+p/iP9D+2nzz//v3Tful///dX/bL//fvANrZZonl2yzRPLtlmideC+o2sJDrrUjYGeW24hT/0694QFW5OQ44edkRTh+nzeKNZfbB7+Bebm1U9FEsJGzhwrTqLcqJTlYnkpxhPix73fumZ9O3v76yhNeaOaa9zroZDukvvD575G4uO139UE/yv1B4UDXuHfDZSO418b/eJwBKK6lAgDgnQT1McvIe0AqLd01NJeme32Wxxl6deieOt0TNPItidv5gUCffTGIH7Ki8bd2ZKwJkyk91q4yaSnaw6fXjxmgos3n2prQw9u5Whh7dytDD27laGHt3K0MPbuVoYe0TmtCkj6J7/trjTwmdSEIdXKtzefVApKRJKI4QQS8ubbQsD7eGzAQgX8FulYVEXaRGQP5+i64UNsI/DkzxoC5p7UwdBhCGSjLkdqCt1GF5oFEgTjZ1R9impDiuGwVdirLxuv0AZLsg9Tb8QJwVR5Wy+EANJo9ygmCTdLL7LlYgb9lD1yYt5SM7c9PTlJDH574N7nTD27laGHt3K0MPbuVoYe3crQw9u5Whh7dytEoATd4luBspSYB5wWRB0eBydHgKsIHLYOjWvSLCBcUT7cQcZQydSJaU9wJfs3R/wxZ6wO76t0HShDk02ayXwcL+K9Vp9kuUo0w9u5Whh7dytDD27laGHt3K0MPbuVoYe3crQw9u5Whh7dvErErYBt8g4VmAbZHcQjb6DCtA3+LZ0LKLvHrs3eBPXzt/22CWMHl1WYOIQxljjrUYYQr4ENj8RYdT3qbmXepnlv7k6IQI0w9u5WOUlcsleQ5SwjTD27laGHt2+F1gAsipT20LAnAmVXr70oGwnbcisKYpVMJvDEwJIqXp5eeGtatPBh6z0hIm9bbehPcLtdXATU7E/BeHUTFGNlD2SIvKA/IZcwDwI0w9uhzTER0OTJi7dYUgr27laGHt3Jw9j7+c8Issu2iWzYKPnE81M8or10AwwHVU76EWlpCHQlgxpGGCFbiLDWn2wGuggaVOeRLS+TL2l2lgKmM/cfI5C15nZgdM3vtHTtPtMNa8GjHB+jKC34Po4Dg4TTJMTelUOlq7ZZonl2gaFV6Vy7t1OlsiZ7C4G9olmEDzDT+Qu7435QGNXQo0M57ujEs8F ine{PC}=\\)____。<\/p>", "opts": {}, "key": "", "ans": "<p><strong>\\(\\overline{PA}=5\\sqrt3\\)，\\(\\overline{PC}=5\\)<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<ol>\n<li>\\(\\overline{PO}\\) 平分 \\(\\angle APB\\) → \\(\\angle APO=30^\\circ\\)；\\(\\angle OAP=90^\\circ\\)，所以 \\(\\triangle OAP\\) 是 30°-60°-90° 三角形。<\/li>\n<li>30° 角的對邊 \\(\\overline{OA}=5\\) → 斜邊 \\(\\overline{OP}=10\\)，\\(\\overline{PA}=5\\sqrt3\\)。<\/li>\n<li>\\(\\overline{PC}=\\overline{OP}-\\overline{OC}=10-5=5\\)。<\/li>\n<\/ol>"}, {"label": "計算1", "kind": "計算", "stem": "<p>\\(\\overline{AB}\\) 是圓 \\(O\\) 的直徑。直線 \\(L\\) 切圓 \\(O\\) 於 \\(A\\)，直線 \\(M\\) 切圓 \\(O\\) 於 \\(B\\)。另一條直線 \\(N\\) 切圓 \\(O\\) 於 \\(C\\)，並分別與 \\(L\\)、\\(M\\) 交於 \\(D\\)、\\(E\\)（\\(D\\)、\\(E\\) 在 \\(\\overline{AB}\\) 的同一側）。若 \\(\\overline{AD}=8\\)、\\(\\overline{BE}=2\\)，求 \\(\\overline{OC}\\)。<\/p>", "opts": {}, "key": "", "ans": "<p><strong>\\(\\overline{OC}=4\\)<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<ol>\n<li>切線段等長：\\(\\overline{DC}=\\overline{DA}=8\\)，\\(\\overline{EC}=\\overline{EB}=2\\)，所以 \\(\\overline{DE}=10\\)。<\/li>\n<li>\\(L\\perp\\overline{AB}\\)、\\(M\\perp\\overline{AB}\\) → \\(L\\parallel M\\)，兩線的距離就是直徑 \\(\\overline{AB}\\)。<\/li>\n<li>從 \\(E\\) 作 \\(L\\) 的垂線，垂足 \\(H\\)：\\(\\overline{EH}=\\overline{AB}\\)，\\(\\overline{DH}=8-2=6\\)。<\/li>\n<li>直角 \\(\\triangle DHE\\)：\\(\\overline{AB}=\\sqrt{10^2-6^2}=8\\)，所以 \\(\\overline{OC}=\\) 半徑 \\(=4\\)。<\/li>\n<\/ol>"}]}, {"title": "第三關　弦與弦心距", "no": "", "diff": "", "src": "", "note": "", "photo": null, "extra": "<h3>本關重點<\/h3>\n<p><img class=\"fig\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRgbaAABXRUJQVlA4IPrZAAAQ0QKdASp4BXcCPm02l0ikIyIiJBNpUIANiWVu/FPiBMW+aPRKXycvHCOn+w/u/fxx35Y/Kf3v8h/fb457Nvdf3L/K+9l++7su0fMm5v/8v+N/M/5of6D/2/6H/PfBH+m/5v/pf479///X9gP9J/q//U/wX+q+FP/T/bH3R/37/of8T9kv//8gv6D/iv/Z/p/d+/437ee5n/A/7r9of9l8gH9l/yn/t9s3/q//f3G/9F/y///7hP9F/1X/g9oD/o/t5/2PlA/sX+//b3/Z/Ip/S/8h/6/3C////r+gD/6+1f/AP/r6gHqv9Jv7J/aP1999Xxn9G/vn9x/a3+6emv4j8y/df7Z+2X9v9nb/B8QHoH8T/ 5j9Ps1GcVuZUh812toYg/0tSKq8zeZ0MAAAAA==\" alt=\"\"><\/p>", "items": [{"label": "選擇6", "kind": "選擇", "stem": "<p>一個側面是半圓形的碗裝了水，水面寬 24 公分，水最深的地方是 8 公分。倒掉一些水，使水面下降 7 公分後，水面寬是多少公分？<\/p>", "opts": {"A": "<p>8<\/p>", "B": "<p>10<\/p>", "C": "<p>12<\/p>", "D": "<p>14<\/p>"}, "key": "B", "ans": "<p><strong>(B) 10<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<ol>\n<li>設半徑 \\(r\\)，圓心到水面的距離（弦心距）\\(=r-8\\)，半個水面寬 \\(=12\\)。<\/li>\n<li>畢氏定理：\\(r^2=12^2+(r-8)^2\\) → \\(0=144-16r+64\\) → \\(r=13\\)，弦心距 \\(=5\\)。<\/li>\n<li>水面下降 7 公分：弦心距變成 \\(5+7=12\\)。<\/li>\n<li>半個水面寬 \\(=\\sqrt{13^2-12^2}=5\\) → 水面寬 \\(=10\\) 公分。<\/li>\n<\/ol>"}, {"label": "選擇7", "kind": "選擇", "stem": "<p>兩個同心圓，大圓的弦 \\(\\overline{AD}\\) 與小圓交於 \\(B\\)、\\(C\\) 兩點（依序為 \\(A\\)、\\(B\\)、\\(C\\)、\\(D\\)）。若 \\(\\overline{AD}=20\\)、\\(\\overline{BC}=12\\)，兩圓之間的圓環面積是多少？<\/p>", "opts": {"A": "<p>\\(16\\pi\\)<\/p>", "B": "<p>\\(36\\pi\\)<\/p>", "C": "<p>\\(48\\pi\\)<\/p>", "D": "<p>\\(64\\pi\\)<\/p>"}, "key": "D", "ans": "<p><strong>(D) \\(64\\pi\\)<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>作 \\(\\overline{OM}\\perp\\overline{AD}\\)，\\(M\\) 同時是 \\(\\overline{AD}\\) 和 \\(\\overline{BC}\\) 的中點：\\(\\overline{AM}=10\\)、\\(\\overline{BM}=6\\)。<br />\n設弦心距 \\(\\overline{OM}=d\\)，大圓半徑 \\(R\\)、小圓半徑 \\(r\\)：<br />\n\\(R^2=d^2+10^2\\)，\\(r^2=d^2+6^2\\)，相減 \\(R^2-r^2=100-36=64\\)。<br />\n圓環面積 \\(=\\pi R^2-\\pi r^2=64\\pi\\)（不必知道 \\(d\\)）。<\/p>"}, {"label": "選擇8", "kind": "選擇", "stem": "<p>下列哪一種作法，一定能找出一個圓的圓心？<\/p>", "opts": {"A": "<p>在圓上任取兩條不平行的弦，作出兩條弦的中垂線，取交點<\/p>", "B": "<p>在圓上任取一條弦，取它的中點<\/p>", "C": "<p>在圓上任取兩條有共同端點的弦，作兩弦夾角的角平分線，取它和圓的交點<\/p>", "D": "<p>在圓上任取一條弦，從它的中點任意畫一條直線<\/p>"}, "key": "A", "ans": "<p><strong>(A)<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>弦的中垂線一定通過圓心，所以兩條不平行弦的中垂線交點就是圓心。<br />\n(B) 弦的中點只有在弦是直徑時才是圓心；(C) 兩弦夾角的平分線只有兩弦等長時才過圓心，而且它和圓的交點在圓上，不會是圓心；(D) 任意直線不一定過圓心。<\/p>"}, {"label": "填充3", "kind": "填充", "stem": "<p>圓 \\(O\\) 的半徑是 13，\\(P\\) 是圓內一點，\\(\\overline{OP}=5\\)。過 \\(P\\) 點的弦中，最短的弦長是____，最長的弦長是____。<\/p>", "opts": {}, "key": "", "ans": "<p><strong>最短 24，最長 26<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<ul>\n<li>最長：過 \\(P\\) 的直徑 \\(=26\\)。<\/li>\n<li>最短：弦心距愈大弦愈短，過 \\(P\\) 的弦弦心距最大是 \\(\\overline{OP}=5\\)（弦 ⊥ \\(\\overline{OP}\\) 時）。半弦 \\(=\\sqrt{13^2-5^2}=12\\) → 最短弦 \\(=24\\)。<\/li>\n<\/ul>"}, {"label": "填充4", "kind": "填充", "stem": "<p>一圓的直徑是 50，\\(\\overline{AB}\\)、\\(\\overline{CD}\\) 是兩條互相平行的弦。若 \\(\\overline{AB}=48\\)、\\(\\overline{CD}=14\\)，則兩弦的距離是____或____。<\/p>", "opts": {}, "key": "", "ans": "<p><strong>17 或 31<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>半徑 25。<br />\n- \\(\\overline{AB}=48\\)：弦心距 \\(=\\sqrt{25^2-24^2}=7\\)<br />\n- \\(\\overline{CD}=14\\)：弦心距 \\(=\\sqrt{25^2-7^2}=24\\)<br />\n- 兩弦在圓心同側：\\(24-7=17\\)；異側：\\(24+7=31\\)。<\/p>"}, {"label": "計算2", "kind": "計算", "stem": "<p>坐標平面上，圓 \\(Q\\) 的圓心在第一象限，圓 \\(Q\\) 與 \\(x\\) 軸相切，並與 \\(y\\) 軸交於 \\(B(0,2)\\)、\\(C(0,18)\\) 兩點。求：(1) 圓 \\(Q\\) 的半徑；(2) \\(Q\\) 點坐標。<\/p>", "opts": {}, "key": "", "ans": "<p><strong>(1) 10　(2) \\(Q(6,10)\\)<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<ol>\n<li>作 \\(\\overline{QM}\\perp\\overline{BC}\\)，\\(M\\) 是弦 \\(\\overline{BC}\\) 的中點：\\(M\\left(0,\\dfrac{2+18}{2}\\right)=(0,10)\\)，所以 \\(Q\\) 的 \\(y\\) 坐標是 10。<\/li>\n<li>圓與 \\(x\\) 軸相切 → 半徑 \\(=Q\\) 到 \\(x\\) 軸的距離 \\(=10\\)。<\/li>\n<li>\\(\\overline{BM}=10-2=8\\)，\\(\\overline{QB}=10\\) → \\(\\overline{QM}=\\sqrt{10^2-8^2}=6\\)。<\/li>\n<li>圓心在第一象限 → \\(Q(6,10)\\)。<\/li>\n<\/ol>"}]}, {"title": "第四關　扇形、弓形與活動範圍", "no": "", "diff": "", "src": "", "note": "", "photo": null, "extra": "<h3>本關重點<\/h3>\n<p><div class=\"callout tip\"><div class=\"ct\"><p>拴狗題三步驟<\/p><\/div><ol>\n<li>先畫以頂點為圓心的主扇形（被擋住的角要扣掉）。<\/li>\n<li>繩子沿每一條邊走，若比邊長還長，就在下一個頂點用「剩下的繩長」畫新扇形。<\/li>\n<li>比邊短就停在那邊，不用加。<\/li>\n<\/ol><\/div><\/p>", "items": [{"label": "填充5", "kind": "填充", "stem": "<p>一個扇形的半徑是 6 公分，周長是 \\((2\\pi+12)\\) 公分，它的圓心角是____度。<\/p>", "opts": {}, "key": "", "ans": "<p><strong>60<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<p>扇形周長 = 兩條半徑 + 弧長：\\(2\\pi+12=6+6+\\text{弧長}\\) → 弧長 \\(=2\\pi\\)。<br />\n整圓周長 \\(2\\pi\\times6=12\\pi\\)，弧長占 \\(\\dfrac{2\\pi}{12\\pi}=\\dfrac16\\) → 圓心角 \\(=360^\\circ\\times\\dfrac16=60^\\circ\\)。<\/p>"}, {"label": "填充6", "kind": "填充", "stem": "<p>圓 \\(O\\) 的半徑是 4 公分，菱形 \\(OABC\\) 的 \\(A\\)、\\(B\\)、\\(C\\) 三點都在圓 \\(O\\) 上。由弦 \\(\\overline{AB}\\) 和弧 \\(AB\\)（較短的那段）圍成的弓形，周長是____公分，面積是____平方公分。<\/p>", "opts": {}, "key": "", "ans": "<p><strong>周長 \\(\\dfrac43\\pi+4\\)，面積 \\(\\dfrac83\\pi-4\\sqrt3\\)<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<ol>\n<li>\\(\\overline{OA}=\\overline{AB}=4\\)（菱形四邊等長），\\(\\overline{OB}=4\\)（半徑）→ \\(\\triangle OAB\\) 是正三角形，\\(\\angle AOB=60^\\circ\\)。<\/li>\n<li>弓形周長 \\(=\\) 弧 \\(AB\\) ＋ 弦 \\(AB=2\\pi\\times4\\times\\dfrac16+4=\\dfrac{4}{3}\\pi+4\\)。<\/li>\n<li>弓形面積 \\(=\\) 扇形 \\(-\\) 正三角形 \\(=\\pi\\times4^2\\times\\dfrac16-\\dfrac{\\sqrt3}{4}\\times4^2=\\dfrac{8}{3}\\pi-4\\sqrt3\\)。<\/li>\n<\/ol>"}, {"label": "計算3", "kind": "計算", "stem": "<p>一塊長 12 公尺、寬 5 公尺的長方形花圃用籬笆圍住。在花圃的一個頂點 \\(P\\) 用 8 公尺長的繩子拴一隻狗，狗不能進入花圃。這隻狗可以活動的區域面積是多少平方公尺？<\/p>", "opts": {}, "key": "", "ans": "<p><strong>\\(\\dfrac{201}{4}\\pi\\) 平方公尺<\/strong><\/p>", "sol": "<h3>解析<\/h3>\n<ol>\n<li>以 \\(P\\) 為圓心、半徑 8 的圓，扣掉花圃那一角 → \\(\\dfrac34\\) 圓：\\(\\pi\\times8^2\\times\\dfrac34=48\\pi\\)。<\/li>\n<li>繩子沿<strong>短邊（5 公尺）<\/strong>繞過下一個頂點，還剩 \\(8-5=3\\) 公尺 → 多一個半徑 3 的 \\(\\dfrac14\\) 圓：\\(\\pi\\times3^2\\times\\dfrac14=\\dfrac94\\pi\\)。<\/li>\n<li>沿<strong>長邊（12 公尺）<\/strong>走不到下一個頂點（繩長 8 &lt; 12），沒有多出的區域。<\/li>\n<li>總面積 \\(=48\\pi+\\dfrac94\\pi=\\dfrac{201}{4}\\pi\\) 平方公尺。<\/li>\n<\/ol>"}]}];
const KEY = 'mq-g9-circle';
let st = {};
try { st = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const typeset = (node) => { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([node]).catch(() => {}); };

const themeBtn = $('#theme');
const paintTheme = () => { themeBtn.textContent = document.documentElement.dataset.theme === 'dark' ? '☀ 淺色' : '🌙 深色'; };
themeBtn.onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('deck-theme', r.dataset.theme); } catch (e) {} paintTheme(); };
paintTheme();

let filter = '全部';
const kinds = ['全部', ...new Set(DATA.flatMap(g => g.items.map(q => q.kind)))];
const bar = $('#bar');
[...kinds, '只看錯題'].forEach(k => {
  const b = el('button', 'chip' + (k === filter ? ' on' : ''), k);
  b.onclick = () => { filter = k; bar.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); applyFilter(); };
  bar.appendChild(b);
});
const reset = el('button', 'chip', '清除紀錄');
reset.onclick = () => { if (confirm('清除這一頁的作答紀錄？')) { st = {}; save(); location.reload(); } };
bar.appendChild(reset);
const prog = el('span', 'prog'); bar.appendChild(prog);

function updateProg() {
  const all = DATA.flatMap((g, gi) => g.items.map((q, qi) => gi + '-' + qi));
  const done = all.filter(id => st[id]).length, bad = all.filter(id => st[id] === 'bad').length;
  prog.innerHTML = `已作答 ${done} / ${all.length}　<span class="wrong-dot">錯 ${bad}</span>`;
}

function applyFilter() {
  let shown = 0;
  document.querySelectorAll('.group').forEach(g => {
    let any = false;
    g.querySelectorAll('.q').forEach(q => {
      const ok = filter === '全部' || (filter === '只看錯題' ? st[q.dataset.id] === 'bad' : q.dataset.kind === filter);
      q.hidden = !ok; any = any || ok;
    });
    g.hidden = !any; if (any) shown++;
  });
  $('#empty') && $('#empty').remove();
  if (!shown) $('#list').appendChild(el('div', 'empty', filter === '只看錯題' ? '目前沒有錯題 🎉' : '沒有符合的題目'));
  const e = $('.empty'); if (e) e.id = 'empty';
}

function reveal(qd, which) {
  const box = qd.querySelector('.box.' + which);
  if (box) { box.hidden = !box.hidden; if (!box.dataset.ts) { box.dataset.ts = 1; typeset(box); } }
}

function mark(qd, id, v) {
  st[id] = v; save(); updateProg();
  qd.querySelectorAll('.mark-ok,.mark-bad').forEach(b => b.style.fontWeight = '400');
  const b = qd.querySelector(v === 'ok' ? '.mark-ok' : '.mark-bad'); if (b) b.style.fontWeight = '900';
}

const list = $('#list');
DATA.forEach((g, gi) => {
  const gd = el('section', 'group');
  const head = el('div', 'gh');
  head.appendChild(el('h2', '', g.title));
  head.appendChild(el('span', 'meta', [g.no, g.diff, g.src].filter(Boolean).join('　')));
  gd.appendChild(head);
  if (g.photo) {
    const b = el('button', 'btn', '📷 原卷圖'); const img = el('img', 'photo'); img.hidden = true;
    b.onclick = () => { if (!img.src) img.src = g.photo; img.hidden = !img.hidden; };
    const row = el('div', 'btns'); row.appendChild(b); gd.appendChild(row); gd.appendChild(img);
  }
  g.items.forEach((q, qi) => {
    const id = gi + '-' + qi;
    const qd = el('div', 'q'); qd.dataset.id = id; qd.dataset.kind = q.kind;
    qd.appendChild(el('div', '', `<span class="qlabel">${q.label}</span><span class="tag">${q.kind}</span>`));
    qd.appendChild(el('div', 'stem', q.stem));
    const fb = el('div', 'fb');
    if (q.key) {
      const opts = el('div', 'opts');
      Object.entries(q.opts).forEach(([k, v]) => {
        const o = el('button', 'opt', `<b>(${k})</b> ${v}`);
        o.onclick = () => {
          if (k === q.key) {
            o.classList.add('ok'); fb.className = 'fb ok'; fb.textContent = '答對了！';
            if (!st[id]) mark(qd, id, 'ok');
            const a = qd.querySelector('.box.ans'); if (a.hidden) reveal(qd, 'ans');
          } else {
            o.classList.add('bad'); fb.className = 'fb bad'; fb.textContent = '再想想，或按「看解析」。';
            mark(qd, id, 'bad');
          }
        };
        opts.appendChild(o);
      });
      qd.appendChild(opts);
    }
    qd.appendChild(fb);
    const btns = el('div', 'btns');
    const bs = el('button', 'btn', '💡 看解析'); bs.onclick = () => reveal(qd, 'sol'); btns.appendChild(bs);
    const ba = el('button', 'btn', '✅ 看答案'); ba.onclick = () => reveal(qd, 'ans'); btns.appendChild(ba);
    if (!q.key) {
      const ok = el('button', 'btn mark-ok', '○ 我答對了'); ok.onclick = () => mark(qd, id, 'ok');
      const bad = el('button', 'btn mark-bad', '✗ 我答錯了'); bad.onclick = () => mark(qd, id, 'bad');
      btns.appendChild(ok); btns.appendChild(bad);
    }
    qd.appendChild(btns);
    const sol = el('div', 'box sol', q.sol || '（這題沒有另外的解析）'); sol.hidden = true; qd.appendChild(sol);
    const ans = el('div', 'box ans', q.ans); ans.hidden = true; qd.appendChild(ans);
    if (st[id]) mark(qd, id, st[id]);
    gd.appendChild(qd);
  });
  if (g.extra) {
    const b = el('button', 'btn', '📌 本組重點'); const box = el('div', 'box extra', g.extra); box.hidden = true;
    b.onclick = () => { box.hidden = !box.hidden; if (!box.dataset.ts) { box.dataset.ts = 1; typeset(box); } };
    const row = el('div', 'btns'); row.appendChild(b); gd.appendChild(row); gd.appendChild(box);
  }
  list.appendChild(gd);
});
updateProg(); applyFilter();
document.querySelectorAll('.stem,.opts').forEach(n => n.dataset.ts = 1);
window.addEventListener('load', () => typeset(list));
</script>
</body>
