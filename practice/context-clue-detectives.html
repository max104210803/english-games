g, and laughed<\/i>，都是有活力、熱鬧的樣子。", "elim": "(A)(B) 和跳舞大笑相反；(C) 句子沒有危險。"}, {"id": "12", "part": 2, "word": "eerie", "ext": false, "sentence": "The empty, dark street felt <u>eerie<\/u>; it was so strange and quiet that it made the hair on my arms stand up.", "steps": [{"q": "What does the word <i>eerie<\/i> mean in this sentence?", "options": ["Bright, cheerful, and full of people", "Crowded and noisy", "Strange and a little scary", "Warm and cozy"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>eerie<\/i>?", "options": ["\"The empty, dark street\"", "\"so strange and quiet\"", "\"felt\"", "\"my arms\""], "answer": 1}], "zh": "空蕩蕩又暗暗的街道讓人覺得毛毛的；它奇怪又安靜，讓我手臂上的汗毛都豎起來了。", "clue": "<i>strange<\/i> 是同義線索，<i>the hair … stand up<\/i>（寒毛豎起）是害怕的反應。", "elim": "(A)(D) 和 dark、害怕相反；(B) 和 <i>empty<\/i>、<i>quiet<\/i> 相反。"}, {"id": "13", "part": 2, "word": "set", "ext": false, "sentence": "In summer the Sun does not <u>set<\/u> for weeks; it never goes down below the edge of the sky, even at midnight.", "steps": [{"q": "What does the word <i>set<\/i> mean in this sentence?", "options": ["To rise up in the morning", "To shine very brightly", "To put something on a table for dinner", "To go down and disappear from the sky"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>set<\/i>?", "options": ["\"for weeks\"", "\"In summer the Sun\"", "\"even at midnight\"", "\"never goes down\""], "answer": 3}], "zh": "夏天時，太陽好幾個星期都不會落下；它從來不會沉到天邊下面，連半夜也一樣。", "clue": "分號後面把 <i>does not set<\/i> 換句話說成 <i>never goes down<\/i>。", "elim": "(C) set 也有「擺放」的意思，但主詞是 <i>the Sun<\/i>；(A) 日出是 rise，相反；(B) 說不通。"}]}, {"code": "sea", "title": "Into the Sea", "unit": "U4 W2", "parts": ["Part 1　什麼是侵蝕", "Part 2　海灘與懸崖", "Part 3　保護海岸"], "items": [{"id": "1", "part": 0, "word": "erosion", "ext": false, "sentence": "<u>Erosion<\/u> happens when wind and water slowly wear away rock and soil and carry it to a new place.", "steps": [{"q": "What does the word <i>erosion<\/i> mean in this sentence?", "options": ["A big earthquake that suddenly shakes and cracks the land", "The slow wearing away of land by wind and water", "Building a sand castle", "A kind of storm cloud"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>erosion<\/i>?", "options": ["\"when wind and water slowly wear away rock and soil\"", "\"to a new place\"", "\"happens\"", "\"a new\""], "answer": 0}], "zh": "當風和水慢慢磨掉岩石和土壤，再把它們帶到新的地方，侵蝕就發生了。", "clue": "<i>happens when …<\/i> 後面說明侵蝕的過程：<i>slowly wear away<\/i>。", "elim": "(A) 地震很突然，不是 <i>slowly<\/i>；(C)(D) 不是風和水造成的。"}, {"id": "2", "part": 0, "word": "gradually", "ext": true, "sentence": "The waves wash the beach away <u>gradually<\/u>, a little bit each day, so people hardly notice the change until years later.", "steps": [{"q": "What does the word <i>gradually<\/i> mean in this sentence?", "options": ["All at once, in a single day", "Very loudly", "Never", "Slowly, little by little"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>gradually<\/i>?", "options": ["\"a little bit each day\"", "\"The waves wash the beach away\"", "\"the beach\"", "\"the change\""], "answer": 0}], "zh": "海浪一點一點地把海灘沖走，每天只沖走一點，所以大家要等到好幾年後才會發現有變化。", "clue": "逗號後面 <i>a little bit each day<\/i> 換句話說；<i>hardly notice … until years later<\/i> 也支持「很慢」。", "elim": "(A) 一下子全沖走，大家馬上就會發現；(B)(C) 說不通。"}, {"id": "3", "part": 0, "word": "active", "ext": false, "sentence": "The ocean is always <u>active<\/u>; its waves keep moving onto the shore day and night and never take a rest.", "steps": [{"q": "What does the word <i>active<\/i> mean in this sentence?", "options": ["Always moving or doing something", "Calm and still, like a quiet lake", "Frozen solid", "Empty and dry"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>active<\/i>?", "options": ["\"onto the shore\"", "\"The ocean is always\"", "\"the shore\"", "\"keep moving\""], "answer": 3}], "zh": "海洋總是很活躍；它的浪日日夜夜不停地打上岸，從來不休息。", "clue": "分號後面 <i>keep moving<\/i>、<i>never take a rest<\/i> 說明一直在動。", "elim": "(B) 和 <i>never take a rest<\/i> 相反；(C)(D) 海浪不會結冰或乾掉。"}, {"id": "4", "part": 0, "word": "explode", "ext": false, "sentence": "During the storm, giant waves <u>explode<\/u> against the rocks, bursting into a million drops of white spray with a loud boom.", "steps": [{"q": "What does the word <i>explode<\/i> mean in this sentence?", "options": ["To sleep quietly", "To freeze into ice", "To shrink slowly into tiny drops", "To burst suddenly and loudly"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>explode<\/i>?", "options": ["\"During the storm, giant waves\"", "\"giant waves\"", "\"bursting into a million drops\"", "\"the rocks\""], "answer": 2}], "zh": "暴風雨時，巨浪撞上岩石炸開，轟的一聲碎成無數白色水花。", "clue": "逗號後面 <i>bursting into a million drops … with a loud boom<\/i>，炸開＋巨響。", "elim": "(A)(C) 和 <i>loud boom<\/i> 相反；(B) 浪變成的是水花，不是冰。"}, {"id": "5", "part": 1, "word": "disappears", "ext": false, "sentence": "Each year the beach <u>disappears<\/u> a little more; where there used to be wide sand, now there is only water.", "steps": [{"q": "What does the word <i>disappears<\/i> mean in this sentence?", "options": ["Grows bigger and wider every single year", "Becomes cleaner", "Goes away and can no longer be seen", "Gets warmer"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>disappears<\/i>?", "options": ["\"Each year\"", "\"a little more\"", "\"the beach\"", "\"where there used to be wide sand, now there is only water\""], "answer": 3}], "zh": "海灘每年都消失一點；以前有寬廣沙灘的地方，現在只剩下水。", "clue": "分號後面用 <i>used to be … now there is only<\/i> 對比以前和現在：沙不見了。dis-（相反）＋ appear（出現）。", "elim": "(A) 相反；(B)(D) 句子說的是沙灘「不見了」。"}, {"id": "6", "part": 1, "word": "steep", "ext": false, "sentence": "The path to the top of the cliff is so <u>steep<\/u> that you have to use your hands to climb; it goes almost straight up.", "steps": [{"q": "What does the word <i>steep<\/i> mean in this sentence?", "options": ["Rising sharply, almost straight up", "Flat and smooth, so it is easy to walk on", "Wide and long", "Wet and muddy"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>steep<\/i>?", "options": ["\"The path\"", "\"to the top of the cliff\"", "\"is so\"", "\"almost straight up\""], "answer": 3}], "zh": "通往懸崖頂端的小路非常陡，你得用手才爬得上去；它幾乎是垂直往上的。", "clue": "分號後面 <i>goes almost straight up<\/i> 直接描述；<i>use your hands to climb<\/i> 也是結果線索。", "elim": "(B) 平的路不用手爬；(C)(D) 和「往上爬」無關。"}, {"id": "7", "part": 1, "word": "crumble", "ext": false, "sentence": "Old cookies <u>crumble<\/u> when you squeeze them, and old cliffs do too; they break into small pieces and fall into the sea.", "steps": [{"q": "What does the word <i>crumble<\/i> mean in this sentence?", "options": ["To become harder", "To break into small pieces", "To grow bigger", "To float on the water like a boat"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>crumble<\/i>?", "options": ["\"Old cookies\"", "\"when you squeeze them\"", "\"small pieces\"", "\"old cliffs do too\""], "answer": 2}], "zh": "舊餅乾一捏就碎掉，舊的懸崖也一樣；它們碎成小塊，掉進海裡。", "clue": "分號後面 <i>break into small pieces<\/i> 換句話說 crumble；拿餅乾當例子幫你想像。", "elim": "(A)(C) 相反；(D) 碎石會掉下去，不會浮起來。"}, {"id": "8", "part": 1, "word": "solid", "ext": false, "sentence": "Unlike soft sand, rock is <u>solid<\/u>; it is hard and firm, so it takes waves thousands of years to wear it away.", "steps": [{"q": "What does the word <i>solid<\/i> mean in this sentence?", "options": ["Soft and loose", "Wet and cold", "Colorful and shiny", "Hard and firm"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>solid<\/i>?", "options": ["\"thousands of years\"", "\"rock is\"", "\"hard and firm\"", "\"to wear it away\""], "answer": 2}], "zh": "跟鬆軟的沙不一樣，岩石很堅固；它又硬又結實，所以海浪要花好幾千年才磨得掉。", "clue": "分號後面 <i>hard and firm<\/i> 直接解釋；開頭 <i>Unlike soft sand<\/i> 是對比線索。", "elim": "(A) 是 sand 的樣子，被 <i>Unlike<\/i> 否定了；(B)(C) 句子沒提到。"}, {"id": "9", "part": 2, "word": "local", "ext": false, "sentence": "The <u>local<\/u> people, the families who live in this small beach town, meet every month to talk about how to save their beach.", "steps": [{"q": "What does the word <i>local<\/i> mean in this sentence?", "options": ["Visiting from a faraway country for a holiday", "Famous around the world", "Very young", "Living in or belonging to a nearby area"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>local<\/i>?", "options": ["\"the families who live\"", "\"meet every month to talk about\"", "\"save their beach\"", "\"to talk about\""], "answer": 0}], "zh": "當地人，也就是住在這個海邊小鎮的家庭，每個月聚會討論怎麼保護他們的海灘。", "clue": "同位語 <i>the families who live in this small beach town<\/i> 說明 local＝住在這裡的。", "elim": "(A) 相反；(B)(C) 句子沒提到。"}, {"id": "10", "part": 2, "word": "communities", "ext": false, "sentence": "Many beach <u>communities<\/u>, towns where people live, work, and help one another, are building walls to protect their homes.", "steps": [{"q": "What does the word <i>communities<\/i> mean in this sentence?", "options": ["Kinds of fish", "Big ships that carry heavy rocks and sand across the sea", "Towns or groups of people who live in the same area", "Sand castles"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>communities<\/i>?", "options": ["\"Many beach\"", "\"towns where people live\"", "\"are building walls to protect their homes\"", "\"their homes\""], "answer": 1}], "zh": "許多海邊社區，也就是人們一起生活、工作、互相幫忙的城鎮，正在蓋牆保護家園。", "clue": "同位語 <i>towns where people live, work, and help one another<\/i> 直接下定義。", "elim": "(A)(B)(D) 都不會「蓋牆保護家園」。"}, {"id": "11", "part": 2, "word": "boulders", "ext": false, "sentence": "Workers used a crane to lift the <u>boulders<\/u>, rocks so big and heavy that ten people could not move one.", "steps": [{"q": "What does the word <i>boulders<\/i> mean in this sentence?", "options": ["Very large rocks", "Small pebbles", "Bags filled with wet sand", "Sea shells"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>boulders<\/i>?", "options": ["\"Workers used a crane\"", "\"to lift\"", "\"used\"", "\"rocks so big and heavy\""], "answer": 3}], "zh": "工人用起重機吊起巨石，那些石頭又大又重，十個人都搬不動一塊。", "clue": "同位語 <i>rocks so big and heavy …<\/i> 下定義；要用 <i>crane<\/i>（起重機）也表示很重。", "elim": "(B) 小石頭不用起重機；(C)(D) 不是 rocks。"}, {"id": "12", "part": 2, "word": "protect", "ext": true, "sentence": "The sea wall <u>protects<\/u> the houses by keeping the strong waves from reaching them, just like an umbrella keeps you dry.", "steps": [{"q": "What does the word <i>protects<\/i> mean in this sentence?", "options": ["Destroys", "Paints in bright colors", "Sells", "Keeps safe from harm"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>protects<\/i>?", "options": ["\"The sea wall\"", "\"keeping the strong waves from reaching them\"", "\"the houses\"", "\"just like\""], "answer": 1}], "zh": "海堤保護房子，擋住強浪不讓浪打到它們，就像雨傘讓你保持乾爽一樣。", "clue": "<i>by<\/i>＋方法：<i>keeping the strong waves from reaching them<\/i>；雨傘的比喻也是線索。", "elim": "(A) 相反；(B)(C) 擋不住海浪。"}]}, {"code": "newyear", "title": "Happy New Year!", "unit": "U4 W3", "parts": ["Part 1　美國的跨年夜", "Part 2　到中國過新年", "Part 3　舞獅與元宵節"], "items": [{"id": "1", "part": 0, "word": "wonder", "ext": false, "sentence": "I <u>wonder<\/u> how people in other countries celebrate the New Year; I want to know if they also have fireworks.", "steps": [{"q": "What does the word <i>wonder<\/i> mean in this sentence?", "options": ["To be completely sure about something", "To want to know about something", "To forget something", "To dislike something"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>wonder<\/i>?", "options": ["\"I want to know\"", "\"people in other countries\"", "\"fireworks\"", "\"if they also\""], "answer": 0}], "zh": "我很好奇其他國家的人怎麼慶祝新年；我想知道他們是不是也放煙火。", "clue": "分號後面 <i>I want to know<\/i> 換句話說 wonder。", "elim": "(A) 確定了就不會想知道；(C)(D) 說不通。"}, {"id": "2", "part": 0, "word": "parade", "ext": false, "sentence": "The <u>parade<\/u> moved slowly down Main Street, with bands playing music, dancers in bright clothes, and huge balloons floating above the crowd.", "steps": [{"q": "What does the word <i>parade<\/i> mean in this sentence?", "options": ["A quiet family dinner", "A sports game played in a big stadium in front of a crowd", "A school test", "A line of people moving along a street to celebrate"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>parade<\/i>?", "options": ["\"above the crowd\"", "\"slowly\"", "\"moved slowly down Main Street, with bands playing music\"", "\"Main Street\""], "answer": 2}], "zh": "遊行隊伍沿著大街慢慢前進，有樂隊演奏、穿著鮮豔衣服的舞者，還有飄在人群上方的大氣球。", "clue": "<i>moved … down Main Street<\/i>（沿街前進）＋ <i>bands playing music<\/i>（樂隊），就是遊行。", "elim": "(A) 安靜和樂隊不合；(B)(C) 不會沿著街道走。"}, {"id": "3", "part": 0, "word": "surrounded", "ext": false, "sentence": "At the party we were <u>surrounded<\/u> by friends; they stood all around us in a big circle, laughing and singing.", "steps": [{"q": "What does the word <i>surrounded<\/i> mean in this sentence?", "options": ["All alone", "Lost and afraid", "Having people or things all around you", "Hidden under something so nobody can see you"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>surrounded<\/i>?", "options": ["\"At the party we were\"", "\"all around us\"", "\"laughing and singing\"", "\"by friends\""], "answer": 1}], "zh": "在派對上，我們被朋友圍繞；他們圍成一個大圓圈站在我們四周，又笑又唱。", "clue": "分號後面 <i>all around us in a big circle<\/i> 描述「圍住」的樣子。", "elim": "(A) 相反；(B)(D) 和朋友圍著唱歌的開心畫面不合。"}, {"id": "4", "part": 0, "word": "countdown", "ext": true, "sentence": "Everyone shouted the <u>countdown<\/u> together, \"Ten, nine, eight, seven,\" counting backward to zero until the new year began.", "steps": [{"q": "What does the word <i>countdown<\/i> mean in this sentence?", "options": ["A song about the new year", "A firework that falls down slowly from the sky after it explodes", "A gift for the new year", "Counting numbers backward to zero before something starts"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>countdown<\/i>?", "options": ["\"Everyone shouted\"", "\"counting backward\"", "\"the new year began\"", "\"together\""], "answer": 1}], "zh": "大家一起大喊倒數：「十、九、八、七」，一路倒數到零，新年就開始了。", "clue": "<i>counting backward to zero<\/i> 直接說明；例子 <i>Ten, nine, eight, seven<\/i> 也是線索。複合字：count（數）＋ down（往下）。", "elim": "(B) 只看到 down 就猜「往下掉」是陷阱；(A)(C) 不是在數數。"}, {"id": "5", "part": 0, "word": "sprinkled", "ext": false, "sentence": "Tiny lights <u>sprinkled<\/u> down from the fireworks, falling softly in little drops like sugar on a cake.", "steps": [{"q": "What does the word <i>sprinkled<\/i> mean in this sentence?", "options": ["Flew straight up", "Fell in small drops or bits", "Exploded very loudly over the city", "Stayed in one place"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>sprinkled<\/i>?", "options": ["\"Tiny lights\"", "\"from the fireworks\"", "\"little drops\"", "\"down\""], "answer": 2}], "zh": "細小的光點從煙火上灑落，像蛋糕上撒的糖粉一樣，一小點一小點輕輕落下。", "clue": "<i>falling softly in little drops<\/i> 說明動作；比喻 <i>like sugar on a cake<\/i> 幫你想像「撒」的樣子。", "elim": "(A) 和 <i>down<\/i> 相反；(C) 和 <i>softly<\/i> 相反；(D) 光點在往下落。"}, {"id": "6", "part": 1, "word": "lasts", "ext": false, "sentence": "Chinese New Year <u>lasts<\/u> fifteen days; the celebration goes on for more than two weeks, not just one night.", "steps": [{"q": "What does the word <i>lasts<\/i> mean in this sentence?", "options": ["Ends very quickly, after only one night", "Begins", "Costs money", "Continues for a period of time"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>lasts<\/i>?", "options": ["\"Chinese New Year\"", "\"not just\"", "\"goes on for\"", "\"one night\""], "answer": 2}], "zh": "中國新年持續十五天；慶祝活動進行超過兩個星期，不是只有一個晚上。", "clue": "分號後面用 <i>goes on for<\/i> 換句話說 lasts。", "elim": "(A) 和 <i>fifteen days<\/i> 矛盾；(B)(C) 說不通。last 也有「最後的」意思，這裡是動詞「持續」。"}, {"id": "7", "part": 1, "word": "customs", "ext": false, "sentence": "Giving red envelopes and eating dumplings are old <u>customs<\/u>; families have done these things in the same way for hundreds of years.", "steps": [{"q": "What does the word <i>customs<\/i> mean in this sentence?", "options": ["Kinds of food", "Usual ways of doing things that people have followed for a long time", "New toys for children", "Money that you pay to the government when you bring things into a country"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>customs<\/i>?", "options": ["\"are old\"", "\"families have\"", "\"families have done these things in the same way for hundreds of years\"", "\"of years\""], "answer": 2}], "zh": "發紅包和吃餃子是古老的習俗；家家戶戶好幾百年來都用同樣的方式做這些事。", "clue": "分號後面 <i>done these things in the same way for hundreds of years<\/i>，長久以來一直這樣做，就是習俗。", "elim": "(A) 餃子是食物，但「發紅包」不是，所以 customs 不是食物；(C) 和 <i>old<\/i> 相反。"}, {"id": "8", "part": 1, "word": "tradition", "ext": true, "sentence": "It is a family <u>tradition<\/u> to clean the whole house before New Year; my grandmother did it, my mother does it, and one day I will do it too.", "steps": [{"q": "What does the word <i>tradition<\/i> mean in this sentence?", "options": ["A new rule that the whole family made this year for the holiday", "A tool for cleaning", "Something done for a long time and passed down in a family", "A holiday trip"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>tradition<\/i>?", "options": ["\"to clean the whole house before New Year\"", "\"my grandmother did it, my mother does it\"", "\"before New Year\"", "\"It is a family\""], "answer": 1}], "zh": "過年前大掃除是我們家的傳統；我奶奶這樣做，我媽媽這樣做，有一天我也會這樣做。", "clue": "分號後面奶奶、媽媽、我，一代傳一代，就是 tradition。", "elim": "(A) <i>new<\/i> 和代代相傳相反；(B) 打掃是做的事，不是工具。"}, {"id": "9", "part": 1, "word": "firecrackers", "ext": false, "sentence": "At midnight my uncle lit the <u>firecrackers<\/u> in front of our door, and they exploded with loud bangs.", "steps": [{"q": "What does the word <i>firecrackers<\/i> mean in this sentence?", "options": ["Small paper tubes that explode with a loud noise", "Crunchy crackers that you eat with tea at a New Year party", "Paper lanterns", "Drums for a parade"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>firecrackers<\/i>?", "options": ["\"At midnight\"", "\"in front of our door\"", "\"my uncle\"", "\"they exploded with loud bangs\""], "answer": 3}], "zh": "半夜，叔叔在我們家門口點鞭炮，鞭炮砰砰砰地炸開。", "clue": "<i>they exploded with loud bangs<\/i> 說明它會爆炸、很大聲；<i>lit<\/i>（點燃）也是線索。", "elim": "(B) cracker 是餅乾，但餅乾不會爆炸，小心拆字陷阱；(C)(D) 不會 explode。"}, {"id": "10", "part": 2, "word": "costume", "ext": false, "sentence": "The dancer put on a lion <u>costume<\/u>, special clothes with a big furry head that made him look like a real lion.", "steps": [{"q": "What does the word <i>costume<\/i> mean in this sentence?", "options": ["A drum for a parade", "Special clothes worn to look like someone or something else", "A special dance step that lion dancers learn when they are young", "A paper lantern"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>costume<\/i>?", "options": ["\"special clothes with a big furry head\"", "\"The dancer put on\"", "\"a real lion\"", "\"made him\""], "answer": 0}], "zh": "舞者穿上獅子裝，那是一套有毛茸茸大頭的特別服裝，讓他看起來像真的獅子。", "clue": "同位語 <i>special clothes …<\/i> 下定義；<i>put on<\/i>（穿上）也表示是衣服。", "elim": "(A)(C)(D) 都不能「穿上」。"}, {"id": "11", "part": 2, "word": "leaped", "ext": false, "sentence": "The lion dancers <u>leaped<\/u> high into the air and landed on tall poles, jumping from one to the next.", "steps": [{"q": "What does the word <i>leaped<\/i> mean in this sentence?", "options": ["Slept", "Sat down", "Cried", "Jumped"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>leaped<\/i>?", "options": ["\"The lion dancers\"", "\"jumping from one\"", "\"tall poles\"", "\"landed\""], "answer": 1}], "zh": "舞獅的人高高躍到空中，落在高高的柱子上，從一根跳到下一根。", "clue": "後面用 <i>jumping<\/i> 換句話說 leaped；<i>high into the air<\/i> 和 <i>landed<\/i>（落下）也支持。", "elim": "(A)(B)(C) 都不會 <i>high into the air<\/i>。"}, {"id": "12", "part": 2, "word": "lanterns", "ext": false, "sentence": "On the last night we carried paper <u>lanterns<\/u>, lights with candles inside, that glowed red and gold in the dark.", "steps": [{"q": "What does the word <i>lanterns<\/i> mean in this sentence?", "options": ["Kites that fly in the wind", "Masks for a dance", "Paper lights with a candle or bulb inside", "Red envelopes with money inside for children"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>lanterns<\/i>?", "options": ["\"On the last night we carried paper\"", "\"lights with candles inside\"", "\"red and gold\"", "\"in the dark\""], "answer": 1}], "zh": "最後一晚，我們提著裡面有蠟燭的紙燈籠，它們在黑暗中發出紅色和金色的光。", "clue": "同位語 <i>lights with candles inside<\/i> 下定義；<i>glowed<\/i>（發光）也是線索。", "elim": "(A)(B)(D) 不會發光。"}, {"id": "13", "part": 2, "word": "common", "ext": false, "sentence": "My two holidays had one thing in <u>common<\/u>: both of them were about being together with family.", "steps": [{"q": "What does the word <i>common<\/i> mean in this sentence (in common)?", "options": ["Shared by two or more things", "Rare and unusual", "Very expensive", "Completely different from each other"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>common<\/i>?", "options": ["\"My two holidays\"", "\"one thing\"", "\"had\"", "\"both of them\""], "answer": 3}], "zh": "我的兩個節日有一個共同點：兩個都和家人團聚有關。", "clue": "冒號後面 <i>both of them<\/i>（兩個都）說明是共同的地方。", "elim": "(D) 正好相反；(B)(C) 說不通。"}, {"id": "14", "part": 2, "word": "like a balloon", "ext": false, "sentence": "The round sky lantern floated up into the night <u>like a balloon<\/u>, rising higher and higher until it looked like a tiny star.", "steps": [{"q": "Why does the writer compare the sky lantern to a balloon?", "options": ["Both are made of rubber.", "Both are round, light, and rise up into the air.", "Both make a loud pop.", "Both are sold at the night market in small shops."], "answer": 1}, {"q": "Which word in the sentence tells you that the writer is making a comparison?", "options": ["\"round\"", "\"floated\"", "\"like\"", "\"night\""], "answer": 2}], "zh": "圓圓的天燈像氣球一樣飄上夜空，越升越高，最後看起來像一顆小星星。", "clue": "明喻用 <i>like<\/i> 比較兩樣東西；句子裡的 <i>round<\/i>、<i>floated up<\/i>、<i>rising higher<\/i> 告訴你兩者「哪裡像」。", "elim": "(A)(C)(D) 句子都沒寫到，是自己加的想法（考卷常見的錯：選了「好像合理」但文章沒寫的選項）。"}]}, {"code": "sunmoon", "title": "Why the Sun and Moon Live in the Sky", "unit": "U4 W4", "parts": ["Part 1　邀請與準備", "Part 2　新家與做客", "Part 3　大水與結局"], "items": [{"id": "1", "part": 0, "word": "ashamed", "ext": false, "sentence": "Leo felt <u>ashamed<\/u> after he lied to his sister; his face turned red, and he was too embarrassed to look at her.", "steps": [{"q": "What does the word <i>ashamed<\/i> mean in this sentence?", "options": ["Proud and happy about something very good that you did", "Hungry and tired", "Feeling bad and embarrassed about something you did", "Brave and strong"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>ashamed<\/i>?", "options": ["\"Leo felt\"", "\"his face turned red, and he was too embarrassed\"", "\"his sister\"", "\"to look at\""], "answer": 1}], "zh": "李奧對妹妹說謊後覺得很慚愧；他滿臉通紅，不好意思看她。", "clue": "<i>embarrassed<\/i>（不好意思）是同義線索；<i>face turned red<\/i> 是慚愧的表現；<i>after he lied<\/i> 說明原因。", "elim": "(A) 說謊不會驕傲；(B)(D) 和臉紅、不敢看人無關。"}, {"id": "2", "part": 0, "word": "enlarge", "ext": false, "sentence": "We need to <u>enlarge<\/u> the class photo, making it two times bigger so everyone can see it from the back of the room.", "steps": [{"q": "What does the word <i>enlarge<\/i> mean in this sentence?", "options": ["To make smaller", "To throw away", "To color in", "To make bigger"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>enlarge<\/i>?", "options": ["\"We need to\"", "\"the class photo\"", "\"from the back of the room\"", "\"two times bigger\""], "answer": 3}], "zh": "我們要把班級照片放大，放大成兩倍大，讓大家從教室後面也看得到。", "clue": "逗號後面 <i>making it two times bigger<\/i> 換句話說。拆字：en-（使）＋ large（大）＝使變大。", "elim": "(A) 相反；(B)(C) 和「兩倍大」無關。"}, {"id": "3", "part": 0, "word": "plenty", "ext": false, "sentence": "Don't worry, there is <u>plenty<\/u> of food; we cooked so much that everyone can have two plates and there will still be some left.", "steps": [{"q": "What does the word <i>plenty<\/i> mean in this sentence?", "options": ["A large amount; more than enough", "Very little, not enough for everyone", "None at all", "Old and dry"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>plenty<\/i>?", "options": ["\"Don't worry\"", "\"still be some left\"", "\"of food\"", "\"Don't worry, there is\""], "answer": 1}], "zh": "別擔心，食物很多；我們煮了好多，每個人都可以吃兩盤，還會有剩。", "clue": "分號後面 <i>cooked so much<\/i>、<i>still be some left<\/i>，吃完還有剩，就是很多、足夠。", "elim": "(B)(C) 相反；(D) 和「還有剩」無關。"}, {"id": "4", "part": 0, "word": "holler", "ext": false, "sentence": "From the bottom of the hill, Mom had to <u>holler<\/u>, \"Dinner's ready!\" as loudly as she could so we could hear her.", "steps": [{"q": "What does the word <i>holler<\/i> mean in this sentence?", "options": ["To whisper softly", "To cry quietly", "To shout loudly", "To sing softly"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>holler<\/i>?", "options": ["\"From the bottom of the hill\"", "\"as loudly as she could\"", "\"Dinner's ready!\"", "\"Mom had to\""], "answer": 1}], "zh": "媽媽在山腳下得用盡力氣大喊「晚餐好了！」，我們才聽得到她。", "clue": "<i>as loudly as she could<\/i> 說明很大聲；<i>From the bottom of the hill<\/i>（離很遠）是原因。", "elim": "(A)(B)(D) 都是小聲，和 <i>loudly<\/i> 相反。"}, {"id": "5", "part": 1, "word": "dash", "ext": false, "sentence": "When the bell rang, Tim had to <u>dash<\/u> to the bus; he ran as fast as he could so he would not miss it.", "steps": [{"q": "What does the word <i>dash<\/i> mean in this sentence?", "options": ["To run quickly", "To walk slowly", "To wait patiently", "To drive a car"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>dash<\/i>?", "options": ["\"When the bell rang, Tim had to\"", "\"the bus\"", "\"ran as fast as he could\"", "\"would not miss it\""], "answer": 2}], "zh": "鐘聲一響，提姆就得衝去搭公車；他用最快的速度跑，才不會錯過。", "clue": "分號後面 <i>ran as fast as he could<\/i> 換句話說 dash。", "elim": "(B)(C) 和 <i>as fast as he could<\/i> 相反；(D) Tim 是小學生，是用跑的。"}, {"id": "6", "part": 1, "word": "similarities", "ext": false, "sentence": "The twins have many <u>similarities<\/u>: they have the same eyes, the same smile, and they both love to draw.", "steps": [{"q": "What does the word <i>similarities<\/i> mean in this sentence?", "options": ["Ways that things are different", "Problems between people", "Toys for children", "Ways in which things are alike"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>similarities<\/i>?", "options": ["\"The twins\"", "\"The twins have many\"", "\"the same eyes\"", "\"have many\""], "answer": 2}], "zh": "這對雙胞胎有很多相似的地方：一樣的眼睛、一樣的笑容，而且兩個都愛畫畫。", "clue": "冒號後面舉例，用了 <i>the same<\/i> 和 <i>both<\/i>。similar（相似的）＋ -ity（名詞）。", "elim": "(A) 正好相反；(B)(C) 說不通。"}, {"id": "7", "part": 1, "word": "boast", "ext": false, "sentence": "Max likes to <u>boast<\/u> about his new phone; he keeps telling everyone how expensive and great it is, which is not polite.", "steps": [{"q": "What does the word <i>boast<\/i> mean in this sentence?", "options": ["To share your things with others so they can use them", "To fix something", "To talk too proudly about yourself or what you have", "To hide something"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>boast<\/i>?", "options": ["\"about his new phone\"", "\"telling everyone\"", "\"which is not polite\"", "\"Max likes to\""], "answer": 1}], "zh": "麥克斯喜歡炫耀他的新手機；他一直跟大家說手機有多貴、多棒，這樣不禮貌。", "clue": "分號後面 <i>keeps telling everyone how … great it is<\/i>，一直說自己的東西多好，就是炫耀。", "elim": "(A) 分享不會「不禮貌」；(B)(D) 和一直說無關。"}, {"id": "8", "part": 1, "word": "victory", "ext": false, "sentence": "After months of practice, our team finally won the game; the <u>victory<\/u> made everyone jump and cheer.", "steps": [{"q": "What does the word <i>victory<\/i> mean in this sentence?", "options": ["A loss", "A practice", "A tie", "A win"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>victory<\/i>?", "options": ["\"After months of practice\"", "\"finally won the game\"", "\"made everyone jump\"", "\"and cheer\""], "answer": 1}], "zh": "練習了好幾個月，我們隊終於贏了比賽；這場勝利讓大家又跳又歡呼。", "clue": "前面 <i>won the game<\/i>，後面用 <i>the victory<\/i> 指同一件事。", "elim": "(A) 輸了不會歡呼；(B) practice 在前面，不是 victory 指的事；(C) 平手不是 <i>won<\/i>。"}, {"id": "9", "part": 1, "word": "wisdom", "ext": false, "sentence": "Grandpa's <u>wisdom<\/u> helps our family make good choices; he has lived a long time and knows what is smart to do.", "steps": [{"q": "What does the word <i>wisdom<\/i> mean in this sentence?", "options": ["Money that grandparents save in a bank for many, many years", "Strength in your body", "Fear of new things", "Good judgment that comes from knowledge and experience"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>wisdom<\/i>?", "options": ["\"helps our family\"", "\"what is smart\"", "\"Grandpa's\"", "\"make\""], "answer": 1}], "zh": "爺爺的智慧幫助我們家做出好的選擇；他活了很久，知道怎麼做才是聰明的。", "clue": "分號後面 <i>lived a long time<\/i>（經驗）＋ <i>knows what is smart<\/i>（知識、判斷）。wise（有智慧的）的名詞。", "elim": "(A)(B)(C) 都不是「知道怎麼做才聰明」。"}, {"id": "10", "part": 2, "word": "splashed", "ext": false, "sentence": "The kids jumped into the pool and <u>splashed<\/u> water everywhere; drops flew onto our towels and books.", "steps": [{"q": "What does the word <i>splashed<\/i> mean in this sentence?", "options": ["Drank", "Made water fly around in drops", "Froze", "Cleaned the water in the pool with a net"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>splashed<\/i>?", "options": ["\"The kids jumped into the pool\"", "\"drops flew\"", "\"everywhere\"", "\"our towels\""], "answer": 1}], "zh": "孩子們跳進泳池，把水濺得到處都是；水滴飛到我們的毛巾和書上。", "clue": "分號後面 <i>drops flew onto …<\/i> 描述水花亂飛的結果。", "elim": "(A)(C)(D) 都不會讓水滴「飛」到書上。"}, {"id": "11", "part": 2, "word": "scrambled", "ext": false, "sentence": "When the water rose, the cat <u>scrambled<\/u> up the tree, climbing quickly and clumsily with its claws to get away.", "steps": [{"q": "What does the word <i>scrambled<\/i> mean in this sentence?", "options": ["Climbed quickly and in a hurry", "Slept peacefully", "Swam slowly across the water to the tree", "Walked calmly"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>scrambled<\/i>?", "options": ["\"When the water rose\"", "\"the tree\"", "\"to get away\"", "\"climbing quickly\""], "answer": 3}], "zh": "水漲上來時，貓手忙腳亂地爬上樹，用爪子又快又笨拙地往上爬，想要逃走。", "clue": "逗號後面 <i>climbing quickly and clumsily<\/i> 說明是慌張地爬。", "elim": "(B)(D) 和逃命的慌張相反；(C) 貓是爬上樹，不是游泳。"}, {"id": "12", "part": 2, "word": "remain", "ext": false, "sentence": "Most guests went home after the party, but my aunt decided to <u>remain<\/u> at our house for another week.", "steps": [{"q": "What does the word <i>remain<\/ const LETTERS = "ABCD";
const STORE_KEY = "context-clue-detectives-v1";

// ---------- 進度（localStorage，讀寫都包 try/catch） ----------
let progress = {};
try { progress = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { progress = {}; }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {} }
// progress[lessonCode][itemId] = "ok"（一次就全對）| "miss"（有答錯）
function rec(code) { return progress[code] || (progress[code] = {}); }
function lessonStats(lesson) {
  const r = progress[lesson.code] || {};
  let ok = 0, done = 0;
  lesson.items.forEach(it => { if (r[it.id]) { done++; if (r[it.id] === "ok") ok++; } });
  return { ok, done, total: lesson.items.length };
}
function starCount(ok, total) {
  if (!total) return 0;
  const p = ok / total;
  return p >= 0.9 ? 3 : p >= 0.7 ? 2 : p > 0 ? 1 : 0;
}
function starsHTML(n) {
  return '<span class="stars">' + [0, 1, 2].map(i => `<span class="${i < n ? "on" : ""}">★</span>`).join("") + "</span>";
}

(function () {

// ---------- 課次頁：選章節 ----------
function renderLesson(lesson) {
  const r = progress[lesson.code] || {};
  const sel = new Set(lesson.parts.map((_, i) => i));
  let mode = "all"; // all | ext | miss
  const node = el(`
    <span class="tag part-t">${lesson.unit}</span>
    <h2>${lesson.title}</h2>
    <p class="sub">勾選要練的章節（可複選），再按「開始調查」。</p>
    <div class="parts">${lesson.parts.map((p, i) => {
      const items = lesson.items.filter(it => it.part === i);
      const ok = items.filter(it => r[it.id] === "ok").length;
      return `<button class="part sel" type="button" data-i="${i}"><span class="chk">✓</span><span class="nm">${p}</span><span class="cnt">${ok}/${items.length} 破案</span></button>`;
    }).join("")}</div>
    <div class="opts-row">
      <button class="pill sel" type="button" data-mode="all">全部題目</button>
      <button class="pill" type="button" data-mode="miss">只練還沒破案的</button>
      <button class="pill" type="button" data-mode="ext">只練延伸字</button>
    </div>
    <p class="small" id="count"></p>
    <button class="btn" type="button" id="go">🔍 開始調查</button>
    <button class="btn ghost no-print" type="button" id="key">📖 看解答總表</button>
    <button class="btn ghost no-print" type="button" id="reset">清除這課進度</button>`);
  const pick = () => lesson.items.filter(it => sel.has(it.part) &&
    (mode === "all" || (mode === "ext" && it.ext) || (mode === "miss" && (progress[lesson.code] || {})[it.id] !== "ok")));
  const refresh = () => {
    const n = pick().length;
    node.querySelector("#count").textContent = n ? `共 ${n} 個字、${n * 2} 小題左右` : "這個組合沒有題目，換個章節或模式。";
    node.querySelector("#go").disabled = !n;
  };
  node.querySelectorAll(".part").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (sel.has(i)) { if (sel.size > 1) sel.delete(i); } else sel.add(i);
    node.querySelectorAll(".part").forEach(x => x.classList.toggle("sel", sel.has(+x.dataset.i)));
    refresh();
  });
  node.querySelectorAll(".pill").forEach(b => b.onclick = () => {
    mode = b.dataset.mode;
    node.querySelectorAll(".pill").forEach(x => x.classList.toggle("sel", x === b));
    refresh();
  });
  node.querySelector("#go").onclick = () => runQuiz(lesson, pick());
  node.querySelector("#key").onclick = () => renderKey(lesson, [...sel].sort());
  node.querySelector("#reset").onclick = () => {
    if (!confirm("確定要清除「" + lesson.title + "」的作答紀錄？")) return;
    delete progress[lesson.code]; save(); renderLesson(lesson);
  };
  refresh();
  show(node, `<button data-home>🏠 偵探社</button>`);
}

function highlight(sentence, clueHTML) {
  const plain = clueHTML.replace(/<[^>]+>/g, "").replace(/^["“]|["”]$/g, "");
  let out = sentence;
  plain.split("…").map(s => s.trim().replace(/^[,\s]+|[,\s]+$/g, "")).filter(Boolean).forEach(piece => {
    const i = out.indexOf(piece);
    if (i >= 0) out = out.slice(0, i) + "<mark>" + piece + "</mark>" + out.slice(i + piece.length);
  });
  return out;
}

    const stepsBox = node.querySelector("#steps");
    let s = 0;
    const renderStep = () => {
      const st = it.steps[s];
      const isClue = /clue|which word/i.test(st.q.replace(/<[^>]+>/g, ""));
      const box = document.createElement("div");
      box.className = "step";
      box.innerHTML = `<div><span class="qno">${it.id}-${s + 1}</span><span class="qtxt">${st.q}</span></div>
        <div class="hint">${isClue ? "🔎 第 2 關：選出句子裡真正在解釋這個字的片段" : (s === 0 ? "💡 第 1 關：先遮住選項，從句子猜意思" : "")}</div>
        <div class="opts">${st.options.map((o, i) => `<button class="opt" type="button" data-i="${i}"><span class="ltr">(${LETTERS[i]})</span><span>${o}</span></button>`).join("")}</div>
        <div class="fb"></div>`;
      box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
        const i = +b.dataset.i;
        const fb = box.querySelector(".fb");
        if (i === st.answer) {
          b.classList.add("right");
          box.querySelectorAll(".opt").forEach(x => x.disabled = true);
          fb.className = "fb ok";
          fb.textContent = firstTry[it.id] ? "✔ 答對了！" : "✔ 找到了！";
          if (isClue) node.querySelector("#sent").innerHTML = highlight(it.sentence, st.options[st.answer]);
          s++;
          if (s < it.steps.length) renderStep(); else finish();
        } else {
          b.classList.add("wrong"); b.disabled = true;
          firstTry[it.id] = false;
          fb.className = "fb no";
          fb.textContent = isClue ? "✘ 這段沒有在解釋這個字，再找找看。" : "✘ 放回句子裡讀讀看，說得通嗎？再試一次。";
        }
      });
      stepsBox.appendChild(box);
    };
    const finish = () => {
      const ans = it.steps.map((st, k) => `${it.id}-${k + 1} (${LETTERS[st.answer]})`).join("　");
      node.querySelector("#explain").innerHTML = `<div class="explain">
        <p><span class="k">解答</span>${ans}</p>
        <p><span class="k">中譯</span>${it.zh}</p>
        <p><span class="k">線索</span>${it.clue}</p>
        <p><span class="k">刪去</span>${it.elim}</p></div>`;
      rec(lesson.code)[it.id] = firstTry[it.id] ? "ok" : (rec(lesson.code)[it.id] === "ok" ? "ok" : "miss");
      save();
      const nb = node.querySelector("#next");
      nb.classList.remove("hide"); nb.onclick = next; nb.focus();
    };
    renderStep();
    show(node, `<button data-home>🏠 偵探社</button> › <button data-lesson="${lesson.code}">${lesson.title}</button>`);
  }

  function renderResult() {
    const ok = items.filter(it => firstTry[it.id]).length;
    const missed = items.filter(it => !firstTry[it.id]);
    const n = starCount(ok, items.length);
    const msg = n === 3 ? "神探等級！線索一個都沒漏掉。" : n === 2 ? "很不錯！把紅色的字再練一次就更穩了。" : "先看解析，再挑戰一次，一定會進步。";
    const node = el(`
      <div class="card result">
        <h2>結案報告</h2>
        <div class="big">${ok} / ${items.length}</div>
        ${starsHTML(n)}
        <p>${msg}</p>
        ${missed.length ? `<p class="small">這幾個字有答錯過：</p><div class="miss">${missed.map(it => `<span>${it.word}</span>`).join("")}</div>` : ""}
        <div>
          ${missed.length ? '<button class="btn" type="button" id="retry">重練答錯的字</button>' : ""}
          <button class="btn ghost" type="button" id="back">回到章節</button>
        </div>
      </div>`);
    if (missed.length) node.querySelector("#retry").onclick = () => runQuiz(lesson, missed);
    node.querySelector("#back").onclick = () => renderLesson(lesson);
    show(node, `<button data-home>🏠 偵探社</button> › <button data-lesson="${lesson.code}">${lesson.title}</button>`);
  }

  renderItem();
}

// ---------- 解答總表 ----------
function renderKey(lesson, parts) {
  const body = parts.map(pi => {
    const rows = lesson.items.filter(it => it.part === pi).map(it => `
      <div class="key-item">
        <div><span class="w">${it.id}. ${it.word}</span> ${it.ext ? '<span class="tag ext">延伸</span>' : ""}</div>
        <div class="small">${it.sentence}</div>
        <div>${it.steps.map((st, k) => `<span class="ans">${it.id}-${k + 1} (${LETTERS[st.answer]})</span>${st.options[st.answer]}`).join("<br>")}</div>
        <div class="small"><b>線索</b> ${it.clue}</div>
      </div>`).join("");
    return `<div class="card"><h3 style="margin:0 0 6px">${lesson.parts[pi]}</h3>${rows}</div>`;
  }).join("");
  const node = el(`
    <h2>📖 ${lesson.title} 解答總表</h2>
    <p class="sub no-print">先自己做完再對答案。可以直接列印這一頁。</p>
    <button class="btn ghost no-print" type="button" id="print">🖨 列印</button>
    <button class="btn ghost no-print" type="button" id="back">回到章節</button>
    ${body}`);
  node.querySelector("#print").onclick = () => window.print();
  node.querySelector("#back").onclick = () => renderLesson(lesson);
  show(node, `<button data-home>🏠 偵探社</button> › <button data-lesson="${lesson.code}">${lesson.title}</button>`);
}

renderHome();
</script>
