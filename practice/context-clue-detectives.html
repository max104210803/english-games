<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上下文線索偵探社</title>
<!-- 上下文線索偵探社：句子皆為原創，非課本原文。 -->
<style>
:root{
  --bg:#f3f6fa; --paper:#ffffff; --ink:#1f2a37; --muted:#5f6b7a; --line:#dbe3ec;
  --red:#c8463d; --red-soft:#fbe9e6; --yellow:#e8b730; --yellow-soft:#fdf3d4;
  --blue:#2f6fbf; --blue-soft:#e4eefa; --green:#2f8a57; --green-soft:#e3f3e9;
  --purple:#7a54b8; --purple-soft:#efe8fa; --mark:#ffe58a;
  --shadow:0 2px 0 rgba(31,42,55,.06), 0 8px 24px rgba(31,42,55,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a21; --paper:#1d252f; --ink:#e8eef5; --muted:#a3b0bf; --line:#334050;
    --red:#ec7b70; --red-soft:#3b2422; --yellow:#e9c04e; --yellow-soft:#3a3220;
    --blue:#7eaee8; --blue-soft:#1d2c40; --green:#5cc08a; --green-soft:#1b3326;
    --purple:#b49be2; --purple-soft:#2c2440; --mark:#6b5a1c; --shadow:0 2px 0 rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#141a21; --paper:#1d252f; --ink:#e8eef5; --muted:#a3b0bf; --line:#334050;
  --red:#ec7b70; --red-soft:#3b2422; --yellow:#e9c04e; --yellow-soft:#3a3220;
  --blue:#7eaee8; --blue-soft:#1d2c40; --green:#5cc08a; --green-soft:#1b3326;
  --purple:#b49be2; --purple-soft:#2c2440; --mark:#6b5a1c; --shadow:0 2px 0 rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 80px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.topbar .crumb{font-size:14px;color:var(--muted)}
.topbar .crumb button{border:none;background:none;color:var(--blue);font:inherit;cursor:pointer;padding:0}
.theme{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:4px 10px;font:inherit;font-size:14px;cursor:pointer}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(26px,5vw,38px);margin:10px 0 0}
h2{font-family:"Noto Serif TC",serif;font-size:clamp(22px,4.2vw,30px);margin:6px 0 4px}
.sub{margin:0;color:var(--muted);font-size:15px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.small{font-size:14px;color:var(--muted)}
.hide{display:none!important}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.view{animation:fade .25s ease}

/* 首頁：課次卡 */
.rules{background:var(--yellow-soft);border-left:6px solid var(--yellow);border-radius:12px;padding:10px 14px;font-size:15px;margin-top:14px}
.rules b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:16px}
.lesson{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:16px;padding:14px 16px;font:inherit;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.lesson:hover{transform:translateY(-2px);border-color:var(--blue)}
.lesson .unit{display:inline-block;font-size:13px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:1px 10px}
.lesson .ttl{display:block;font-weight:800;font-size:18px;line-height:1.35;margin:6px 0 4px}
.lesson .meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.stars{letter-spacing:2px;color:var(--line);font-size:16px}
.stars .on{color:var(--yellow)}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}

/* 課次頁：選章節 */
.parts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.part{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}
.part:hover{border-color:var(--blue)}
.part.sel{border-color:var(--blue);background:var(--blue-soft)}
.part .nm{flex:1}
.part .cnt{font-size:14px;color:var(--muted);white-space:nowrap}
.part .chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:#fff;flex:none}
.part.sel .chk{background:var(--blue);border-color:var(--blue)}
.opts-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{font:inherit;font-size:14px;border-radius:999px;padding:4px 14px;background:var(--paper);color:var(--muted);border:1.5px solid var(--line);cursor:pointer}
.pill.sel{background:var(--purple-soft);border-color:var(--purple);color:var(--ink)}
.btn{border:none;background:var(--blue);color:#fff;border-radius:12px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;margin:12px 8px 0 0}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* 答題 */
.progress{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.progress .bar{flex:1;margin:0}
.case{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700}
.tag.case-no{background:var(--blue);color:#fff}
.tag.ext{background:var(--purple);color:#fff}
.tag.part-t{background:var(--blue-soft);color:var(--ink);font-weight:500}
.sentence{font-size:19px;line-height:1.9;background:var(--bg);border-radius:12px;padding:12px 14px;margin:8px 0 12px;border-left:5px solid var(--blue)}
.sentence u{text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700;color:var(--blue)}
.sentence mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px}
.step{margin-top:6px}
.step .qno{font-weight:800;color:var(--blue);margin-right:6px}
.step .qtxt{font-weight:600}
.step .hint{font-size:13px;color:var(--muted);margin:2px 0 8px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opt{display:flex;gap:10px;text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:9px 14px;font:inherit;font-size:16px;cursor:pointer}
.opt .ltr{font-weight:800;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .ltr{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);animation:shake .3s}
.opt:disabled{cursor:default}
.fb{margin-top:8px;font-size:15px;font-weight:700}
.fb.ok{color:var(--green)} .fb.no{color:var(--red)}
.explain{margin-top:14px;background:var(--green-soft);border-radius:12px;padding:12px 14px;font-size:15px;animation:fade .2s ease}
.explain p{margin:4px 0}
.explain .k{font-weight:800;margin-right:4px}
.nav{display:flex;justify-content:flex-end}

/* 結算 */
.result{text-align:center}
.result .big{font-size:48px;font-weight:900;margin:4px 0;animation:pop .4s ease}
.result .stars{font-size:34px}
.miss{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.miss span{background:var(--red-soft);border-radius:999px;padding:2px 12px;font-size:15px}

/* 解答總表 */
.key-item{border-top:1px dashed var(--line);padding:10px 0}
.key-item:first-child{border-top:none}
.key-item .w{font-weight:800}
.key-item .ans{display:inline-block;background:var(--green-soft);border-radius:8px;padding:0 8px;margin-right:6px;font-weight:700}
@media print{
  body{background:#fff;color:#000}
  .topbar,.no-print{display:none!important}
  .card{box-shadow:none;border:1px solid #999}
}
@media (max-width:600px){
  .sentence{font-size:17px}
  .opt{font-size:15px}
}
</style>
</head>

<script>
const DATA = [{"code": "ice", "title": "Ice Hotels", "unit": "U3 W1", "parts": ["Part 1　冰旅館是什麼、怎麼取冰", "Part 2　黏合冰磚與冰雕", "Part 3　住在冰旅館"], "items": [{"id": "1", "part": 0, "word": "climates", "ext": false, "sentence": "Ice hotels can only be built in places with cold <u>climates<\/u>, where the weather stays freezing for months every year instead of changing from day to day.", "steps": [{"q": "What does the word <i>climates<\/i> mean in this sentence?", "options": ["Short storms that come and pass in only a few hours", "The usual weather of a place over a long time", "Tall mountains covered with snow", "Hotels that are made of glass"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>climates<\/i>?", "options": ["\"Ice hotels can only be built\"", "\"Ice hotels\"", "\"stays freezing for months\"", "\"in places\""], "answer": 2}], "zh": "冰旅館只能蓋在氣候寒冷的地方，那裡的天氣一年有好幾個月都在冰點以下，不是每天變來變去。", "clue": "<i>stays freezing for months every year<\/i> 說的是「長時間」的天氣型態；<i>instead of changing from day to day<\/i> 是對比，每天在變的是 weather，不是 climate。", "elim": "(A) 幾小時的暴風雨是短時間的天氣；(C)(D) 根本不是天氣。"}, {"id": "2", "part": 0, "word": "igloo", "ext": false, "sentence": "An ice hotel looks like a giant <u>igloo<\/u>, the dome-shaped snow house that people in the Arctic once built from blocks of hard-packed snow.", "steps": [{"q": "What does the word <i>igloo<\/i> mean in this sentence?", "options": ["A tall tower made of steel and glass", "A tent made of animal skins that hunters carry", "A boat used to cross frozen lakes", "A round house built from blocks of snow"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>igloo<\/i>?", "options": ["\"An ice hotel looks like\"", "\"a giant\"", "\"the dome-shaped snow house\"", "\"people in the Arctic once built\""], "answer": 2}], "zh": "冰旅館看起來像一個巨大的 igloo，也就是北極的人以前用壓緊的雪塊蓋成的圓頂雪屋。", "clue": "逗號後面的同位語 <i>the dome-shaped snow house<\/i> 直接替 igloo 下定義（dome-shaped＝圓頂形）。", "elim": "(A) 鋼和玻璃；(B) 獸皮帳篷；(C) 船，材料或用途都不是「雪塊蓋的房子」。"}, {"id": "3", "part": 0, "word": "frozen", "ext": false, "sentence": "Builders look for a river that is completely <u>frozen<\/u>, because only water that has turned into hard, solid ice can be cut into strong blocks.", "steps": [{"q": "What does the word <i>frozen<\/i> mean in this sentence?", "options": ["Turned into hard ice by the cold", "Flowing quickly toward the sea in the spring", "Full of fish and plants", "Warm enough for swimming"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>frozen<\/i>?", "options": ["\"turned into hard, solid ice\"", "\"Builders look for a river that is completely\"", "\"completely\"", "\"strong blocks\""], "answer": 0}], "zh": "建造的人會找一條完全結冰的河，因為只有已經變成堅硬冰塊的水，才能切成堅固的磚。", "clue": "<i>because<\/i> 後面解釋原因：水 <i>has turned into hard, solid ice<\/i>。", "elim": "(B) 還在流動就切不成冰磚；(D) 和「堅硬的冰」相反；(C) 句子沒提到魚。"}, {"id": "4", "part": 1, "word": "snice", "ext": false, "sentence": "Workers spread <u>snice<\/u>, a sticky mix of snow and ice, between the blocks so the walls will not come apart.", "steps": [{"q": "What does the word <i>snice<\/i> mean in this sentence?", "options": ["A sharp tool that workers use to cut ice blocks", "A blanket for cold nights", "A mixture that holds ice blocks together", "A kind of ice statue"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>snice<\/i>?", "options": ["\"Workers spread\"", "\"the walls\"", "\"between the blocks\"", "\"a sticky mix\""], "answer": 3}], "zh": "工人在冰磚之間抹上 snice，一種黏黏的雪和冰混合物，讓牆壁不會散開。", "clue": "同位語 <i>a sticky mix of snow and ice<\/i> 說出它是什麼；<i>so the walls will not come apart<\/i> 說出它的用途：黏合。snice＝snow＋ice 拼成的字。", "elim": "(A) 工具不會「抹」在冰磚之間；(B)(D) 和黏牆壁無關。"}, {"id": "5", "part": 1, "word": "apart", "ext": false, "sentence": "Without snice, the heavy blocks would slide <u>apart<\/u> and leave wide gaps, and the cold wind would blow right into the rooms.", "steps": [{"q": "What does the word <i>apart<\/i> mean in this sentence?", "options": ["Closer together, side by side", "Higher into the air", "Into a neat pile", "Away from each other"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>apart<\/i>?", "options": ["\"Without snice\"", "\"leave wide gaps\"", "\"the heavy blocks\"", "\"into the rooms\""], "answer": 1}], "zh": "沒有 snice，沉重的冰磚會滑開、留下很寬的縫，冷風就會直接吹進房間。", "clue": "結果 <i>leave wide gaps<\/i>（留下寬縫）表示冰磚彼此分開了。", "elim": "(A) 剛好相反；(B)(C) 有縫隙不是因為「往上」或「疊整齊」。"}, {"id": "6", "part": 1, "word": "carve", "ext": false, "sentence": "Artists <u>carve<\/u> chairs, beds, and even statues by slowly cutting and shaping big pieces of ice with sharp tools.", "steps": [{"q": "What does the word <i>carve<\/i> mean in this sentence?", "options": ["To shape something by cutting it", "To melt something with hot water", "To paint something with bright colors", "To carry something to another place"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>carve<\/i>?", "options": ["\"Artists\"", "\"chairs, beds, and even statues\"", "\"cutting and shaping\"", "\"slowly\""], "answer": 2}], "zh": "藝術家用銳利的工具，慢慢切割、塑形大塊的冰，雕出椅子、床，甚至雕像。", "clue": "<i>by<\/i>＋方法：<i>cutting and shaping … with sharp tools<\/i>，就是「雕刻」。", "elim": "(B) 用熱水會把冰融掉；(C) 沒提到顏色；(D) 搬運不需要 sharp tools。"}, {"id": "7", "part": 1, "word": "sculpture", "ext": true, "sentence": "In the main hall stands an ice <u>sculpture<\/u> of a polar bear, a piece of art that an artist carved by hand from one huge block of ice.", "steps": [{"q": "What does the word <i>sculpture<\/i> mean in this sentence?", "options": ["A machine that keeps the rooms in the hotel cold", "A real animal that lives in the hotel", "A sign that shows guests the way", "A piece of art made by carving or shaping"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>sculpture<\/i>?", "options": ["\"In the main hall stands\"", "\"of a polar bear\"", "\"a piece of art\"", "\"one huge block\""], "answer": 2}], "zh": "大廳裡站著一座北極熊冰雕，那是藝術家從一整塊巨大的冰手工雕出來的藝術品。", "clue": "同位語 <i>a piece of art that an artist carved by hand<\/i> 直接下定義。", "elim": "(B) 是冰雕的北極熊，不是真的動物，小心被 <i>polar bear<\/i> 騙；(A)(C) 和 art 無關。"}, {"id": "8", "part": 2, "word": "bundle up", "ext": false, "sentence": "Guests must <u>bundle up<\/u> in thick coats, hats, and gloves before bed, because the air in their room is as cold as a freezer.", "steps": [{"q": "What does <i>bundle up<\/i> mean in this sentence?", "options": ["Take off their warm clothes", "Put on many warm clothes", "Pack their bags to go home", "Turn on the heater"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>bundle up<\/i>?", "options": ["\"Guests must\"", "\"before bed\"", "\"thick coats, hats, and gloves\"", "\"their room\""], "answer": 2}], "zh": "房客睡前一定要穿上厚外套、戴帽子和手套把自己包緊，因為房間裡的空氣跟冷凍庫一樣冷。", "clue": "<i>in thick coats, hats, and gloves<\/i> 舉出穿了哪些衣物；<i>as cold as a freezer<\/i> 說明為什麼要包緊。", "elim": "(A) 相反；(C) 不是要回家；(D) 冰旅館開暖氣會融化。"}, {"id": "9", "part": 2, "word": "freezing", "ext": false, "sentence": "The temperature inside must stay below <u>freezing<\/u>; if it rises above zero degrees Celsius, the walls start to drip and turn into water.", "steps": [{"q": "What does the word <i>freezing<\/i> mean in this sentence?", "options": ["Very hot, like a sunny day in the middle of summer", "A nice, warm feeling", "The point at which water turns into ice", "A strong wind from the north"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>freezing<\/i>?", "options": ["\"The temperature inside\"", "\"zero degrees Celsius\"", "\"must stay\"", "\"the walls\""], "answer": 1}], "zh": "室內溫度一定要保持在冰點以下；如果升到攝氏零度以上，牆壁就會開始滴水、變成水。", "clue": "分號後面把 freezing 換成具體數字 <i>zero degrees Celsius<\/i>（攝氏 0 度，水結冰的溫度）。", "elim": "(A)(B) 是熱的；(D) 風不是溫度。"}, {"id": "10", "part": 2, "word": "melt", "ext": false, "sentence": "Every spring the warm sunshine makes the hotel <u>melt<\/u>, and its walls slowly change from solid ice into water that flows back into the river.", "steps": [{"q": "What does the word <i>melt<\/i> mean in this sentence?", "options": ["To change from solid ice into liquid water", "To grow bigger and stronger", "To become colder and harder", "To fall down suddenly because of a strong earthquake"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>melt<\/i>?", "options": ["\"Every spring\"", "\"change from solid ice into water\"", "\"the hotel\"", "\"slowly\""], "answer": 1}], "zh": "每年春天，溫暖的陽光讓旅館融化，牆壁慢慢從固體的冰變成水，流回河裡。", "clue": "<i>and<\/i> 後面把 melt 的過程說出來：<i>change from solid ice into water<\/i>。", "elim": "(B)(C) 和「變成水」相反；(D) 句子沒有地震。"}, {"id": "11", "part": 2, "word": "temporary", "ext": true, "sentence": "An ice hotel is only <u>temporary<\/u>. It stands for a few months in winter, and then it is gone, so builders must make a brand-new one every year.", "steps": [{"q": "What does the word <i>temporary<\/i> mean in this sentence?", "options": ["Lasting forever", "Very expensive", "Lasting for only a short time", "Built by famous artists from other countries"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>temporary<\/i>?", "options": ["\"An ice hotel is only\"", "\"and then it is gone\"", "\"builders must make\"", "\"every year\""], "answer": 1}], "zh": "冰旅館只是暫時的。它在冬天只立幾個月就不見了，所以每年都要蓋一間全新的。", "clue": "下一句 <i>stands for a few months … and then it is gone<\/i> 說明它只存在一小段時間。", "elim": "(A) 相反（每年都要重蓋）；(B)(D) 句子沒提到價錢或名人。"}, {"id": "12", "part": 2, "word": "shiver", "ext": true, "sentence": "When Tom stepped out of his warm sleeping bag, he began to <u>shiver<\/u>; his whole body shook, and his teeth chattered from the cold.", "steps": [{"q": "What does the word <i>shiver<\/i> mean in this sentence?", "options": ["To laugh loudly", "To shake because you are cold", "To fall asleep quickly", "To sweat a lot because you feel too hot"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>shiver<\/i>?", "options": ["\"his whole body shook\"", "\"stepped out of\"", "\"his warm sleeping bag\"", "\"he began\""], "answer": 0}], "zh": "湯姆一離開溫暖的睡袋就開始發抖；他全身顫抖，牙齒因為冷而打顫。", "clue": "分號後面描述 shiver 的樣子：<i>body shook<\/i>、<i>teeth chattered<\/i>，再加上 <i>from the cold<\/i>。", "elim": "(D) 是熱，和 cold 相反；(A)(C) 和身體發抖無關。"}]}, {"code": "light", "title": "Lighting Lives", "unit": "U3 W2", "parts": ["Part 1　沒有電的生活", "Part 2　太陽能來了", "Part 3　生活的改變"], "items": [{"id": "1", "part": 0, "word": "remote", "ext": true, "sentence": "Debby's village was so <u>remote<\/u> that it took two days of walking through the mountains to reach the nearest town.", "steps": [{"q": "What does the word <i>remote<\/i> mean in this sentence?", "options": ["Crowded and noisy with many people", "Far away from other places", "Close to a big city", "Built next to the sea"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>remote<\/i>?", "options": ["\"the nearest town\"", "\"was so\"", "\"Debby's village was so\"", "\"two days of walking\""], "answer": 3}], "zh": "黛比的村子非常偏遠，要在山裡走兩天才到得了最近的城鎮。", "clue": "<i>so … that<\/i> 因果句：因為太 remote，所以要 <i>two days of walking<\/i> 才到得了。", "elim": "(C) 和「走兩天」矛盾；(A)(D) 句子沒提到人多或海邊。"}, {"id": "2", "part": 0, "word": "afford", "ext": false, "sentence": "Her family could not <u>afford<\/u> a new lamp; they had saved every coin for months and still did not have enough money.", "steps": [{"q": "What does the word <i>afford<\/i> mean in this sentence?", "options": ["To have enough money to pay for something", "To fix something that is broken or not working", "To give something away", "To find something that was lost"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>afford<\/i>?", "options": ["\"a new lamp\"", "\"Her family\"", "\"not have enough money\"", "\"they had saved every coin\""], "answer": 2}], "zh": "她家買不起一盞新燈；他們存了好幾個月的每一枚硬幣，錢還是不夠。", "clue": "分號後面說 <i>did not have enough money<\/i>，could not afford＝錢不夠買。", "elim": "(B) 修理、(C) 送人、(D) 找回，都和「錢夠不夠」無關。"}, {"id": "3", "part": 0, "word": "rely", "ext": false, "sentence": "With no electricity, the villagers had to <u>rely<\/u> on candles and oil lamps; without them, they could not see anything after sunset.", "steps": [{"q": "What does the word <i>rely<\/i> mean in this sentence?", "options": ["To be afraid of", "To depend on", "To sell", "To make fun of"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>rely<\/i>?", "options": ["\"With no electricity, the villagers had to\"", "\"the villagers\"", "\"without them, they could not see anything\"", "\"after sunset\""], "answer": 2}], "zh": "沒有電，村民只能依賴蠟燭和油燈；沒有它們，太陽下山後就什麼都看不見。", "clue": "<i>without them, they could not see anything<\/i>：少了它就不行，就是「依賴」。", "elim": "(A) 害怕、(C) 賣、(D) 取笑，都說不通「沒有它們就看不見」。"}, {"id": "4", "part": 0, "word": "harmful", "ext": true, "sentence": "The smoke from oil lamps was <u>harmful<\/u>; it hurt people's eyes and made many children cough at night.", "steps": [{"q": "What does the word <i>harmful<\/i> mean in this sentence?", "options": ["Bright and colorful", "Pleasant to smell, like flowers", "Easy to clean", "Causing hurt or damage"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>harmful<\/i>?", "options": ["\"The smoke from oil lamps\"", "\"hurt people's eyes\"", "\"at night\"", "\"many children\""], "answer": 1}], "zh": "油燈的煙對人有害；它會傷眼睛，也讓很多小孩晚上一直咳嗽。", "clue": "分號後面舉出壞處：<i>hurt people's eyes<\/i>、<i>cough<\/i>。harm（傷害）＋ -ful＝有害的。", "elim": "(A)(B)(C) 都是好事，和「傷眼睛、咳嗽」相反。"}, {"id": "5", "part": 1, "word": "solar", "ext": false, "sentence": "<u>Solar<\/u> lamps collect energy from the sun during the day and use it to shine at night.", "steps": [{"q": "What does the word <i>solar<\/i> mean in this sentence?", "options": ["Using power from the sun", "Using power from the wind", "Using burning wood", "Using batteries from a store"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>solar<\/i>?", "options": ["\"lamps\"", "\"use it to shine at night\"", "\"energy from the sun\"", "\"during the day\""], "answer": 2}], "zh": "太陽能燈白天收集太陽的能量，晚上再用它來發光。", "clue": "<i>collect energy from the sun<\/i>，所以 solar＝和太陽有關的。", "elim": "(B)(C)(D) 的能量來源句子都沒提到。"}, {"id": "6", "part": 1, "word": "panels", "ext": false, "sentence": "Workers fixed flat, square <u>panels<\/u> on the roofs, where the boards could catch as much sunlight as possible.", "steps": [{"q": "What does the word <i>panels<\/i> mean in this sentence?", "options": ["Long electric wires that carry power to homes", "Flat boards that collect sunlight", "Small round batteries", "Thin pieces of cloth"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>panels<\/i>?", "options": ["\"Workers fixed\"", "\"on the roofs\"", "\"as possible\"", "\"the boards could catch as much sunlight\""], "answer": 3}], "zh": "工人把扁平的方形板子裝在屋頂上，讓這些板子盡量接收陽光。", "clue": "後半句用 <i>the boards<\/i> 換句話說 panels，還說出用途：<i>catch … sunlight<\/i>。前面的 <i>flat, square<\/i> 也描述了形狀。", "elim": "(A) 電線是長的、(C) 電池是圓的，都不是 flat, square；(D) 布接不了陽光發電。"}, {"id": "7", "part": 1, "word": "install", "ext": false, "sentence": "It took the workers a whole afternoon to <u>install<\/u> the lights; they put each lamp in place and connected all the wires.", "steps": [{"q": "What does the word <i>install<\/i> mean in this sentence?", "options": ["To put something in place so it is ready to use", "To take something apart so it can be carried away", "To buy something at a store", "To turn something off"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>install<\/i>?", "options": ["\"a whole afternoon\"", "\"It took the workers a whole afternoon\"", "\"the lights\"", "\"put each lamp in place\""], "answer": 3}], "zh": "工人花了一整個下午安裝這些燈；他們把每盞燈放好位置，再把電線全部接好。", "clue": "分號後面描述 install 的步驟：<i>put … in place<\/i>、<i>connected all the wires<\/i>。", "elim": "(B) 拆開是相反；(C) 買不需要接電線；(D) 關燈不必花一下午。"}, {"id": "8", "part": 1, "word": "generate", "ext": true, "sentence": "The panels <u>generate<\/u> electricity all day long; they make enough power to light three rooms at night.", "steps": [{"q": "What does the word <i>generate<\/i> mean in this sentence?", "options": ["To waste something useful", "To produce or make", "To hide", "To break"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>generate<\/i>?", "options": ["\"The panels\"", "\"all day long\"", "\"they make enough power\"", "\"to light three rooms at night\""], "answer": 2}], "zh": "太陽能板整天都在發電；它們產生的電足夠晚上點亮三個房間。", "clue": "分號後面用 <i>make … power<\/i> 換句話說 generate electricity。", "elim": "(A) 浪費、(C) 藏起來、(D) 弄壞，都不會讓三個房間亮起來。"}, {"id": "9", "part": 2, "word": "benefit", "ext": false, "sentence": "One big <u>benefit<\/u> of the new lights was that children could finish their homework in the evening, which helped them do better at school.", "steps": [{"q": "What does the word <i>benefit<\/i> mean in this sentence?", "options": ["A rule you must follow", "A problem that is hard to solve", "Something good or helpful", "Money you pay for something"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>benefit<\/i>?", "options": ["\"One big\"", "\"of the new lights\"", "\"in the evening\"", "\"helped them do better at school\""], "answer": 3}], "zh": "新燈帶來的一大好處是，孩子晚上能寫完功課，這幫助他們在學校表現更好。", "clue": "<i>was that …<\/i> 後面說出好處的內容，<i>helped them do better<\/i> 表示這是好事。", "elim": "(B) 問題是壞事，和 helped 相反；(A)(D) 句子沒提到規定或付錢。"}, {"id": "10", "part": 2, "word": "routine", "ext": false, "sentence": "Debby's evening <u>routine<\/u> changed: every night she now eats dinner, reads for an hour, and then goes to bed at nine.", "steps": [{"q": "What does the word <i>routine<\/i> mean in this sentence?", "options": ["A surprise that happens only once in your life", "The usual things you do in the same order", "A long trip to another city", "A difficult test at school"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>routine<\/i>?", "options": ["\"every night she now eats dinner, reads for an hour, and then goes to bed\"", "\"Debby's evening\"", "\"changed\"", "\"at nine\""], "answer": 0}], "zh": "黛比晚上的作息改變了：現在她每天晚上吃晚餐、讀一個小時書，然後九點上床睡覺。", "clue": "冒號後面列出 <i>every night<\/i> 做的事，而且有先後順序（<i>then<\/i>），這就是「例行作息」。", "elim": "(A) <i>only once<\/i> 和 <i>every night<\/i> 矛盾；(C)(D) 句子沒提到旅行或考試。"}, {"id": "11", "part": 2, "word": "effort", "ext": false, "sentence": "Bringing light to the village took great <u>effort<\/u>: people worked hard for months, carried heavy panels up the hill, and never gave up.", "steps": [{"q": "What does the word <i>effort<\/i> mean in this sentence?", "options": ["A short rest", "A lucky accident that nobody planned", "A lot of hard work", "A small gift"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>effort<\/i>?", "options": ["\"Bringing light to the village\"", "\"people worked hard for months\"", "\"up the hill\"", "\"took great\""], "answer": 1}], "zh": "把電燈帶進村子花了很大的力氣：大家辛苦工作了好幾個月，把沉重的太陽能板扛上山，從不放棄。", "clue": "冒號後面舉例說明 effort：<i>worked hard<\/i>、<i>carried heavy panels<\/i>、<i>never gave up<\/i>。", "elim": "(A) 休息和 <i>worked hard<\/i> 相反；(B) 運氣不需要努力好幾個月；(D) 禮物和辛苦無關。"}, {"id": "12", "part": 2, "word": "improve", "ext": false, "sentence": "The lights <u>improve<\/u> life in the village; families are safer, children learn more, and shops can stay open later.", "steps": [{"q": "What does the word <i>improve<\/i> mean in this sentence?", "options": ["To make something worse", "To keep something the same", "To stop something", "To make something better"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>improve<\/i>?", "options": ["\"The lights\"", "\"families are safer\"", "\"life in the village\"", "\"stay open\""], "answer": 1}], "zh": "電燈改善了村子裡的生活；家家戶戶更安全，孩子學得更多，商店也能開得更晚。", "clue": "分號後面列出變好的地方：<i>safer<\/i>、<i>learn more<\/i>（比較級都是「更…」）。", "elim": "(A) 相反；(B)(C) 句子說的是有改變，而且變好了。"}]}, {"code": "tornado", "title": "Tornado!", "unit": "U3 W4", "parts": ["Part 1　天氣與破壞", "Part 2　龍捲風怎麼形成", "Part 3　龍捲風來了怎麼辦"], "items": [{"id": "1", "part": 0, "word": "harsh", "ext": false, "sentence": "The <u>harsh<\/u> storm brought cold rain, strong winds, and hail as big as golf balls; it was not gentle at all.", "steps": [{"q": "What does the word <i>harsh<\/i> mean in this sentence?", "options": ["Soft and gentle", "Rough and severe", "Warm, sunny, and pleasant", "Short and quiet"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>harsh<\/i>?", "options": ["\"storm brought\"", "\"it was not gentle at all\"", "\"as big as\"", "\"golf balls\""], "answer": 1}], "zh": "這場猛烈的暴風雨帶來冷雨、強風和像高爾夫球那麼大的冰雹，一點都不溫和。", "clue": "<i>not gentle at all<\/i> 是反面說明：harsh 就是「不溫和」，也就是猛烈、嚴酷。前面列出的冷雨、強風、大冰雹也支持這個意思。", "elim": "(A) 正好是 <i>not gentle<\/i> 否定掉的意思；(C)(D) 和冷雨、強風矛盾。"}, {"id": "2", "part": 0, "word": "damage", "ext": false, "sentence": "The tornado caused serious <u>damage<\/u>: roofs were torn off, windows were broken, and cars were turned upside down.", "steps": [{"q": "What does the word <i>damage<\/i> mean in this sentence?", "options": ["Rain that falls quickly", "Noise made by the wind", "Help given to people", "Harm done to things"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>damage<\/i>?", "options": ["\"The tornado caused serious\"", "\"serious\"", "\"roofs were torn off\"", "\"turned\""], "answer": 2}], "zh": "龍捲風造成嚴重的損害：屋頂被掀掉、窗戶被打破，車子也被翻了過來。", "clue": "冒號後面舉例說明 damage 的內容：東西被弄壞了。", "elim": "(C) 幫助是好事，相反；(A)(B) 雨和聲音不會「掀掉屋頂」。"}, {"id": "3", "part": 0, "word": "destroy", "ext": false, "sentence": "A strong tornado can <u>destroy<\/u> a whole town in minutes, leaving nothing but piles of broken wood where houses used to stand.", "steps": [{"q": "What does the word <i>destroy<\/i> mean in this sentence?", "options": ["To ruin something completely", "To build something new and better", "To clean something up", "To visit something"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>destroy<\/i>?", "options": ["\"in minutes\"", "\"A strong tornado\"", "\"piles of broken wood\"", "\"where houses used to stand\""], "answer": 2}], "zh": "強烈的龍捲風幾分鐘內就能摧毀整個城鎮，原本有房子的地方只剩一堆堆碎木頭。", "clue": "結果 <i>leaving nothing but piles of broken wood<\/i>（只剩碎木頭）表示房子被完全毀掉。", "elim": "(B) 蓋新的、(C) 清理，都和「只剩碎木頭」相反；(D) 拜訪不會留下碎木。"}, {"id": "4", "part": 0, "word": "debris", "ext": true, "sentence": "After the storm, the street was covered with <u>debris<\/u>, such as broken glass, pieces of roofs, and branches torn from trees.", "steps": [{"q": "What does the word <i>debris<\/i> mean in this sentence?", "options": ["Fresh snow", "Water from heavy rain", "Broken pieces left after something is destroyed", "Kind people who come to help clean up after a storm"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>debris<\/i>?", "options": ["\"After the storm, the street was covered with\"", "\"broken glass, pieces of roofs, and branches\"", "\"the street was covered\"", "\"torn\""], "answer": 1}], "zh": "暴風雨過後，街上滿是殘骸碎片，像是碎玻璃、屋頂碎片，還有從樹上扯下來的樹枝。", "clue": "<i>such as<\/i>（例如）後面舉的例子全是「壞掉的碎片」，和考卷 Q14 的 <i>such as<\/i> 線索一樣。", "elim": "(A)(B) 雪和雨水不是 broken pieces；(D) 人不會「蓋滿」街道。"}, {"id": "5", "part": 1, "word": "spinning", "ext": false, "sentence": "The <u>spinning<\/u> wind turned around and around so fast that it looked like a huge top on the ground.", "steps": [{"q": "What does the word <i>spinning<\/i> mean in this sentence?", "options": ["Blowing in a straight line", "Staying very still", "Turning around in circles", "Falling from the sky"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>spinning<\/i>?", "options": ["\"turned around and around\"", "\"so fast\"", "\"on the ground\"", "\"a huge\""], "answer": 0}], "zh": "旋轉的風一圈又一圈轉得好快，看起來就像地上一個巨大的陀螺。", "clue": "<i>turned around and around<\/i> 直接描述 spinning；<i>like a huge top<\/i>（像陀螺）也是比喻線索。", "elim": "(A) 直線不是轉圈；(B) 相反；(D) 句子說它在地上轉。"}, {"id": "6", "part": 1, "word": "funnel", "ext": false, "sentence": "From far away, the tornado looked like a <u>funnel<\/u>: wide at the top near the clouds and narrow at the bottom where it touched the ground.", "steps": [{"q": "What does the word <i>funnel<\/i> mean in this sentence?", "options": ["A tall, square building", "A shape that is wide at the top and narrow at the bottom", "A round ball", "A flat piece of paper that the strong wind blows up into the sky"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>funnel<\/i>?", "options": ["\"From far away, the tornado looked like a\"", "\"near the clouds\"", "\"wide at the top … narrow at the bottom\"", "\"the tornado looked\""], "answer": 2}], "zh": "從遠處看，龍捲風像一個漏斗：靠近雲的上面很寬，碰到地面的下面很窄。", "clue": "冒號後面描述形狀：<i>wide at the top<\/i>、<i>narrow at the bottom<\/i>。", "elim": "(A)(C)(D) 的形狀都不是上寬下窄。"}, {"id": "7", "part": 1, "word": "rotate", "ext": true, "sentence": "Inside the storm cloud, the air began to <u>rotate<\/u>, moving in a circle like the blades of a fan.", "steps": [{"q": "What does the word <i>rotate<\/i> mean in this sentence?", "options": ["To get warmer as the sun comes out", "To fall as rain", "To become quiet", "To turn around in a circle"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>rotate<\/i>?", "options": ["\"Inside the storm cloud\"", "\"moving in a circle\"", "\"the air began\"", "\"storm\""], "answer": 1}], "zh": "在暴風雲裡面，空氣開始旋轉，像電風扇的扇葉一樣繞圈。", "clue": "逗號後面 <i>moving in a circle<\/i>，再加上比喻 <i>like the blades of a fan<\/i>。", "elim": "(A)(B)(C) 都沒有「繞圈」的意思。"}, {"id": "8", "part": 1, "word": "collide", "ext": true, "sentence": "When warm, wet air from the south and cold, dry air from the north <u>collide<\/u>, they crash into each other and form giant storm clouds.", "steps": [{"q": "What does the word <i>collide<\/i> mean in this sentence?", "options": ["To hit or crash into each other", "To move away from each other slowly", "To slowly disappear", "To stay in one place"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>collide<\/i>?", "options": ["\"warm, wet air from the south\"", "\"they crash into each other\"", "\"giant storm clouds\"", "\"cold, dry air\""], "answer": 1}], "zh": "當南方溫暖潮濕的空氣和北方寒冷乾燥的空氣相撞，它們撞在一起，形成巨大的暴風雲。", "clue": "後半句用 <i>crash into each other<\/i> 換句話說 collide。課本 P233 用的是 <i>crashes with<\/i>，考卷用的是 <i>bumps into<\/i>，都是同一個意思。", "elim": "(B) 相反；(C)(D) 不會「形成暴風雲」。"}, {"id": "9", "part": 2, "word": "warning", "ext": false, "sentence": "When the radio gave a tornado <u>warning<\/u>, it meant a tornado had already been seen nearby, so everyone had to take cover right away.", "steps": [{"q": "What does the word <i>warning<\/i> mean in this sentence?", "options": ["A song played on the radio", "A report that says the storm is over and it is safe", "A message that tells people danger is near", "A plan for a school party"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>warning<\/i>?", "options": ["\"When the radio gave\"", "\"already been seen\"", "\"everyone\"", "\"it meant\""], "answer": 1}], "zh": "收音機發布龍捲風警報，代表附近已經有人看到龍捲風，所以大家必須馬上躲好。", "clue": "<i>it meant …<\/i> 後面就是解釋：<i>had already been seen nearby<\/i>。這也是 Warning 和 Watch 的差別：Warning＝已經看到了。", "elim": "(B) 暴風雨沒結束；(A)(D) 不會讓大家 <i>take cover right away<\/i>。"}, {"id": "10", "part": 2, "word": "basement", "ext": false, "sentence": "The safest place in a house is the <u>basement<\/u>, the room under the ground floor, because it has no windows and is surrounded by earth.", "steps": [{"q": "What does the word <i>basement<\/i> mean in this sentence?", "options": ["The roof of a house", "A garden outside the house", "The highest room in the house, right under the roof", "A room below the ground level of a house"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>basement<\/i>?", "options": ["\"The safest place in a house\"", "\"under the ground floor\"", "\"it has no windows\"", "\"in a house\""], "answer": 1}], "zh": "房子裡最安全的地方是地下室，就是一樓下面的房間，因為它沒有窗戶，四周都是泥土。", "clue": "同位語 <i>the room under the ground floor<\/i> 直接下定義。", "elim": "(A)(C) 高處最危險，和 <i>safest<\/i> 矛盾；(B) 花園在外面，不在 <i>in a house<\/i>。"}, {"id": "11", "part": 2, "word": "drills", "ext": false, "sentence": "Our school holds tornado <u>drills<\/u> twice a year; we practice walking quickly to the hallway and covering our heads, just in case a real tornado comes.", "steps": [{"q": "What does the word <i>drills<\/i> mean in this sentence?", "options": ["Tools that workers use to make holes in walls", "Practice for what to do in an emergency", "Science tests about weather", "Parties for students"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>drills<\/i>?", "options": ["\"twice a year\"", "\"Our school holds tornado\"", "\"we practice walking\"", "\"a real tornado\""], "answer": 2}], "zh": "我們學校一年舉辦兩次龍捲風演習；我們練習快速走到走廊、護住頭部，以防真的龍捲風來。", "clue": "分號後面 <i>we practice …<\/i> 說明 drills 就是「練習」；<i>just in case a real tornado comes<\/i> 表示現在不是真的。", "elim": "(A) drill 也有「鑽子」的意思，但這裡和 <i>practice<\/i> 連在一起，是演習；(C)(D) 句子沒提到考試或派對。"}, {"id": "12", "part": 2, "word": "siren", "ext": true, "sentence": "When the town's <u>siren<\/u> began to wail, its loud, rising sound warned everyone to get inside immediately.", "steps": [{"q": "What does the word <i>siren<\/i> mean in this sentence?", "options": ["A machine that makes a loud warning sound", "A small bird that sings loudly early in the morning", "A kind of storm cloud", "A person who reads the news"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>siren<\/i>?", "options": ["\"When the town's\"", "\"began to\"", "\"loud, rising sound\"", "\"to get inside immediately\""], "answer": 2}], "zh": "鎮上的警報器開始鳴響，它越來越大的聲音警告大家馬上進到室內。", "clue": "<i>its loud, rising sound warned everyone<\/i> 說出它會發出很大的聲音，用途是警告。", "elim": "(B) 鳥不會警告全鎮；(C) 雲不會發出聲音；(D) its sound 指的是東西，不是人。"}]}, {"code": "wild", "title": "Wild Weather", "unit": "U3 W4 文選", "parts": ["Part 1　各種狂暴天氣", "Part 2　暴風雪與颶風", "Part 3　預測天氣"], "items": [{"id": "1", "part": 0, "word": "sudden", "ext": false, "sentence": "The <u>sudden<\/u> storm surprised everyone at the picnic; one minute the sky was clear, and the next minute heavy rain was pouring down.", "steps": [{"q": "What does the word <i>sudden<\/i> mean in this sentence?", "options": ["Happening quickly and without warning", "Slow and expected, so everyone was ready for it", "Very quiet and calm", "Warm and pleasant"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>sudden<\/i>?", "options": ["\"at the picnic\"", "\"one minute … the next\"", "\"heavy rain\"", "\"heavy rain was pouring down\""], "answer": 1}], "zh": "這場突如其來的暴風雨讓野餐的人都嚇一跳；前一分鐘天空還很晴朗，下一分鐘就下起大雨。", "clue": "<i>one minute … the next minute<\/i> 表示變化很快；<i>surprised everyone<\/i> 表示大家沒料到。", "elim": "(B) 和 <i>surprised<\/i> 矛盾；(C)(D) 和大雨矛盾。"}, {"id": "2", "part": 0, "word": "bolt", "ext": false, "sentence": "A <u>bolt<\/u> of lightning flashed across the sky, a single bright line of electricity that lit up the whole town for a second.", "steps": [{"q": "What does the word <i>bolt<\/i> mean in this sentence?", "options": ["The loud, booming sound you hear after lightning", "A dark cloud full of rain", "A single bright streak of lightning", "A drop of rain"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>bolt<\/i>?", "options": ["\"a single bright line\"", "\"the whole town\"", "\"the whole town for a second\"", "\"across the\""], "answer": 0}], "zh": "一道閃電劃過天空，那一條明亮的電光讓整個城鎮亮了一秒鐘。", "clue": "同位語 <i>a single bright line of electricity<\/i> 說明 bolt 是「一道」閃電。", "elim": "(A) 雷聲是 thunder，不是 bright line；(B)(D) 不會發光。"}, {"id": "3", "part": 0, "word": "whirl", "ext": false, "sentence": "The winds of a tornado <u>whirl<\/u> around the center like water going down a drain, spinning faster and faster.", "steps": [{"q": "What does the word <i>whirl<\/i> mean in this sentence?", "options": ["To stop suddenly", "To blow gently like a spring breeze", "To fall to the ground", "To spin around quickly"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>whirl<\/i>?", "options": ["\"The winds of a tornado\"", "\"spinning faster\"", "\"the center\"", "\"going down\""], "answer": 1}], "zh": "龍捲風的風繞著中心打轉，像水流進排水孔那樣，轉得越來越快。", "clue": "<i>spinning faster and faster<\/i> 換句話說 whirl；比喻 <i>like water going down a drain<\/i> 也是在描述打轉。", "elim": "(A)(B) 和 <i>faster and faster<\/i> 矛盾；(C) 句子說的是繞圈。"}, {"id": "4", "part": 0, "word": "flood", "ext": true, "sentence": "After three days of heavy rain, the river rose over its banks and caused a <u>flood<\/u>; water covered the streets and poured into people's homes.", "steps": [{"q": "What does the word <i>flood<\/i> mean in this sentence?", "options": ["A lot of water covering land that is usually dry", "A long time with no rain at all, so the land is dry", "A strong, cold wind", "A kind of heavy snow"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>flood<\/i>?", "options": ["\"After three days\"", "\"the river\"", "\"water covered the streets and poured into people's homes\"", "\"caused a\""], "answer": 2}], "zh": "連下三天大雨後，河水漫過河岸，造成水災；水淹沒了街道，還灌進大家的家裡。", "clue": "分號後面描述 flood 的樣子：街道被水蓋住、水流進房子。", "elim": "(B) 沒下雨是乾旱，和 <i>heavy rain<\/i> 相反；(C)(D) 不是水。"}, {"id": "5", "part": 1, "word": "blanketed", "ext": false, "sentence": "Heavy snow <u>blanketed<\/u> the town overnight; by morning, every road, car, and rooftop was covered with a thick white layer.", "steps": [{"q": "What does the word <i>blanketed<\/i> mean in this sentence?", "options": ["Melted away quickly", "Warmed up", "Cleaned", "Covered completely"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>blanketed<\/i>?", "options": ["\"overnight\"", "\"Heavy snow\"", "\"every road, car, and rooftop was covered with a thick white layer\"", "\"by morning\""], "answer": 2}], "zh": "一夜之間大雪覆蓋了整個小鎮；到了早上，每條路、每輛車和每個屋頂都蓋上一層厚厚的白雪。", "clue": "分號後面 <i>was covered with a thick white layer<\/i>。blanket（毯子）當動詞，就是「像毯子一樣蓋住」。", "elim": "(A)(B) 雪還在、沒有融化；(C) 句子沒有清理。"}, {"id": "6", "part": 1, "word": "blizzard", "ext": true, "sentence": "The <u>blizzard<\/u> lasted two days; strong winds blew heavy snow so hard that people could not see their own hands.", "steps": [{"q": "What does the word <i>blizzard<\/i> mean in this sentence?", "options": ["A hot, dry day", "A heavy snowstorm with strong winds", "A light spring rain that helps flowers grow", "A rainbow after a storm"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>blizzard<\/i>?", "options": ["\"strong winds blew heavy snow\"", "\"lasted two days\"", "\"their own hands\"", "\"so hard that\""], "answer": 0}], "zh": "這場暴風雪持續了兩天；強風把大雪吹得好猛，大家連自己的手都看不見。", "clue": "分號後面說明 blizzard 的兩個特徵：<i>strong winds<\/i>＋<i>heavy snow<\/i>。", "elim": "(A)(C)(D) 都不是又有強風又有大雪。"}, {"id": "7", "part": 1, "word": "homeless", "ext": false, "sentence": "After the hurricane, many families were left <u>homeless<\/u> because the floodwater had destroyed their houses, and they had to sleep in schools and gyms.", "steps": [{"q": "What does the word <i>homeless<\/i> mean in this sentence?", "options": ["Having a lot of money", "Having many pets", "Having no place to live", "Having no food to eat for days"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>homeless<\/i>?", "options": ["\"After the hurricane, many families\"", "\"many families\"", "\"were left\"", "\"destroyed their houses\""], "answer": 3}], "zh": "颶風過後，很多家庭無家可歸，因為洪水毀了他們的房子，他們只好睡在學校和體育館裡。", "clue": "<i>because<\/i> 後面說原因：房子被毀了。<i>had to sleep in schools and gyms<\/i> 也支持這個意思。拆字：home＋-less（沒有）＝沒有家。", "elim": "(D) 句子沒提到食物，只說房子被毀；(A)(B) 和災難無關。"}, {"id": "8", "part": 1, "word": "prevent", "ext": false, "sentence": "No one can <u>prevent<\/u> a hurricane from forming, but people can stop some harm by boarding up windows and leaving early.", "steps": [{"q": "What does the word <i>prevent<\/i> mean in this sentence?", "options": ["To watch something carefully on a screen", "To stop something from happening", "To make something bigger", "To enjoy something"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>prevent<\/i>?", "options": ["\"No one can\"", "\"a hurricane\"", "\"people can stop some harm\"", "\"leaving early\""], "answer": 2}], "zh": "沒有人能阻止颶風形成，但人們可以釘住窗戶、提早離開，來阻止一些傷害。", "clue": "<i>but<\/i> 後面用 <i>stop<\/i> 對應前面的 prevent：颶風「擋不住」，但傷害「擋得住一些」。", "elim": "(A) 觀察颶風是做得到的，和 <i>No one can<\/i> 矛盾；(C)(D) 說不通。"}, {"id": "9", "part": 2, "word": "predict", "ext": false, "sentence": "Weather scientists <u>predict<\/u> tomorrow's weather by studying today's clouds, winds, and temperatures, then telling us what will probably happen.", "steps": [{"q": "What does the word <i>predict<\/i> mean in this sentence?", "options": ["To say what will happen before it happens", "To forget what happened yesterday or last week", "To change the weather", "To stop the rain"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>predict<\/i>?", "options": ["\"Weather scientists\"", "\"telling us what will probably happen\"", "\"today's clouds\"", "\"by studying\""], "answer": 1}], "zh": "氣象科學家研究今天的雲、風和溫度，來預測明天的天氣，再告訴我們可能會發生什麼。", "clue": "<i>telling us what will probably happen<\/i> 就是 predict；拆字：pre-（事先）＋ dict（說）＝事先說。", "elim": "(C)(D) 科學家沒辦法改變或停止天氣；(B) 是過去，不是 <i>tomorrow<\/i>。"}, {"id": "10", "part": 2, "word": "meteorologist", "ext": true, "sentence": "A <u>meteorologist<\/u> is a scientist who studies the air and the weather; she uses radar and computers to make forecasts.", "steps": [{"q": "What does the word <i>meteorologist<\/i> mean in this sentence?", "options": ["A doctor for animals", "A pilot who flies planes through storms", "A teacher of music", "A scientist who studies weather"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>meteorologist<\/i>?", "options": ["\"a scientist who studies the air and the weather\"", "\"she uses\"", "\"computers\"", "\"make\""], "answer": 0}], "zh": "氣象學家是研究空氣和天氣的科學家；她用雷達和電腦做天氣預報。", "clue": "<i>is a scientist who …<\/i> 直接下定義。學校考卷 Q3 也考過這個字（氣象學者）。", "elim": "(A)(B)(C) 都不研究天氣，也不做 forecasts。"}, {"id": "11", "part": 2, "word": "track", "ext": false, "sentence": "Radar helps forecasters <u>track<\/u> a storm, following its path hour by hour so they know where it will go next.", "steps": [{"q": "What does the word <i>track<\/i> mean in this sentence?", "options": ["To stop something", "To create a new storm with special machines", "To follow and watch where something moves", "To hide something"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>track<\/i>?", "options": ["\"Radar helps forecasters\"", "\"a storm\"", "\"following its path\"", "\"next\""], "answer": 2}], "zh": "雷達幫助預報員追蹤暴風雨，一小時一小時跟著它的路線，這樣就知道它接下來會往哪裡去。", "clue": "逗號後面 <i>following its path<\/i> 換句話說 track。", "elim": "(A)(B) 雷達不能阻止或製造暴風雨；(D) 和「知道它往哪去」相反。"}, {"id": "12", "part": 2, "word": "wind vane", "ext": false, "sentence": "A <u>wind vane<\/u> on top of the school turns to point in the direction the wind is coming from, so we know if it is a north wind or a south wind.", "steps": [{"q": "What does <i>wind vane<\/i> mean in this sentence?", "options": ["A tool that shows which way the wind is blowing", "A tool that measures how much rain has fallen today", "A flag for a sports team", "A kind of electric fan"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>wind vane<\/i>?", "options": ["\"on top of the school\"", "\"turns to point in the direction the wind is coming from\"", "\"a south wind\"", "\"so we know\""], "answer": 1}], "zh": "學校屋頂上的風向標會轉向風吹來的方向，讓我們知道吹的是北風還是南風。", "clue": "<i>turns to point in the direction the wind is coming from<\/i> 說明它的功能。", "elim": "(B) 量雨的是雨量計；(D) 電風扇是製造風，不是指出風向。"}]}, {"code": "beat", "title": "They've Got the Beat!", "unit": "U3 W5", "parts": ["Part 1　上台表演與心情", "Part 2　聲部與節奏", "Part 3　練習與表達"], "items": [{"id": "1", "part": 0, "word": "chorus", "ext": false, "sentence": "Our school <u>chorus<\/u> has forty students who sing together in groups at every holiday concert.", "steps": [{"q": "What does the word <i>chorus<\/i> mean in this sentence?", "options": ["A group of people who sing together", "A person who plays the piano alone on stage", "A song with no words", "A music classroom"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>chorus<\/i>?", "options": ["\"Our school\"", "\"at every\"", "\"holiday concert\"", "\"sing together\""], "answer": 3}], "zh": "我們學校的合唱團有四十個學生，每次節日音樂會都分組一起唱歌。", "clue": "<i>who sing together<\/i>（一起唱歌的人）直接說明 chorus。", "elim": "(B) <i>alone<\/i> 和 <i>together<\/i> 相反；(C)(D) 不是「一群人」。"}, {"id": "2", "part": 0, "word": "audience", "ext": false, "sentence": "The <u>audience<\/u> clapped and cheered from their seats when the singers walked onto the stage.", "steps": [{"q": "What does the word <i>audience<\/i> mean in this sentence?", "options": ["The people who sing and dance on the stage", "The teachers who train the singers", "The seats in a theater", "The people who watch or listen to a show"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>audience<\/i>?", "options": ["\"clapped and cheered\"", "\"the singers\"", "\"walked onto the stage\"", "\"when\""], "answer": 0}], "zh": "歌手走上舞台時，觀眾坐在座位上拍手歡呼。", "clue": "坐在座位上（<i>from their seats<\/i>）拍手歡呼的人，就是觀眾。", "elim": "(A) 表演的是 <i>the singers<\/i>，不是 audience；(C) 座位不會拍手；(B) 句子沒提到老師。"}, {"id": "3", "part": 0, "word": "nervous", "ext": false, "sentence": "Before the show, Brianna felt <u>nervous<\/u>; her hands were shaking and her heart was beating fast because so many people were watching.", "steps": [{"q": "What does the word <i>nervous<\/i> mean in this sentence?", "options": ["Calm, relaxed, and ready to sing", "Sleepy and tired", "Worried and a little afraid", "Angry at someone"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>nervous<\/i>?", "options": ["\"Before the show, Brianna felt\"", "\"her hands were shaking\"", "\"so many people\"", "\"felt\""], "answer": 1}], "zh": "表演前，布莉安娜覺得很緊張；因為有好多人在看，她的手在發抖，心跳得好快。", "clue": "分號後面描述身體反應：手抖、心跳快，這是緊張的樣子。", "elim": "(A) 相反；(B) 想睡不會心跳快；(D) 句子沒有生誰的氣。"}, {"id": "4", "part": 0, "word": "recalls", "ext": false, "sentence": "Grandma often <u>recalls<\/u> her first concert; she remembers the bright lights and tells us the story again and again.", "steps": [{"q": "What does the word <i>recalls<\/i> mean in this sentence?", "options": ["Forgets something", "Calls someone on the phone again and again after a concert", "Plans something for the future", "Remembers and talks about something from the past"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>recalls<\/i>?", "options": ["\"she remembers\"", "\"her first concert\"", "\"Grandma often\"", "\"again and again\""], "answer": 0}], "zh": "奶奶常常回想她的第一場音樂會；她記得那些明亮的燈光，一次又一次跟我們講這個故事。", "clue": "分號後面用 <i>remembers<\/i> 換句話說 recalls；<i>tells us the story<\/i> 是「說出來」。", "elim": "(B) re-call 不是「打電話」，小心拆字拆錯；(A) 相反；(C) <i>first concert<\/i> 是過去的事。"}, {"id": "5", "part": 0, "word": "applause", "ext": true, "sentence": "When the song ended, the room was filled with loud <u>applause<\/u> as hundreds of people clapped their hands to show they loved it.", "steps": [{"q": "What does the word <i>applause<\/i> mean in this sentence?", "options": ["Loud crying", "Clapping to show you like something", "Singing along with the band at the end of a song", "A quiet whisper"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>applause<\/i>?", "options": ["\"When the song ended\"", "\"the room was filled\"", "\"clapped their hands\"", "\"loved it\""], "answer": 2}], "zh": "歌一唱完，整個房間響起熱烈的掌聲，好幾百人拍手表示他們很喜歡。", "clue": "<i>as<\/i> 後面說明 applause 是什麼：<i>clapped their hands<\/i>。", "elim": "(A) 哭和 <i>loved it<\/i> 不合；(D) 和 <i>loud<\/i> 相反；(C) 句子說的是拍手不是唱歌。"}, {"id": "6", "part": 1, "word": "sopranos", "ext": false, "sentence": "In a chorus, the <u>sopranos<\/u> sing the highest notes, while the altos sing lower ones.", "steps": [{"q": "What does the word <i>sopranos<\/i> mean in this sentence?", "options": ["Singers with the highest voices", "Singers with the lowest, deepest voices", "People who play the drums", "People who write songs"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>sopranos<\/i>?", "options": ["\"sing the highest notes\"", "\"In a chorus\"", "\"the altos\"", "\"lower ones\""], "answer": 0}], "zh": "在合唱團裡，女高音唱最高的音，而女低音唱比較低的音。", "clue": "<i>sing the highest notes<\/i> 直接說明；<i>while<\/i>（而）後面是對比，altos 唱低的。", "elim": "(B) 是 altos 那一邊的說明，小心看錯人；(C)(D) 不是歌手。"}, {"id": "7", "part": 1, "word": "rhythm", "ext": false, "sentence": "The drummer kept a steady <u>rhythm<\/u>, boom, tap, boom, tap, a pattern of beats that repeated so everyone could stay together.", "steps": [{"q": "What does the word <i>rhythm<\/i> mean in this sentence?", "options": ["A loud scream", "The words of a song that the singers must learn", "A music teacher", "A pattern of sounds or beats that repeats"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>rhythm<\/i>?", "options": ["\"The drummer kept\"", "\"a pattern of beats\"", "\"so everyone could stay together\"", "\"steady\""], "answer": 1}], "zh": "鼓手打出穩定的節奏，咚、嗒、咚、嗒，一組一直重複的節拍，讓大家能跟上一起唱。", "clue": "同位語 <i>a pattern of beats that repeated<\/i> 直接下定義；<i>boom, tap, boom, tap<\/i> 是例子。", "elim": "(A) 尖叫沒有規律；(B) 歌詞不是 beats；(C) 是人，不是聲音。"}, {"id": "8", "part": 1, "word": "instruments", "ext": false, "sentence": "Drums, pianos, and violins are all musical <u>instruments<\/u>, things people play to make music.", "steps": [{"q": "What does the word <i>instruments<\/i> mean in this sentence?", "options": ["Songs that people sing at a holiday concert", "Singers in a band", "Objects that people play to make music", "Tickets for a concert"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>instruments<\/i>?", "options": ["\"are all\"", "\"things people play to make music\"", "\"people\"", "\"make\""], "answer": 1}], "zh": "鼓、鋼琴和小提琴都是樂器，也就是人們拿來演奏音樂的東西。", "clue": "同位語 <i>things people play to make music<\/i> 下定義；前面舉的例子 <i>Drums, pianos, and violins<\/i> 也是線索。", "elim": "(A)(B) 歌和歌手不是 things you play；(D) 票不能演奏。"}, {"id": "9", "part": 1, "word": "harmony", "ext": true, "sentence": "When the sopranos and altos sang different notes at the same time, the sounds fit together so beautifully that the <u>harmony<\/u> gave everyone goosebumps.", "steps": [{"q": "What does the word <i>harmony<\/i> mean in this sentence?", "options": ["Different notes that sound pleasant together", "Notes sung one by one by a single person, alone", "A mistake in a song", "Silence between two songs"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>harmony<\/i>?", "options": ["\"gave everyone goosebumps\"", "\"When the sopranos and altos\"", "\"so beautifully\"", "\"the sounds fit together\""], "answer": 3}], "zh": "當女高音和女低音同時唱不同的音，聲音搭配得好美，這樣的和聲讓大家都起雞皮疙瘩。", "clue": "<i>different notes at the same time<\/i>、<i>fit together<\/i> 說明 harmony 是「不同的音同時唱，而且好聽」。", "elim": "(B) <i>one by one<\/i> 和 <i>at the same time<\/i> 相反；(C) 和 <i>beautifully<\/i> 相反；(D) 有聲音，不是安靜。"}, {"id": "10", "part": 2, "word": "practice", "ext": false, "sentence": "The singers <u>practice<\/u> for three hours every week, singing the same songs again and again until they get every note right.", "steps": [{"q": "What does the word <i>practice<\/i> mean in this sentence?", "options": ["To give up because something is much too difficult", "To listen only once", "To forget the words", "To do something again and again to get better"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>practice<\/i>?", "options": ["\"for three hours every week\"", "\"again and again\"", "\"every week\"", "\"The singers\""], "answer": 1}], "zh": "歌手每週練習三個小時，同樣的歌唱了一遍又一遍，直到每個音都唱對。", "clue": "<i>again and again until they get every note right<\/i>：重複做到正確，就是練習。", "elim": "(A) 和 <i>until … right<\/i> 相反；(B) <i>only once<\/i> 和 <i>again and again<\/i> 相反；(C) 說不通。"}, {"id": "11", "part": 2, "word": "express", "ext": false, "sentence": "Dancers <u>express<\/u> their feelings with their bodies; a jump can show joy, and slow, heavy steps can show sadness.", "steps": [{"q": "What does the word <i>express<\/i> mean in this sentence?", "options": ["To show what you think or feel", "To hide your feelings", "To travel very fast, like a train", "To buy something"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>express<\/i>?", "options": ["\"a jump can show joy\"", "\"Dancers\"", "\"with their bodies\"", "\"their feelings with their bodies\""], "answer": 0}], "zh": "舞者用身體表達感受；跳起來可以表現快樂，緩慢沉重的步伐可以表現難過。", "clue": "分號後面舉例，兩次用到 <i>show<\/i>，express＝show 出感受。", "elim": "(B) 相反；(C) express 也有「快車」的意思，但這裡接 <i>their feelings<\/i>；(D) 說不通。"}, {"id": "12", "part": 2, "word": "disagree", "ext": false, "sentence": "The two singers often <u>disagree<\/u> before a show: Mia thinks the song should be fast, but Leo thinks it should be slow.", "steps": [{"q": "What does the word <i>disagree<\/i> mean in this sentence?", "options": ["To have the same idea as someone", "To sing very loudly", "To have different ideas", "To laugh together"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>disagree<\/i>?", "options": ["\"often\"", "\"before a show\"", "\"The two singers\"", "\"fast … slow\""], "answer": 3}], "zh": "這兩位歌手表演前常常意見不合：米亞覺得這首歌要唱快，里歐卻覺得要唱慢。", "clue": "冒號後面的例子，用 <i>but<\/i> 對比兩人想法相反。拆字：dis-（不）＋ agree（同意）。", "elim": "(A) 正好相反；(B)(D) 和想法不同無關。"}, {"id": "13", "part": 2, "word": "rehearse", "ext": true, "sentence": "Before the big concert, the chorus will <u>rehearse<\/u> on the real stage, practicing every song from start to finish one last time.", "steps": [{"q": "What does the word <i>rehearse<\/i> mean in this sentence?", "options": ["To practice a show before the real performance", "To buy tickets for a show", "To clean the stage", "To stop a show early because the singers are tired"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>rehearse<\/i>?", "options": ["\"the chorus will\"", "\"on the real stage\"", "\"one last time\"", "\"practicing every song from start to finish\""], "answer": 3}], "zh": "大型音樂會之前，合唱團會在真正的舞台上彩排，把每首歌從頭到尾最後練一次。", "clue": "逗號後面 <i>practicing every song<\/i> 換句話說 rehearse；<i>Before the big concert<\/i> 說明是正式演出「之前」。", "elim": "(B)(C)(D) 都不是 practicing。"}]}, {"code": "enjoymusic", "title": "Many Ways to Enjoy Music", "unit": "U3 W5 文選", "parts": ["Part 1　聽障樂迷與演唱會", "Part 2　看得見、摸得到的音樂", "Part 3　樂團與聲音"], "items": [{"id": "1", "part": 0, "word": "deaf", "ext": false, "sentence": "My grandfather became <u>deaf<\/u> after working in a noisy factory for many years, so now we write notes or use our hands when we want to talk to him.", "steps": [{"q": "What does the word <i>deaf<\/i> mean in this sentence?", "options": ["Unable to see clearly without glasses", "Very tired after a long day of work", "Unable to hear", "Angry and unwilling to talk"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>deaf<\/i>?", "options": ["\"My grandfather\"", "\"for many years\"", "\"write notes or use our hands\"", "\"talk to him\""], "answer": 2}], "zh": "我爺爺在吵鬧的工廠工作很多年後耳朵聽不見了，所以現在我們想跟他說話時，會寫紙條或用手比。", "clue": "要「寫紙條、用手比」才能溝通，表示他聽不到；<i>noisy factory<\/i>（吵鬧的工廠）是原因。", "elim": "(A) 看不清楚和寫紙條矛盾（他要看紙條）；(B) 是 <i>working<\/i> 的拆字陷阱；(D) 句子沒說他不想說話。"}, {"id": "2", "part": 0, "word": "sensed", "ext": false, "sentence": "Even before the teacher said a word, Mia <u>sensed<\/u> that something was wrong; the room was too quiet, and everyone was staring at the broken window.", "steps": [{"q": "What does the word <i>sensed<\/i> mean in this sentence?", "options": ["Said loudly to everyone", "Felt or noticed without being told", "Forgot about quickly", "Fixed with her own hands"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>sensed<\/i>?", "options": ["\"Even before the teacher said a word\"", "\"Mia\"", "\"the teacher\"", "\"wrong\""], "answer": 0}], "zh": "老師還沒開口，Mia 就感覺到有什麼不對勁了；教室太安靜，大家都盯著那扇破掉的窗戶。", "clue": "<i>Even before the teacher said a word<\/i>（還沒有人告訴她）＋後面她「看到、感覺到」的細節（太安靜、大家盯著窗戶）。", "elim": "(A) 她沒有說話；(C) 和後面一連串觀察矛盾；(D) 是 <i>broken window<\/i> 的陷阱，句子沒說她修窗戶。"}, {"id": "3", "part": 0, "word": "booms", "ext": false, "sentence": "When the fireworks show starts, a deep sound <u>booms<\/u> across the river, so loud that the windows shake and the babies start to cry.", "steps": [{"q": "What does the word <i>booms<\/i> mean in this sentence?", "options": ["Shines with many bright colors in the dark sky", "Floats slowly on the water", "Whispers softly", "Makes a very loud, deep noise"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>booms<\/i>?", "options": ["\"show starts\"", "\"across the river\"", "\"so loud that the windows shake\"", "\"the babies\""], "answer": 2}], "zh": "煙火秀一開始，低沉的聲音轟隆隆地傳過河面，大聲到窗戶都在震，小嬰兒也哭了起來。", "clue": "主詞是 <i>a deep sound<\/i>（低沉的聲音），後面 <i>so loud that the windows shake<\/i> 說明有多大聲。", "elim": "(A) 是 <i>fireworks<\/i> 的陷阱，但主詞是「聲音」不是煙火；(B) 是 <i>river<\/i> 的陷阱；(C) 輕聲細語和「窗戶震動」矛盾。"}, {"id": "4", "part": 0, "word": "interpreter", "ext": false, "sentence": "At the hospital, an <u>interpreter<\/u> helped the Japanese tourist talk to the doctor, changing every Japanese word into Chinese so both of them could understand each other.", "steps": [{"q": "What does the word <i>interpreter<\/i> mean in this sentence?", "options": ["A nurse who takes care of sick people in the hospital at night", "A person who changes words from one language into another", "A tour guide who shows visitors around a city", "A doctor"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>interpreter<\/i>?", "options": ["\"At the hospital\"", "\"helped\"", "\"the doctor\"", "\"changing every Japanese word into Chinese\""], "answer": 3}], "zh": "在醫院裡，一位口譯員幫那位日本遊客和醫生溝通，把每一句日文翻成中文，讓兩人都能聽懂對方。", "clue": "<i>changing every Japanese word into Chinese<\/i>（把日文換成中文）＋ <i>so both of them could understand<\/i>。課文裡的 interpreter 是「手語翻譯員」，把歌詞換成手語，道理一樣。", "elim": "(A) 是 <i>hospital<\/i> 的陷阱；(C) 是 <i>tourist<\/i> 的陷阱；(D) 醫生是被幫忙溝通的另一方。"}, {"id": "5", "part": 1, "word": "swaying", "ext": false, "sentence": "The tall grass was <u>swaying<\/u> in the wind, moving slowly from side to side like dancers at a slow concert.", "steps": [{"q": "What does the word <i>swaying<\/i> mean in this sentence?", "options": ["Growing taller every day", "Being cut short by a machine", "Moving gently from side to side", "Turning brown and dry because there is no rain"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>swaying<\/i>?", "options": ["\"moving slowly from side to side\"", "\"The tall grass\"", "\"was\"", "\"concert\""], "answer": 0}], "zh": "高高的草在風中搖擺，像慢歌演唱會上的舞者一樣，慢慢地左右擺動。", "clue": "同位說明 <i>moving slowly from side to side<\/i>，再加上比喻 <i>like dancers<\/i>。", "elim": "(A) 是 <i>tall<\/i> 的陷阱；(B)(D) 和「在風中慢慢左右動」無關。"}, {"id": "6", "part": 1, "word": "communicate", "ext": false, "sentence": "Dolphins <u>communicate<\/u> with each other by making clicks and whistles, and scientists believe each dolphin even has its own special whistle like a name.", "steps": [{"q": "What does the word <i>communicate<\/i> mean in this sentence?", "options": ["Swim very fast together", "Fight", "Share messages or information", "Look for food in the deep ocean at night"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>communicate<\/i>?", "options": ["\"Dolphins\"", "\"scientists believe\"", "\"even\"", "\"with each other by making clicks and whistles\""], "answer": 3}], "zh": "海豚靠發出喀喀聲和哨音彼此溝通，科學家認為每隻海豚甚至都有一個像名字一樣的專屬哨音。", "clue": "<i>with each other<\/i>（彼此）＋ <i>by making clicks and whistles<\/i>（用聲音），後面「像名字一樣的哨音」也表示在傳遞訊息。", "elim": "(A)(D) 是海豚常做的事，但和「發出聲音給對方」無關；(B) 句子沒有吵架的意思。"}, {"id": "7", "part": 1, "word": "technology", "ext": false, "sentence": "Thanks to new <u>technology<\/u>, my grandma can now video-call us from Kaohsiung with her smartphone and see our faces as if we were in the same room.", "steps": [{"q": "What does the word <i>technology<\/i> mean in this sentence?", "options": ["Old family photos", "A fast train that goes from Kaohsiung to Taipei in less than two hours", "Good luck", "Machines and tools made with science, like phones and computers"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>technology<\/i>?", "options": ["\"my grandma\"", "\"video-call us … with her smartphone\"", "\"from Kaohsiung\"", "\"the same room\""], "answer": 1}], "zh": "多虧了新科技，我奶奶現在可以在高雄用智慧型手機和我們視訊，好像我們在同一個房間一樣看到我們的臉。", "clue": "<i>video-call<\/i>（視訊）和 <i>smartphone<\/i>（智慧型手機）都是科技產品的例子。", "elim": "(A) 照片不能視訊；(B) 是 <i>Kaohsiung<\/i> 的陷阱，高鐵不能讓人看到臉；(C) <i>Thanks to<\/i> 後面接的是讓她做到這件事的東西，不是運氣。"}, {"id": "8", "part": 2, "word": "orchestra", "ext": false, "sentence": "The school <u>orchestra<\/u> has forty students who play violins, flutes, trumpets, and drums together, and they practice every Tuesday to get ready for the spring concert.", "steps": [{"q": "What does the word <i>orchestra<\/i> mean in this sentence?", "options": ["A large group of musicians who play many instruments together", "A singer", "A music classroom", "A sports team that plays basketball after school every Friday"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>orchestra<\/i>?", "options": ["\"The school\"", "\"has\"", "\"play violins, flutes, trumpets, and drums together\"", "\"every Tuesday\""], "answer": 2}], "zh": "學校的管弦樂團有四十個學生，他們一起演奏小提琴、長笛、小號和鼓，每週二練習，準備春季音樂會。", "clue": "<i>forty students who play … together<\/i>（一群人一起演奏）＋ 各種樂器的例子。", "elim": "(B) 一個人不是四十人；(C) 教室是地方不是一群人；(D) 是 <i>practice every Tuesday<\/i> 的陷阱，球隊也會練習但不會演奏樂器。"}, {"id": "9", "part": 2, "word": "percussion", "ext": false, "sentence": "In the <u>percussion<\/u> section, Leo hits the big drum, his sister shakes the maracas, and I strike the triangle with a small metal stick.", "steps": [{"q": "What does the word <i>percussion<\/i> mean in this sentence?", "options": ["Instruments you play by blowing air into them with your mouth", "Instruments you play by hitting, shaking, or striking them", "Instruments with strings", "The seats for the audience"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>percussion<\/i>?", "options": ["\"hits … shakes … strike\"", "\"section\"", "\"his sister\"", "\"Leo\""], "answer": 0}], "zh": "在打擊樂聲部，Leo 敲大鼓，他妹妹搖沙鈴，我用小金屬棒敲三角鐵。", "clue": "三個動作 <i>hits<\/i>、<i>shakes<\/i>、<i>strike<\/i> 都是「敲、搖」，再加上鼓、沙鈴、三角鐵三個例子。課文長條圖裡 percussion 是樂器最少的聲部。", "elim": "(A) 是木管、銅管（woodwind、brass）；(C) 是弦樂（string）；(D) 是 <i>section<\/i>（區）的陷阱，但這裡指樂團的聲部。"}, {"id": "10", "part": 2, "word": "strummed", "ext": false, "sentence": "Sitting by the campfire, Uncle Jay <u>strummed<\/u> his guitar with his fingers, brushing lightly across all six strings while we sang along.", "steps": [{"q": "What does the word <i>strummed<\/i> mean in this sentence?", "options": ["Cleaned carefully with a soft cloth", "Broke into many small pieces by accident when it fell", "Played by brushing fingers across the strings", "Carried on his back"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>strummed<\/i>?", "options": ["\"Sitting by the campfire\"", "\"brushing lightly across all six strings\"", "\"Uncle Jay\"", "\"his\""], "answer": 1}], "zh": "坐在營火旁，Jay 叔叔用手指刷著吉他，輕輕掃過全部六條弦，我們跟著一起唱。", "clue": "<i>with his fingers<\/i>、<i>brushing lightly across all six strings<\/i> 說明動作；<i>while we sang along<\/i> 表示他在彈奏。", "elim": "(A) 是 <i>brushing<\/i>（刷）的陷阱，但刷的是弦不是擦乾淨；(B)(D) 都不會讓大家跟著唱。"}, {"id": "11", "part": 2, "word": "vibrations", "ext": false, "sentence": "When you put your hand on a speaker playing loud music, you can feel tiny <u>vibrations<\/u>, quick shakes that go back and forth again and again.", "steps": [{"q": "What does the word <i>vibrations<\/i> mean in this sentence?", "options": ["Bright lights", "Quick back-and-forth movements", "Small holes on a speaker", "Songs that are popular with teenagers all over the world"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>vibrations<\/i>?", "options": ["\"put your hand\"", "\"on a\"", "\"quick shakes that go back and forth\"", "\"you can\""], "answer": 2}], "zh": "把手放在播著大聲音樂的喇叭上，你會感覺到細微的振動，就是一次又一次快速來回的抖動。", "clue": "同位語 <i>quick shakes that go back and forth<\/i> 直接解釋 vibrations；課文 <i>Energy You Hear<\/i> 也說 <i>back and forth movements are called vibrations<\/i>。", "elim": "(A) 光不能用手摸到；(C) 是 <i>speaker<\/i> 的陷阱；(D) 是 <i>loud music<\/i> 的陷阱。"}, {"id": "12", "part": 2, "word": "echo", "ext": true, "sentence": "When we shouted \"Hello!\" inside the empty cave, the <u>echo<\/u> came back to us a second later, and my little brother thought another kid was hiding in there.", "steps": [{"q": "What does the word <i>echo<\/i> mean in this sentence?", "options": ["A bat that lives in a cave", "A dark hole in the side of a mountain where animals sleep", "A sound that bounces back so you hear it again", "A loud scream of fear"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>echo<\/i>?", "options": ["\"inside\"", "\"shouted\"", "\"came back to us a second later\"", "\"When we\""], "answer": 2}], "zh": "我們在空蕩蕩的山洞裡大喊「哈囉！」，一秒後回音傳回來，我弟弟還以為裡面躲著另一個小孩。", "clue": "<i>came back to us a second later<\/i>（一秒後傳回來），加上弟弟以為「有人在回話」。", "elim": "(A)(B) 是 <i>cave<\/i> 的陷阱；(D) 尖叫是第一次發出的聲音，不會「傳回來」。"}]}, {"code": "alaska", "title": "Alaska: A Special Place", "unit": "U4 W1", "parts": ["Part 1　阿拉斯加的地形", "Part 2　溫度與動物", "Part 3　白天與黑夜"], "items": [{"id": "1", "part": 0, "word": "location", "ext": false, "sentence": "The map shows the exact <u>location<\/u> of the volcano; it is the place marked with a red star, near the coast.", "steps": [{"q": "What does the word <i>location<\/i> mean in this sentence?", "options": ["A type of mountain", "A particular place where something is", "A time of year when people go on trips", "A drawing of the sea"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>location<\/i>?", "options": ["\"The map shows the exact\"", "\"the volcano\"", "\"near the coast\"", "\"the place marked\""], "answer": 3}], "zh": "地圖上標出火山的確切位置；就是靠近海岸、畫著紅色星星的那個地方。", "clue": "分號後面用 <i>the place<\/i> 換句話說 location。", "elim": "(A) 火山才是山，location 是它「在哪裡」；(C) 是時間不是地點；(D) 地圖是畫，不是位置。"}, {"id": "2", "part": 0, "word": "regions", "ext": false, "sentence": "Alaska is divided into five <u>regions<\/u>, large areas of land, and each part has its own weather, plants, and animals.", "steps": [{"q": "What does the word <i>regions<\/i> mean in this sentence?", "options": ["Large areas or parts of a place", "Rivers and lakes", "Big cities", "Kinds of animals that live in the state"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>regions<\/i>?", "options": ["\"Alaska is divided into five\"", "\"large areas of land\"", "\"its own weather\"", "\"plants, and animals\""], "answer": 1}], "zh": "阿拉斯加分成五個地區，也就是五大塊土地，每一區都有自己的天氣、植物和動物。", "clue": "同位語 <i>large areas of land<\/i> 下定義；後面又用 <i>each part<\/i> 換句話說。", "elim": "(D) 動物是每一區「有的東西」，不是 region 本身；(B)(C) 太小，也不是「分成五塊」。"}, {"id": "3", "part": 0, "word": "layer", "ext": false, "sentence": "Each winter a new <u>layer<\/u> of snow falls on top of the old one, so after many years the snow looks like a stack of pancakes.", "steps": [{"q": "What does the word <i>layer<\/i> mean in this sentence?", "options": ["A deep hole in the ground that slowly fills with snow", "A strong storm", "A tool for digging", "A flat sheet of something lying on top of another"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>layer<\/i>?", "options": ["\"Each winter\"", "\"falls on top of the old one\"", "\"after many years\"", "\"the snow\""], "answer": 1}], "zh": "每年冬天，新的一層雪落在舊的那層上面，所以很多年後，雪看起來就像一疊鬆餅。", "clue": "<i>falls on top of the old one<\/i> 說明是一片疊一片；比喻 <i>a stack of pancakes<\/i> 也是線索。", "elim": "(A) 洞是凹下去的；(B)(C) 不會「疊」起來。"}, {"id": "4", "part": 0, "word": "glacier", "ext": true, "sentence": "A <u>glacier<\/u> is a huge river of ice that moves very slowly down a mountain, only a few feet each day.", "steps": [{"q": "What does the word <i>glacier<\/i> mean in this sentence?", "options": ["A fast river of warm water from a mountain", "A volcano covered with snow", "A huge mass of ice that moves slowly", "A kind of snowstorm"], "answer": 2}, {"q": "Which words from the sentence are the best clue to the meaning of <i>glacier<\/i>?", "options": ["\"a huge river of ice that moves very slowly\"", "\"down a mountain\"", "\"each day\"", "\"only a few feet\""], "answer": 0}], "zh": "冰河是一條巨大的冰之河，非常緩慢地往山下移動，一天只移動幾英尺。", "clue": "<i>is a …<\/i> 直接下定義：<i>a huge river of ice that moves very slowly<\/i>。", "elim": "(A) <i>fast<\/i>、<i>warm water<\/i> 都和定義相反；(B)(D) 不是會移動的冰。"}, {"id": "5", "part": 0, "word": "growth", "ext": false, "sentence": "The <u>growth<\/u> of the glacier was easy to see: every year it became longer, thicker, and heavier.", "steps": [{"q": "What does the word <i>growth<\/i> mean in this sentence?", "options": ["The process of getting bigger", "The process of getting smaller", "The color of the ice", "The sound of the ice"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>growth<\/i>?", "options": ["\"of the glacier was easy to see\"", "\"of the glacier\"", "\"easy\"", "\"longer, thicker, and heavier\""], "answer": 3}], "zh": "冰河的成長很容易看出來：它每年都變得更長、更厚、更重。", "clue": "冒號後面三個比較級 <i>longer, thicker, heavier<\/i>，都是在「變大」。grow（長大）＋ -th＝成長。", "elim": "(B) 相反；(C)(D) 句子沒提到顏色或聲音。"}, {"id": "6", "part": 1, "word": "extreme", "ext": true, "sentence": "In northern Alaska the cold is <u>extreme<\/u>; in winter it can drop to fifty degrees below zero, much colder than the inside of a freezer.", "steps": [{"q": "What does the word <i>extreme<\/i> mean in this sentence?", "options": ["Mild and gentle", "Normal and usual for that time of year", "Short and quick", "Very great, much more than usual"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>extreme<\/i>?", "options": ["\"In northern Alaska the cold is\"", "\"in winter\"", "\"the cold is\"", "\"fifty degrees below zero\""], "answer": 3}], "zh": "阿拉斯加北部冷得非常極端；冬天可以降到零下五十度，比冷凍庫裡面還冷得多。", "clue": "分號後面用數字和比較說明有多冷：<i>fifty degrees below zero<\/i>、<i>much colder than … a freezer<\/i>。", "elim": "(A)(B) 和零下五十度矛盾；(C) 句子沒說時間短。"}, {"id": "7", "part": 1, "word": "spot", "ext": false, "sentence": "If you are lucky, you might <u>spot<\/u> a polar bear; keep your eyes open, because you can see one walking on the ice.", "steps": [{"q": "What does the word <i>spot<\/i> mean in this sentence?", "options": ["A small dirty mark", "To see or notice", "To feed an animal", "To run away from"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>spot<\/i>?", "options": ["\"you can see one\"", "\"a polar bear\"", "\"If you are lucky\"", "\"on the ice\""], "answer": 0}], "zh": "運氣好的話，你可能會看到北極熊；把眼睛睜大，因為你可能看到一隻在冰上走路。", "clue": "<i>keep your eyes open<\/i>、<i>you can see one<\/i> 都在說「看」。", "elim": "(A) spot 當名詞是「斑點」，但這裡放在 <i>might<\/i> 後面是動詞；(C)(D) 和眼睛無關。"}, {"id": "8", "part": 1, "word": "soil", "ext": false, "sentence": "Farmers in the south grow potatoes and carrots in the rich, dark <u>soil<\/u>, the top layer of the earth where plants put their roots.", "steps": [{"q": "What does the word <i>soil<\/i> mean in this sentence?", "options": ["Fresh water", "Hard ice", "Large rocks that farmers move out of the way", "The top layer of earth where plants grow"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>soil<\/i>?", "options": ["\"Farmers in the south\"", "\"potatoes and carrots\"", "\"the top layer of the earth where plants put their roots\"", "\"rich, dark\""], "answer": 2}], "zh": "南部的農夫在肥沃的黑色土壤裡種馬鈴薯和紅蘿蔔，土壤就是植物扎根的那層表土。", "clue": "同位語 <i>the top layer of the earth where plants put their roots<\/i> 直接下定義。", "elim": "(A)(B)(C) 都不能讓植物扎根。"}, {"id": "9", "part": 2, "word": "seasons", "ext": false, "sentence": "Alaska has four <u>seasons<\/u>, spring, summer, fall, and winter, and each part of the year brings very different weather.", "steps": [{"q": "What does the word <i>seasons<\/i> mean in this sentence?", "options": ["Holidays when people give each other presents", "Parts of the year with their own weather", "Days of the week", "Kinds of food"], "answer": 1}, {"q": "Which words from the sentence are the best clue to the meaning of <i>seasons<\/i>?", "options": ["\"spring, summer, fall, and winter\"", "\"Alaska has four\"", "\"very different\"", "\"brings\""], "answer": 0}], "zh": "阿拉斯加有四季：春、夏、秋、冬，每一段時間的天氣都很不一樣。", "clue": "列舉的例子 <i>spring, summer, fall, and winter<\/i>；後面又用 <i>each part of the year<\/i> 換句話說。", "elim": "(C) 一週有七天，不是四個；(A)(D) 和天氣無關。"}, {"id": "10", "part": 2, "word": "temperate", "ext": false, "sentence": "In summer the weather is <u>temperate<\/u>, not too hot and not too cold, so people enjoy hiking and fishing.", "steps": [{"q": "What does the word <i>temperate<\/i> mean in this sentence?", "options": ["Mild; not too hot or too cold", "Extremely hot", "Freezing cold", "Stormy and windy almost every single day"], "answer": 0}, {"q": "Which words from the sentence are the best clue to the meaning of <i>temperate<\/i>?", "options": ["\"In summer\"", "\"people enjoy hiking\"", "\"the weather is\"", "\"not too hot and not too cold\""], "answer": 3}], "zh": "夏天的天氣很溫和，不會太熱也不會太冷，所以大家喜歡去健行和釣魚。", "clue": "逗號後面 <i>not too hot and not too cold<\/i> 直接解釋。", "elim": "(B)(C) 被 <i>not too hot / not too cold<\/i> 排除；(D) 暴風天不適合健行。"}, {"id": "11", "part": 2, "word": "lively", "ext": false, "sentence": "The summer festival was <u>lively<\/u>; people danced, sang, and laughed in the streets until late at night.", "steps": [{"q": "What does the word <i>lively<\/i> mean in this sentence?", "options": ["Quiet and boring", "Sad and lonely", "Dangerous and scary for children", "Full of energy and fun"], "answer": 3}, {"q": "Which words from the sentence are the best clue to the meaning of <i>lively<\/i>?", "options": ["\"The summer festival\"", "\"until late at night\"", "\"in the streets until late at night\"", "\"people danced, sang, and laughed\""], "answer": 3}], "zh": "夏日慶典非常熱鬧；大家在街上跳舞、唱歌、大笑，一直到深夜。", "clue": "分號後面三個動作 <i>danced, san
